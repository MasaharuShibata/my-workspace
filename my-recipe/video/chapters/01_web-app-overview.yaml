title: "1章 Webアプリとは何か"
footer: "my-recipe 開発教材"
voice: "ja-JP-NanamiNeural"
rate: "+4%"

slides:

- kind: title
  kicker: "my-recipe 開発教材 / Part 0"
  heading: "Webアプリとは何か"
  sub: "ブラウザ・サーバー・データベース・API"
  narration: |
    my-recipe 開発教材、第1章。Webアプリとは何か。
    この章では、ブラウザ、サーバー、データベース、API。
    この4つがそれぞれ何をする係なのかを見ていきます。

- kind: points
  heading: "この章のゴール"
  items:
  - text: "4つの登場人物の役割を、人に説明できる"
    note: "ブラウザ / サーバー / データベース / 外部API"
  - text: "リクエストとレスポンスの往復で、全体を捉えられる"
  - text: "APIキーをどこに置くべきか、理由とともに判断できる"
  narration: |
    ゴールは3つです。4つの登場人物の役割を人に説明できること。
    すべてをリクエストとレスポンスの往復として捉えられること。
    そして、APIキーをどこに置くべきかを、理由とともに判断できること。

- kind: callout
  text: |
    この章では、コードを1行も書きません。
    ですが、ここを飛ばすと、後半で必ず迷子になります。
  title: "最初の章にして、いちばん大事な章"
  narration: |
    この章では、コードを1行も書きません。
    地味に見えますが、ここを飛ばすと後半で必ず迷子になります。
    最初の章にして、いちばん大事な章です。

# ------------------------------------------------------------------ 1.1

- kind: section
  num: "1.1"
  heading: "Webサイトを開くと、何が起きているのか"
  narration: |
    まず、Webサイトを開いたとき、何が起きているのかから始めます。

- kind: diagram
  heading: "アドレス欄にURLを打って、エンターを押す"
  nodes:
  - t: row
    items:
    - { t: node, title: "あなたのブラウザ", sub: "スマホ / パソコン" }
    - { t: arrow-h, label: "トップページをください", glyph: "───────▶" }
    - { t: node, title: "どこかのコンピューター", sub: "サーバー" }
  narration: |
    アドレス欄にURLを打って、エンターを押す。
    このとき、あなたのパソコンの中では、実はほとんど何も起きていません。
    起きているのは、世界のどこかにある別のコンピューターとの会話です。

- kind: diagram
  heading: "この往復が、すべての基本"
  nodes:
  - t: row
    items:
    - { t: node, title: "ブラウザ", sub: "クライアント" }
    - { t: arrows, out_label: "リクエスト(お願い)", back_label: "レスポンス(返事・HTML)" }
    - { t: node, title: "サーバー", sub: "探す・作る" }
  - t: node
    title: "誰が、誰に、何をお願いして、何が返ってくるか"
    sub: "Webアプリの話は、突き詰めると全部これ"
    tone: "accent"
  narration: |
    ブラウザがお願いをして、相手が返事を返す。
    この往復を、リクエストとレスポンスと呼びます。
    Webアプリの話は、突き詰めると全部これです。
    誰が、誰に、何をお願いして、何が返ってくるか。これだけです。

- kind: cards
  heading: "クライアントとサーバー"
  cards:
  - label: "お願いする側"
    title: "クライアント"
    text: "ここではあなたのブラウザ。\n画面の表示と、操作の受け取りを担当する。"
  - label: "返事する側"
    title: "サーバー"
    text: "24時間動きっぱなしのコンピューター。\n頼まれたものを探して返す。"
  narration: |
    お願いする側をクライアントと呼びます。ここではブラウザです。
    返事する側をサーバーと呼びます。24時間動きっぱなしのコンピューターです。

- kind: callout
  title: "サーバーは、特別な機械ではない"
  text: |
    「返事をする役をやっているコンピューター」のことを、サーバーと呼ぶだけ。
    自分のノートパソコンでも、その役をやらせればサーバーになる。
  narration: |
    ここで、ひとつ誤解を解いておきます。
    サーバーというのは、特別な機械のことではありません。
    返事をする役をやっているコンピューターのことを、そう呼ぶだけです。
    実際、開発中は自分のノートパソコンをサーバーとして動かします。

# ------------------------------------------------------------------ 1.2

- kind: section
  num: "1.2"
  heading: "WebサイトとWebアプリの違い"
  narration: |
    次に、WebサイトとWebアプリの違いです。

- kind: table
  heading: "境目は「データが変わるか」"
  head: ["", "Webサイト", "Webアプリ"]
  rows:
  - ["例", "会社の紹介ページ、ブログ", "Gmail、家計簿、my-recipe"]
  - ["中身", "誰が見ても同じ内容", "*操作すると内容が変わる"]
  - ["データ", "~基本なし", "*保存する(データベースが要る)"]
  narration: |
    Webサイトは、会社の紹介ページやブログ。誰が見ても同じ内容で、データの保存は基本的に要りません。
    Webアプリは、Gmailや家計簿、そして今回作る my-recipe。
    操作すると内容が変わり、その変化を保存する必要があります。
    実務上の分かれ目は、利用者の操作でデータが変わるかどうか、です。

- kind: points
  heading: "my-recipe は、しっかりWebアプリ"
  items:
  - text: "食材を入力する"
    note: "利用者の入力がある"
  - text: "AIがレシピを返す"
    note: "その場で作られる、毎回違う内容"
  - text: "気に入ったら保存する"
    note: "データが残る"
  narration: |
    my-recipe の場合、まず利用者が食材を入力します。
    次にAIがレシピを返します。これはその場で作られる、毎回違う内容です。
    そして気に入ったら保存する。データが残ります。
    というわけで、しっかりWebアプリです。

# ------------------------------------------------------------------ 1.3

- kind: section
  num: "1.3"
  heading: "my-recipe に登場する4人"
  narration: |
    では、my-recipe に登場する4人を紹介します。

- kind: diagram
  heading: "4つの「場所」"
  nodes:
  - t: node
    title: "① ブラウザ"
    sub: "利用者のスマホ / PC の中。画面と操作を担当"
  - t: arrow
    label: "HTTPS"
  - t: node
    title: "② Vercel (Next.js)"
    sub: "画面を返す + 秘密の処理をする"
    tone: "accent"
  - t: row
    items:
    - { t: node, title: "③ Supabase", sub: "データベース。保存しておく" }
    - { t: node, title: "④ Claude API", sub: "AI。レシピを考える" }
  narration: |
    1人目がブラウザ。利用者のスマホやパソコンの中で動き、画面と操作を担当します。
    2人目が Vercel。ここで Next.js のアプリが動いています。
    3人目が Supabase。データベースです。
    4人目が Claude API。AIです。
    ブラウザから、SupabaseやClaude APIに直接は繋ぎません。必ずVercelを経由します。

- kind: table
  heading: "覚え方"
  head: ["", "名前", "役割", "覚え方"]
  rows:
  - ["①", "ブラウザ", "画面を表示し、クリックや入力を受け取る", "*お客さんの手元"]
  - ["②", "Vercel (Next.js)", "画面を組み立てる。秘密情報を使う処理をする", "*お店のカウンターと厨房"]
  - ["③", "Supabase", "お気に入りレシピを保存しておく", "*倉庫"]
  - ["④", "Claude API", "食材からレシピを考える", "*外注先の料理人"]
  narration: |
    お店に例えると分かりやすいです。
    ブラウザがお客さんの手元。Vercelがお店のカウンターと厨房。
    Supabaseが倉庫。そしてClaude APIが、外注先の料理人です。

- kind: section
  num: "重要"
  heading: "なぜ ④ を ① から直接呼ばないのか"
  narration: |
    ここからが、この章でいちばん重要な話です。
    なぜAIを、ブラウザから直接呼ばないのか。

- kind: cards
  heading: "APIキーは「お金を払う権利の証明書」"
  cards:
  - label: "✕ 危険な構成"
    tone: "bad"
    title: "ブラウザにキーを置く"
    items:
    - "ブラウザのコードは利用者が全部見られる"
    - "F12を押せば誰でも読める"
    - "世界中の誰もが、あなたのお金でAIを使える"
  - label: "○ 正しい構成"
    tone: "good"
    title: "サーバーにキーを置く"
    items:
    - "ブラウザは食材だけを送る"
    - "キーを持つVercelがClaude APIを呼ぶ"
    - "Vercelの中身はブラウザから見えない"
  narration: |
    Claude APIを使うには、APIキーが要ります。お金を払う権利の証明書だと思ってください。
    一方、ブラウザで動くコードは、利用者が全部中身を見られます。F12を押せば誰でも読めます。
    つまり、ブラウザにAPIキーを置いた瞬間に、
    世界中の誰もが、あなたのお金でAIを使えるようになる、ということです。
    だから、ブラウザは食材だけを送り、キーを持つサーバーがAIを呼びます。

- kind: callout
  tone: "danger"
  title: "NEXT_PUBLIC_ を付けたら、即アウト"
  text: |
    この接頭辞が「付いている」変数は、ブラウザに公開される。
    「付いていない」変数は、サーバーだけ。
  narration: |
    この教材では、あとで、ネクスト・アンダーバー・パブリック・アンダーバー、
    という接頭辞が出てきます。
    これが付いている変数はブラウザに公開される。付いていないものはサーバーだけ。
    そういうルールです。APIキーにこれを付けたら、即アウトです。

# ------------------------------------------------------------------ 1.4

- kind: section
  num: "1.4"
  heading: "データベースとは何か"
  narration: |
    次は、データベースです。

- kind: table
  heading: "テーブル = 表。my-recipe では1つだけ"
  head: ["id", "title", "genre", "cooking_time", "created_at"]
  rows:
  - ["a1b2…", "鶏むね肉と白菜の生姜炒め", "和食", "20分", "2026-09-18 10:00"]
  - ["c3d4…", "白菜のクリーム煮", "洋食", "25分", "2026-09-18 11:30"]
  narration: |
    最初のうちは、表計算ソフトをプログラムから安全に読み書きできるようにしたもの、
    くらいの理解で十分です。
    my-recipe が使うのは、お気に入りレシピを入れる表が1つだけです。
    横の1行をレコードと呼び、これがお気に入り1件にあたります。
    縦の1列をカラムと呼び、これが1件が持つ項目です。

- kind: table
  heading: "やることは4つだけ ー CRUD"
  head: ["操作", "SQLでの命令", "my-recipe では"]
  rows:
  - ["Create(作る)", "INSERT", "お気に入り登録"]
  - ["Read(読む)", "SELECT", "お気に入り一覧の表示"]
  - ["Update(更新)", "UPDATE", "*使わない(編集機能が無いため)"]
  - ["Delete(消す)", "DELETE", "お気に入り削除"]
  narration: |
    データベースに対してやることは、実は4つしかありません。
    頭文字を取って、CRUD、クラッドと呼びます。
    作る、読む、更新する、消す。
    このうち my-recipe は、更新を使いません。

- kind: callout
  title: "作らないものを決めるほうが、実は難しい"
  text: |
    Update を持たないのは、設計で「編集機能は作らない」と決めたから。
    機能を減らすのも、立派な設計判断。
  narration: |
    更新を持たないのは、設計の段階で、編集機能は作らない、と決めたからです。
    機能を減らすのも、立派な設計判断です。
    むしろ、作らないものを決めるほうが、実は難しいのです。

- kind: points
  heading: "Supabase とは"
  items:
  - text: "PostgreSQL という有名なデータベースを、Webから使える形で貸してくれるサービス"
  - text: "自分でデータベースサーバーを立てる作業は、普通なら数日かかる"
    note: "それが登録5分で終わる"
  narration: |
    そして Supabase とは何か。
    PostgreSQL、ポストグレスキューエルという有名なデータベースを、
    Webから使える形で貸してくれるサービスです。
    自分でデータベースサーバーを立てる作業は、普通なら数日かかります。
    それが、登録5分で終わります。

# ------------------------------------------------------------------ 1.5

- kind: section
  num: "1.5"
  heading: "API とは何か"
  narration: |
    続いて、APIです。

- kind: cards
  heading: "人間向けの窓口と、プログラム向けの窓口"
  cards:
  - label: "人間向け"
    title: "画面(HTML)"
    text: "見た目がある。\n人が読んで操作するためのもの。"
  - label: "プログラム向け"
    title: "API(JSON)"
    text: "見た目がない。データだけ。\nプログラムが読むためのもの。"
  narration: |
    APIは、プログラムがプログラムにお願いするための窓口です。
    人間向けの画面がWebサイトなら、プログラム向けの窓口がAPI。
    人間にはHTMLという見た目のあるものを返し、
    プログラムにはJSONという、データだけのものを返します。

- kind: code
  heading: "JSON ー APIがやりとりする書式"
  caption: "レシピ1件を表すJSON"
  code: |
    {
      "title": "鶏むね肉と白菜の生姜炒め",
      "cookingTime": "20分",
      "servings": "2人分",
      "ingredients": ["鶏むね肉 200g", "白菜 1/4個"],
      "steps": ["鶏むね肉を一口大に切る", "フライパンで炒める"]
    }
  narration: |
    これがJSONです。ジェイソンと読みます。
    もともとJavaScriptのオブジェクトの書き方だったものが、
    そのままデータ交換の標準になりました。

- kind: points
  heading: "JSONのルールは、これだけ"
  items:
  - text: "波かっこで囲むと「まとまり」"
    note: "オブジェクトと呼ぶ"
  - text: "角かっこで囲むと「並び」"
    note: "配列と呼ぶ"
  - text: "キーと値をコロンでつなぐ。区切りはカンマ"
  - text: "文字列は必ずダブルクォートで囲む"
  narration: |
    ルールは少ないです。
    波かっこで囲むと、まとまり。これをオブジェクトと呼びます。
    角かっこで囲むと、並び。これを配列と呼びます。
    中身は、キーと値をコロンでつないだ形で書き、区切りはカンマ。
    そして文字列は、必ずダブルクォートで囲みます。

- kind: flow
  heading: "my-recipe では、3か所をJSONが流れる"
  steps:
  - { who: "①", text: "ブラウザ → 自分のサーバー。食材のリストとジャンルを送る" }
  - { who: "②", text: "自分のサーバー → Claude API。食材を含む指示文を送る" }
  - { who: "③", text: "Claude API → 自分のサーバー → ブラウザ。レシピのJSONが返る" }
  narration: |
    my-recipe では、この形のJSONが3か所を流れます。
    ブラウザから自分のサーバーへ。自分のサーバーからClaude APIへ。
    そしてClaude APIから、サーバーを経由してブラウザへ戻ってきます。

- kind: table
  heading: "HTTPメソッド ー よく使うのは2つだけ"
  head: ["メソッド", "意味", "例"]
  rows:
  - ["*GET", "ください(取得)", "ページを開く、お気に入り一覧を取る"]
  - ["*POST", "これを処理して(送信)", "食材を送ってレシピを作ってもらう"]
  narration: |
    リクエストには種類があります。よく使うのは2つだけ。
    GETは、ください、つまり取得。
    POSTは、これを処理して、つまり送信です。

- kind: callout
  tone: "danger"
  title: "GETで課金処理をしてはいけない"
  text: |
    「ページを開く」は必ずGET。ブラウザが勝手に先読みすることがある。
    my-recipe がレシピ生成をPOSTにしているのは、これが理由の1つ。
  narration: |
    ここで警告をひとつ。
    ページを開く動作は、必ずGETになります。
    ですから、GETで課金処理をしてはいけません。
    ブラウザが勝手に先読みすることがあるからです。
    my-recipe でレシピ生成をPOSTにしているのは、これが理由の1つです。

- kind: table
  heading: "ステータスコード ー レスポンスに付く3桁の番号"
  head: ["番号", "意味", "よく見るやつ"]
  rows:
  - ["200", "成功", "OK"]
  - ["400", "*お願いの仕方が悪い(クライアントのミス)", "食材が空っぽ"]
  - ["404", "そんなページ無い", "URLの打ち間違い"]
  - ["500", "*サーバー側が壊れた", "AIの呼び出しに失敗"]
  narration: |
    レスポンスには、3桁の番号が付いてきます。
    200番は成功。400番は、お願いの仕方が悪い。404番は、そんなページは無い。
    そして500番は、サーバー側が壊れた、という意味です。

- kind: callout
  title: "400番台か、500番台か"
  text: |
    400番台 = クライアントのミス。500番台 = サーバーの故障。
    どちらのコードを疑うかが変わる。エラーを読むとき、まずここを見る。
  narration: |
    400番台なのか500番台なのかで、自分のどちらのコードを疑うべきかが変わります。
    エラーを読むときは、まずここを見る癖をつけてください。

# ------------------------------------------------------------------ 1.6

- kind: section
  num: "1.6"
  heading: "1回の操作を、最後まで追いかける"
  narration: |
    ここまでの話を、全部つなげます。
    利用者が、レシピを考えてもらう、というボタンを押した瞬間の旅を追いかけます。

- kind: flow
  heading: "「レシピを考えてもらう」を押した瞬間"
  steps:
  - { who: "ブラウザ", text: "「鶏むね肉, 白菜」と入力してボタンを押す", state: "on" }
  - { who: "ブラウザ", text: "入力チェック。空じゃないか、10個以内か", state: "on" }
  - { who: "ブラウザ", text: "POST /api/generate-recipe で食材とジャンルを送る", state: "on" }
  - { who: "サーバー", text: "受け取った値を、もう一度チェックする", state: "dim" }
  - { who: "サーバー", text: "環境変数からAPIキーを取り出す", state: "dim" }
  - { who: "Claude", text: "1〜3秒考えて、レシピJSONを返す", state: "dim" }
  - { who: "ブラウザ", text: "受け取ったJSONを画面に描画する", state: "dim" }
  narration: |
    まずブラウザ。利用者が、鶏むね肉、白菜、と入力してボタンを押します。
    ブラウザは入力チェックをします。空じゃないか、10個以内か。
    チェックを通ったら、自分のサーバーのレシピ生成の窓口に、POSTで送ります。

- kind: flow
  heading: "サーバー側で起きていること"
  steps:
  - { who: "ブラウザ", text: "「鶏むね肉, 白菜」と入力してボタンを押す", state: "dim" }
  - { who: "ブラウザ", text: "入力チェック。空じゃないか、10個以内か", state: "dim" }
  - { who: "ブラウザ", text: "POST /api/generate-recipe で食材とジャンルを送る", state: "dim" }
  - { who: "サーバー", text: "受け取った値を、もう一度チェックする", state: "on" }
  - { who: "サーバー", text: "環境変数からAPIキーを取り出す", state: "on" }
  - { who: "Claude", text: "1〜3秒考えて、レシピJSONを返す", state: "on" }
  - { who: "ブラウザ", text: "受け取ったJSONを画面に描画する", state: "dim" }
  narration: |
    次にサーバー。受け取った値を、もう一度チェックします。
    ここが大事で、ブラウザでのチェックは信用しません。理由は後の章で詳しくやります。
    チェックを通ったら、環境変数からAPIキーを取り出し、Claude APIにお願いします。
    Claudeは1秒から3秒ほど考えて、レシピのJSONを返します。

- kind: flow
  heading: "「お気に入り登録」を押すと、別の旅が始まる"
  steps:
  - { who: "ブラウザ", text: "ボタンを押す" }
  - { who: "サーバー", text: "Supabase へ INSERT。1行追加する" }
  - { who: "Supabase", text: "1行保存して「OK」を返す" }
  - { who: "ブラウザ", text: "表示が「登録しました」に変わる" }
  narration: |
    そして、お気に入り登録のボタンを押すと、別の旅が始まります。
    サーバーがSupabaseに1行の追加を指示し、SupabaseがOKを返す。
    そして画面の表示が、登録しました、に変わります。
    この2つの旅を、この教材ではステップ4から6で作ります。

