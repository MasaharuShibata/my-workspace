# ============================================================ 問い①

- kind: agenda
  heading: "まず1つめ"
  items:
  - { text: "Webアプリを開いたとき、何が起きている？", state: "now", at: 0 }
  - { text: "なぜAPIキーをブラウザに置いてはいけない？", at: 0 }
  - { text: "データの保存とAIは、どう繋がっている？", at: 0 }
  reveal: false
  narration: |
    まず1つめ。Webアプリを開いたとき、何が起きているのか。

- kind: punch
  text: "URLを打ってエンターを押したとき、\nあなたのパソコンの中では、ほぼ何も起きていない。"
  em: ["ほぼ何も起きていない"]
  narration: |
    アドレス欄にURLを打って、エンターを押す。
    このとき実は、あなたのパソコンの中では、ほとんど何も起きていません。

- kind: anim
  name: "request-response"
  frames: 26
  heading: "起きているのは、遠くのコンピューターとの会話"
  narration: |
    起きているのは、世界のどこかにある別のコンピューターとの会話です。
    ブラウザが「ページをください」とお願いを送る。
    相手がそれを受けて、「はい、これです」と返事を返す。
    この往復。これだけです。

- kind: punch
  text: "リクエストと、レスポンス。"
  em: ["リクエスト", "レスポンス"]
  sub: "Webアプリの話は、突き詰めると全部これ。誰が、誰に、何をお願いして、何が返るか。"
  narration: |
    お願いをリクエスト、返事をレスポンスと呼びます。
    Webアプリの話は、突き詰めると全部これです。
    誰が、誰に、何をお願いして、何が返ってくるか。

- kind: verdict
  heading: "呼び方が2つあるだけ"
  sides:
  - badge: "お願いする側"
    head: "クライアント"
    desc: "ここではあなたのブラウザ。\n画面を出して、操作を受け取る。"
    at: 1
  - badge: "返事する側"
    head: "サーバー"
    desc: "24時間動いているコンピューター。\n頼まれたものを返す。"
    at: 2
  narration: |
    お願いする側をクライアント、返事する側をサーバーと呼びます。
    クライアントは、ここではあなたのブラウザ。
    サーバーは、24時間動いているコンピューターです。

- kind: punch
  text: "サーバーは、特別な機械のことではない。"
  sub: "「返事をする役」をやっているコンピューターのこと。開発中は、自分のノートPCがサーバーになる。"
  narration: |
    ここで誤解をひとつ解いておきます。
    サーバーは、特別な機械のことではありません。
    返事をする役をやっているコンピューター、という意味でしかない。
    だから開発中は、自分のノートパソコンがサーバーになります。

- kind: actors
  heading: "このアプリに出てくるのは、この4人だけ"
  actors:
  - { icon: "browser", name: "ブラウザ", role: "画面を出す\n操作を受け取る", metaphor: "お客さんの手元", at: 1 }
  - { icon: "server", name: "サーバー", role: "画面を組み立てる\n秘密を使う処理をする", metaphor: "カウンターと厨房", tone: "accent", at: 2 }
  - { icon: "database", name: "データベース", role: "お気に入りを\n保存しておく", metaphor: "倉庫", at: 3 }
  - { icon: "ai", name: "AI", role: "食材からレシピを\n考える", metaphor: "外注先の料理人", at: 4 }
  narration: |
    そして、このアプリに出てくる登場人物は、たった4人です。
    ブラウザ。お客さんの手元です。
    サーバー。お店のカウンターと厨房にあたります。
    データベース。保存しておく倉庫。
    そしてAI。食材からレシピを考える、外注先の料理人です。
    この4人の関係が分かれば、1つめの問いは終わりです。

# ============================================================ 問い②

- kind: agenda
  heading: "ここからが本題"
  items:
  - { text: "Webアプリを開いたとき、何が起きている？", state: "done", at: 0 }
  - { text: "なぜAPIキーをブラウザに置いてはいけない？", state: "now", at: 0 }
  - { text: "データの保存とAIは、どう繋がっている？", at: 0 }
  reveal: false
  narration: |
    さて、ここからがこの動画の本題です。
    なぜ、APIキーをブラウザに置いてはいけないのか。

- kind: split
  icon: "key"
  heading: "APIキーとは"
  big: "「お金を払う権利」の証明書"
  small: "AIを呼ぶには、これが要る。\n持っている人が、持ち主の財布で使える。"
  narration: |
    AIを呼び出すには、APIキーというものが要ります。
    これは、お金を払う権利の証明書だと思ってください。
    持っている人なら誰でも、持ち主の財布でAIを使えてしまいます。

- kind: punch
  text: "ブラウザで動くコードは、\n利用者が全部、中身を読める。"
  ng: ["全部、中身を読める"]
  sub: "F12キーを押すだけ。隠す方法はありません。"
  narration: |
    ここで大事な事実を1つ。
    ブラウザで動くコードは、利用者が全部、中身を読めます。
    F12キーを押すだけです。そして、隠す方法はありません。

- kind: anim
  name: "key-leak"
  frames: 30
  heading: "だからブラウザに置くと、こうなる"
  narration: |
    つまり、ブラウザにAPIキーを置いた瞬間、こうなります。
    誰でも読める。誰でも持ち出せる。
    そして、世界中の誰もが、あなたのお金でAIを使えるようになる。
    冒頭の69万円は、これが起きた結果です。

- kind: verdict
  heading: "正解は、こう分ける"
  sides:
  - badge: "✕"
    tone: "ng"
    head: "ブラウザにキーを置く"
    desc: "ブラウザ → AI を直接呼ぶ。\n一見シンプルだが、キーが丸見え。"
    at: 1
  - badge: "○"
    tone: "ok"
    head: "サーバーにキーを置く"
    desc: "ブラウザは食材だけを送る。\nキーを持つサーバーがAIを呼ぶ。"
    at: 2
  narration: |
    正解はこうです。
    ブラウザからAIを直接呼ぶのではなく、間にサーバーを挟む。
    ブラウザは食材だけを送り、キーを持っているサーバーがAIを呼ぶ。

- kind: punch
  text: "サーバーの中は、利用者からは見えない。"
  em: ["見えない"]
  sub: "だから、そこに置いた秘密は秘密のままでいられる。"
  narration: |
    サーバーの中身は、利用者からは見えません。
    だから、そこに置いた秘密は、秘密のままでいられるのです。

- kind: callout
  tone: "danger"
  title: "覚えて帰ってほしい、たった1つのルール"
  text: |
    秘密にしたいものには、NEXT_PUBLIC_ を付けない。
    付いている変数は、ブラウザに公開される。
  narration: |
    実際のコードでは、ネクスト・アンダーバー・パブリック・アンダーバー、
    という接頭辞が出てきます。
    これが付いている変数は、ブラウザに公開されます。付いていないものはサーバーだけ。
    APIキーにこれを付けたら、即アウトです。
    この動画で覚えて帰ってほしいルールは、これ1つです。

# ============================================================ 問い③

- kind: agenda
  heading: "最後の問い"
  items:
  - { text: "Webアプリを開いたとき、何が起きている？", state: "done", at: 0 }
  - { text: "なぜAPIキーをブラウザに置いてはいけない？", state: "done", at: 0 }
  - { text: "データの保存とAIは、どう繋がっている？", state: "now", at: 0 }
  reveal: false
  narration: |
    最後の問いです。データの保存とAIは、どう繋がっているのか。

- kind: split
  icon: "database"
  heading: "データベースとは"
  big: "プログラムから読み書きできる、表"
  small: "このアプリで使う表は、たった1つ。\nお気に入り登録されたレシピが、1行ずつ入る。"
  narration: |
    まずデータベース。
    最初のうちは、プログラムから読み書きできる表、くらいの理解で十分です。
    このアプリで使う表は、たった1つ。
    お気に入り登録されたレシピが、1行ずつ入っていきます。

- kind: table
  heading: "1行が、お気に入り1件"
  head: ["料理名", "ジャンル", "調理時間", "登録日時"]
  rows:
  - ["鶏むね肉と白菜の生姜炒め", "和食", "20分", "9/18 10:00"]
  - ["白菜のクリーム煮", "洋食", "25分", "9/18 11:30"]
  narration: |
    こういう形です。横の1行が、お気に入り1件。縦の1列が、その項目。
    それだけです。

- kind: verdict
  heading: "やることは、たった4つ"
  sides:
  - badge: "C R"
    head: "作る / 読む"
    desc: "お気に入り登録\nお気に入り一覧の表示"
    at: 1
  - badge: "U D"
    head: "更新 / 消す"
    desc: "更新は使わない(編集機能なし)\n削除だけ使う"
    at: 2
  narration: |
    そして、データベースにやることは、たった4つしかありません。
    作る、読む、更新する、消す。頭文字を取ってCRUDと呼びます。
    このアプリでは、更新は使いません。編集機能を作らないと決めたからです。

- kind: punch
  text: "機能を減らすのも、立派な設計。"
  sub: "むしろ「作らないもの」を決めるほうが難しい。"
  narration: |
    機能を減らすのも、立派な設計判断です。
    むしろ、作らないものを決めるほうが、実は難しいんです。

- kind: split
  icon: "ai"
  heading: "API とは"
  big: "プログラム用の窓口"
  small: "人間向けの窓口が「画面」なら、\nプログラム向けの窓口が「API」。"
  narration: |
    次にAPI。
    人間向けの窓口が画面なら、プログラム向けの窓口がAPIです。
    人間にはHTMLという見た目のあるものを返し、
    プログラムにはJSONという、データだけのものを返します。

- kind: code
  heading: "これがJSON。難しくありません"
  caption: "レシピ1件"
  code: |
    {
      "title": "鶏むね肉と白菜の生姜炒め",
      "cookingTime": "20分",
      "ingredients": ["鶏むね肉 200g", "白菜 1/4個"],
      "steps": ["一口大に切る", "フライパンで炒める"]
    }
  reveal: false
  narration: |
    これがJSONです。見た目ほど難しくありません。
    波かっこで囲むと、まとまり。角かっこで囲むと、並び。
    あとは、名前と値をコロンでつなぐ。それだけのルールです。

- kind: verdict
  heading: "リクエストの種類も、2つ覚えれば足りる"
  sides:
  - badge: "GET"
    head: "ください"
    desc: "ページを開く\nお気に入り一覧を取る"
    at: 1
  - badge: "POST"
    head: "これを処理して"
    desc: "食材を送って\nレシピを作ってもらう"
    at: 2
  narration: |
    リクエストの種類も、2つ覚えれば足ります。
    GETは、ください。POSTは、これを処理して。

- kind: callout
  tone: "danger"
  title: "GETで課金処理をしてはいけない"
  text: |
    ページを開く動作は、必ずGET。
    ブラウザが勝手に先読みすることがある。
  narration: |
    ここで1つ注意です。
    ページを開く動作は、必ずGETになります。
    ブラウザが勝手に先読みすることがあるので、GETで課金処理をしてはいけません。
    このアプリがレシピ生成をPOSTにしているのは、これが理由の1つです。

- kind: table
  heading: "返事に付く番号。見る場所はここだけ"
  head: ["番号", "意味", "疑うところ"]
  rows:
  - ["200", "成功", "~—"]
  - ["400番台", "お願いの仕方が悪い", "*自分のブラウザ側のコード"]
  - ["500番台", "サーバーが壊れた", "*自分のサーバー側のコード"]
  narration: |
    そして、返事には3桁の番号が付いてきます。
    200番は成功。400番台は、お願いの仕方が悪い。500番台は、サーバーが壊れた。
    400番台か500番台かで、自分のどちらのコードを疑うかが変わります。
    エラーを読むときは、まずここを見る癖をつけてください。

# ============================================================ 通しで見る

- kind: section
  num: "通しで見る"
  heading: "ボタンを押してから、画面が変わるまで"
  narration: |
    ここまでの話を、全部つなげてみましょう。

- kind: flow
  heading: "「レシピを考えてもらう」を押した瞬間"
  steps:
  - { who: "ブラウザ", text: "食材を入力して、ボタンを押す" }
  - { who: "ブラウザ", text: "空じゃないか、10個以内かを確認して送る" }
  - { who: "サーバー", text: "受け取った値を、もう一度確認する" }
  - { who: "サーバー", text: "自分だけが持つAPIキーを取り出す" }
  - { who: "AI", text: "1〜3秒考えて、レシピを返す" }
  - { who: "ブラウザ", text: "返ってきたレシピを画面に描く" }
  narration: |
    まずブラウザ。食材を入力して、ボタンを押す。
    空じゃないか、10個以内かを確認して、サーバーに送ります。
    サーバーは、受け取った値をもう一度確認します。
    ここが大事で、ブラウザでの確認は信用しません。理由は後の章でやります。
    そして、自分だけが持つAPIキーを取り出して、AIを呼ぶ。
    AIが1秒から3秒考えて、レシピを返す。
    最後に、ブラウザがそれを画面に描く。これで完了です。

- kind: punch
  text: "キーが出てくるのは、サーバーの中だけ。"
  em: ["サーバーの中だけ"]
  sub: "ブラウザが送ったのは、食材の名前だけ。"
  narration: |
    もう一度見てください。
    APIキーが出てくるのは、サーバーの中だけです。
    ブラウザが送ったのは、食材の名前だけ。
    これが、69万円を防ぐ構造です。

# ============================================================ クイズ

- kind: punch
  text: "ここでクイズです。"
  sub: "「お気に入り一覧を開く」とき、AIは登場するでしょうか？"
  narration: |
    ここでクイズです。
    お気に入り一覧を開くとき、AIは登場するでしょうか。
    3秒、考えてみてください。

- kind: bigstat
  value: "登場しない"
  tone: "calm"
  caption: "保存済みのレシピを表示するだけだから。\n呼んでしまうと、一覧を開くたびにお金がかかる。"
  narration: |
    答えは、登場しません。
    保存済みのレシピを、倉庫から出して表示するだけだからです。
    ここでAIを呼んでしまうと、一覧を開くたびにお金がかかります。
    どこでお金が動くのかを意識できると、設計の判断ができるようになります。

