# my-recipe 開発教材 動画版 第1章
# 原本: my-recipe/tutorial/01_web-app-overview.md ＋ my-recipe/tutorial/00_index.md
#
# 第1章は「1章の解説」である前に「全26章の入口」である。
# そのため、章の中身に入る前に、次の3つをこの順で済ませる。
#
#   1. 何を作るのか  … 完成品を実際に動かして見せる(kind: demo)
#   2. 何をするのか  … 全26章でこれをゼロから作る、と宣言する
#   3. どう進むのか  … Part 0〜6 の章立てと、作る順番の方針
#
# そのあとで第1章の本題(Webアプリのしくみ)に入る。
# 本題は3つの問いに答える形にまとめ、「秘密はサーバーに置く」を山場に据える。
# 最後に、冒頭で見せたデモを裏側から説明し直して回収する。
#
# デモのコマは scripts/capture-demo.mjs で撮る(video/README.md を参照)。

title: "Webアプリのしくみ"
footer: "my-recipe 開発教材 #1"
voice: "ja-JP-NanamiNeural"
rate: "+6%"

slides:

# ============================================================ 1. 何を作るのか

- kind: punch
  text: "これから作るものを、\n先に見せます。"
  sub: "食材を入力すると、AIがレシピを考えてくれるWebアプリです。"
  narration: |
    この教材で作るものを、先に見てもらいます。
    手元にある食材を入力すると、AIがレシピを考えてくれるWebアプリです。

- kind: demo
  frames_dir: "demo/input"
  narration: |
    冷蔵庫に残っている食材を打ち込んで、ジャンルを選びます。
    ここまでは、まだあなたのパソコンの中だけの話です。

- kind: demo
  frames_dir: "demo/thinking"
  narration: |
    ボタンを押すと、数秒待たされます。
    この間に、注文が遠くのコンピューターへ飛んでいます。

- kind: demo
  frames_dir: "demo/result"
  narration: |
    レシピが返ってきました。
    材料も、分量も、手順も、AIがその場で考えたものです。
    決まった答えを引っ張り出しているわけではありません。

- kind: demo
  frames_dir: "demo/save"
  narration: |
    気に入ったレシピは、お気に入りに登録できます。
    押した瞬間に、データベースへ1行、書き込まれます。

- kind: demo
  frames_dir: "demo/list"
  narration: |
    別の画面を開くと、さっき保存したものがちゃんと残っています。
    開けば中身も見られますし、ジャンルで絞り込むこともできます。
    ただし、この画面ではAIを呼んでいません。
    保存してあるものを、倉庫から出してきて並べているだけです。
    同じように見える画面でも、裏でやっていることは違う。
    この違いが分かると、設計の話が見えるようになります。

# ============================================================ 2. 何をするのか

- kind: punch
  text: "これを、ゼロから作ります。"
  em: ["ゼロから"]
  sub: "空のフォルダひとつから、インターネットに公開するところまで。"
  narration: |
    今見てもらったもの。これをゼロから作ります。
    空のフォルダひとつの状態から、インターネットに公開して、
    人に使ってもらえる状態になるまでです。

- kind: bigstat
  value: "26"
  unit: "章"
  caption: "この動画は、その1章目です。"
  narration: |
    全部で26章あります。この動画は、その1章目です。

- kind: verdict
  heading: "対象は、こういう人です"
  sides:
  - badge: "こんな人へ"
    tone: "ok"
    head: "作ったことがない人"
    desc: "プログラミングは未経験か、\n学校で少し触った程度。"
    at: 1
  - badge: "やらないこと"
    head: "いきなり写経させない"
    desc: "なぜそう書くのかを毎回説明します。\n終わったら別の題材でも作れる状態を目指します。"
    at: 2
  narration: |
    想定しているのは、Webアプリを作ったことがない人です。
    プログラミングは未経験か、学校で少し触った程度で構いません。
    ただし、写して動いた、では終わらせません。
    なぜそう書くのかを毎回説明します。
    読み終わったとき、別の題材でも自分で作れる。そこを目指します。

# ============================================================ 3. どう進むのか

- kind: section
  num: "全体像"
  heading: "26章を、7つのまとまりで進みます"
  narration: |
    では、26章をどう進んでいくのか。
    大きく7つのまとまりに分かれています。

- kind: table
  heading: "章立て"
  head: ["まとまり", "章", "やること"]
  rows:
  - ["Part 0", "01 - 02", "*世界観をつかむ / 開発環境を作る"]
  - ["Part 1", "03 - 07", "HTML・CSS・JavaScript・TypeScript・React・Next.js"]
  - ["Part 2", "08", "設計する。要件定義から詳細設計まで"]
  - ["Part 3", "09 - 17", "*手を動かして作る。この教材の本体"]
  - ["Part 4", "18 - 21", "公開する。デプロイ・試験・エラーの読み方"]
  - ["Part 5", "22 - 24", "裏側を知る。ネットワーク・Vercel・Supabase"]
  - ["Part 6", "25", "商用化するなら何が要るか"]
  narration: |
    Part 0 は、世界観をつかむところ。今見ているこの章と、開発環境の準備です。
    Part 1 で、言語と道具の基礎をひととおり。
    HTML、CSS、JavaScript、TypeScript、React、Next.js と進みます。
    Part 2 は設計です。何を作るかを決めて、図と文章に落とします。
    Part 3 が本体。9つのステップに分けて、実際にアプリを組み上げます。
    Part 4 で公開します。デプロイ、試験、エラーの読み方まで。
    Part 5 は裏側です。なぜプッシュしただけで公開されるのか、といった話。
    Part 6 は、個人利用から商用に進むときに何が要るか。

- kind: punch
  text: "最初に詰まるのは、文法ではなく\n「何から書けばいいのか」。"
  em: ["「何から書けばいいのか」"]
  narration: |
    ここで1つ、先に言っておきたいことがあります。
    初心者が最初に詰まるのは、実は文法ではありません。
    真っ白なフォルダを前にして、で、何から書けばいいの、で止まるんです。

- kind: flow
  heading: "だから、この順番で作ります"
  steps:
  - { who: "1", text: "見た目だけ作る。押しても何も起きない画面" }
  - { who: "2", text: "画面を動かす。押すと反応するところまで" }
  - { who: "3", text: "偽のデータで通す。サーバー側は嘘のレシピを返す" }
  - { who: "4", text: "本物に差し替える。AIとデータベースに繋ぐ" }
  narration: |
    答えは、外側から内側へ、です。
    まず見た目だけ作ります。押しても何も起きない画面です。
    次にそれを動かします。押すと反応するところまで。
    その次が大事で、いったん偽のデータで通します。
    サーバーは、嘘のレシピを決め打ちで返すだけ。
    最後に、その偽物を本物に差し替える。AIとデータベースに繋ぎます。

- kind: punch
  text: "いきなりAIに繋ぎに行くと、\nほぼ確実に迷子になります。"
  ng: ["ほぼ確実に迷子になります"]
  sub: "画面もデータの形も決まっていないのに、中身から作ろうとするからです。"
  narration: |
    逆をやると、つまりいきなりAIに繋ぐところから書き始めると、
    ほぼ確実に迷子になります。
    画面もデータの形も決まっていないのに、中身から作ろうとするからです。

# ============================================================ 第1章 本編

- kind: section
  num: "第1章"
  heading: "Webアプリのしくみ"
  narration: |
    前置きは以上です。ここから第1章の本題に入ります。

- kind: agenda
  heading: "この章で答える、3つの問い"
  items:
  - "アプリを開いたとき、何が起きている？"
  - "なぜAPIキーをブラウザに置いてはいけない？"
  - "データの保存とAIは、どう繋がっている？"
  narration: |
    答える問いは3つです。
    1つめ。アプリを開いたとき、そもそも何が起きているのか。
    2つめ。なぜAPIキーをブラウザに置いてはいけないのか。
    3つめ。データの保存とAIは、どう繋がっているのか。
    この章ではコードは1行も書きません。
    ですがここを飛ばすと、後の章で必ず迷子になります。

# ---------------------------------------------------------- 問い①

- kind: agenda
  heading: "まず1つめ"
  items:
  - { text: "アプリを開いたとき、何が起きている？", state: "now", at: 0 }
  - { text: "なぜAPIキーをブラウザに置いてはいけない？", at: 0 }
  - { text: "データの保存とAIは、どう繋がっている？", at: 0 }
  reveal: false
  narration: |
    まず1つめ。アプリを開いたとき、何が起きているのか。

- kind: punch
  text: "URLを打ってエンターを押したとき、\nあなたのパソコンの中では、ほぼ何も起きていない。"
  em: ["ほぼ何も起きていない"]
  narration: |
    アドレス欄にURLを打って、エンターを押す。
    このとき実は、あなたのパソコンの中では、ほとんど何も起きていません。

- kind: anim
  name: "request-response"
  frames: 26
  heading: "起きているのは、遠くのコンピューターとの会話"
  narration: |
    起きているのは、世界のどこかにある別のコンピューターとの会話です。
    ブラウザが、ページをください、とお願いを送る。
    相手がそれを受けて、はい、これです、と返事を返す。
    この往復。これだけです。

- kind: punch
  text: "リクエストと、レスポンス。"
  em: ["リクエスト", "レスポンス"]
  sub: "Webアプリの話は、突き詰めると全部これ。誰が、誰に、何をお願いして、何が返るか。"
  narration: |
    お願いをリクエスト、返事をレスポンスと呼びます。
    Webアプリの話は、突き詰めると全部これです。
    誰が、誰に、何をお願いして、何が返ってくるか。

- kind: verdict
  heading: "呼び方が2つあるだけ"
  sides:
  - badge: "お願いする側"
    head: "クライアント"
    desc: "ここではあなたのブラウザ。\n画面を出して、操作を受け取る。"
    at: 1
  - badge: "返事する側"
    head: "サーバー"
    desc: "24時間動いているコンピューター。\n頼まれたものを返す。"
    at: 2
  narration: |
    お願いする側をクライアント、返事する側をサーバーと呼びます。
    クライアントは、ここではあなたのブラウザ。
    サーバーは、24時間動いているコンピューターです。
    ただしサーバーは、特別な機械のことではありません。
    返事をする役をやっているコンピューター、という意味でしかない。
    だから開発中は、自分のノートパソコンがサーバーになります。

- kind: actors
  heading: "さっきのデモに出ていたのは、この4人だけ"
  actors:
  - { icon: "browser", name: "ブラウザ", role: "画面を出す\n操作を受け取る", metaphor: "お客さんの手元", at: 1 }
  - { icon: "server", name: "サーバー", role: "画面を組み立てる\n秘密を使う処理をする", metaphor: "カウンターと厨房", tone: "accent", at: 2 }
  - { icon: "database", name: "データベース", role: "お気に入りを\n保存しておく", metaphor: "倉庫", at: 3 }
  - { icon: "ai", name: "AI", role: "食材からレシピを\n考える", metaphor: "外注先の料理人", at: 4 }
  narration: |
    そして、さっきのデモに出ていた登場人物は、たった4人です。
    ブラウザ。お客さんの手元です。
    サーバー。お店のカウンターと厨房にあたります。
    データベース。保存しておく倉庫。
    そしてAI。食材からレシピを考える、外注先の料理人です。
    この4人の関係が分かれば、1つめの問いは終わりです。

# ---------------------------------------------------------- 問い②

- kind: agenda
  heading: "ここがこの章の山場"
  items:
  - { text: "アプリを開いたとき、何が起きている？", state: "done", at: 0 }
  - { text: "なぜAPIキーをブラウザに置いてはいけない？", state: "now", at: 0 }
  - { text: "データの保存とAIは、どう繋がっている？", at: 0 }
  reveal: false
  narration: |
    2つめ。ここがこの章の山場です。
    なぜ、APIキーをブラウザに置いてはいけないのか。

- kind: split
  icon: "key"
  heading: "APIキーとは"
  big: "「お金を払う権利」の証明書"
  small: "AIを呼ぶには、これが要る。\n持っている人が、持ち主の財布で使える。"
  narration: |
    AIを呼び出すには、APIキーというものが要ります。
    これは、お金を払う権利の証明書だと思ってください。
    持っている人なら誰でも、持ち主の財布でAIを使えてしまいます。

- kind: punch
  text: "ブラウザで動くコードは、\n利用者が全部、中身を読める。"
  ng: ["全部、中身を読める"]
  sub: "F12キーを押すだけ。隠す方法はありません。"
  narration: |
    ここで大事な事実を1つ。
    ブラウザで動くコードは、利用者が全部、中身を読めます。
    F12キーを押すだけです。そして、隠す方法はありません。

- kind: anim
  name: "key-leak"
  frames: 30
  heading: "だからブラウザに置くと、こうなる"
  narration: |
    つまり、ブラウザにAPIキーを置いた瞬間、こうなります。
    誰でも読める。誰でも持ち出せる。
    そして、世界中の誰もが、あなたのお金でAIを使えるようになります。

- kind: bigstat
  value: "864,000"
  unit: "回"
  formula: "1秒に10回 × 60 × 60 × 24"
  caption: "実際に起きた事故。1回0.8円なら、1日で約69万円。"
  narration: |
    実際に起きている事故です。
    置き場所を間違えたAPIキーが拾われて、1秒に10回、自動で叩かれ続けた。
    1日で86万4000回。1回0.8円としても、約69万円。
    書いたコードは、1文字も間違っていません。置き場所だけです。

- kind: verdict
  heading: "正解は、こう分ける"
  sides:
  - badge: "✕"
    tone: "ng"
    head: "ブラウザにキーを置く"
    desc: "ブラウザ → AI を直接呼ぶ。\n一見シンプルだが、キーが丸見え。"
    at: 1
  - badge: "○"
    tone: "ok"
    head: "サーバーにキーを置く"
    desc: "ブラウザは食材だけを送る。\nキーを持つサーバーがAIを呼ぶ。"
    at: 2
  narration: |
    正解はこうです。
    ブラウザからAIを直接呼ぶのではなく、間にサーバーを挟む。
    ブラウザは食材だけを送り、キーを持っているサーバーがAIを呼ぶ。
    サーバーの中身は、利用者からは見えません。
    だから、そこに置いた秘密は、秘密のままでいられるのです。

- kind: callout
  tone: "danger"
  title: "覚えて帰ってほしい、たった1つのルール"
  text: |
    秘密にしたいものには、NEXT_PUBLIC_ を付けない。
    付いている変数は、ブラウザに公開される。
  narration: |
    実際のコードでは、ネクスト・アンダーバー・パブリック・アンダーバー、
    という接頭辞が出てきます。
    これが付いている変数は、ブラウザに公開されます。付いていないものはサーバーだけ。
    APIキーにこれを付けたら、即アウトです。
    この章で覚えて帰ってほしいルールは、これ1つです。

# ---------------------------------------------------------- 問い③

- kind: agenda
  heading: "最後の問い"
  items:
  - { text: "アプリを開いたとき、何が起きている？", state: "done", at: 0 }
  - { text: "なぜAPIキーをブラウザに置いてはいけない？", state: "done", at: 0 }
  - { text: "データの保存とAIは、どう繋がっている？", state: "now", at: 0 }
  reveal: false
  narration: |
    最後の問いです。データの保存とAIは、どう繋がっているのか。

- kind: split
  icon: "database"
  heading: "データベースとは"
  big: "プログラムから読み書きできる、表"
  small: "このアプリで使う表は、たった1つ。\nお気に入り登録されたレシピが、1行ずつ入る。"
  narration: |
    まずデータベース。
    最初のうちは、プログラムから読み書きできる表、くらいの理解で十分です。
    このアプリで使う表は、たった1つ。
    さっきお気に入りに登録したレシピが、1行ずつ入っていきます。

- kind: table
  heading: "1行が、お気に入り1件"
  head: ["料理名", "ジャンル", "調理時間", "登録日時"]
  rows:
  - ["鶏むね肉と白菜の生姜炒め", "和食", "20分", "9/18 10:00"]
  - ["白菜のクリーム煮", "洋食", "25分", "9/18 11:30"]
  narration: |
    こういう形です。横の1行が、お気に入り1件。縦の1列が、その項目。
    やることも、作る、読む、消す、くらいしかありません。
    このアプリには編集機能を作らないので、更新も使いません。
    機能を減らすのも、立派な設計判断です。

- kind: split
  icon: "ai"
  heading: "API とは"
  big: "プログラム用の窓口"
  small: "人間向けの窓口が「画面」なら、\nプログラム向けの窓口が「API」。"
  narration: |
    次にAPI。
    人間向けの窓口が画面なら、プログラム向けの窓口がAPIです。
    人間にはHTMLという見た目のあるものを返し、
    プログラムにはJSONという、データだけのものを返します。

- kind: code
  heading: "さっき画面に出ていたレシピの、中身"
  caption: "レシピ1件"
  code: |
    {
      "title": "鶏むね肉と白菜の生姜炒め",
      "cookingTime": "20分",
      "ingredients": ["鶏むね肉 250g", "白菜 1/4個"],
      "steps": ["一口大に切る", "フライパンで炒める"]
    }
  reveal: false
  narration: |
    これがJSONです。さっき画面に出ていたレシピは、届いた時点ではこの形をしています。
    見た目ほど難しくありません。
    波かっこで囲むと、まとまり。角かっこで囲むと、並び。
    あとは、名前と値をコロンでつなぐ。それだけのルールです。

- kind: verdict
  heading: "リクエストの種類も、2つ覚えれば足りる"
  sides:
  - badge: "GET"
    head: "ください"
    desc: "ページを開く\nお気に入り一覧を取る"
    at: 1
  - badge: "POST"
    head: "これを処理して"
    desc: "食材を送って\nレシピを作ってもらう"
    at: 2
  narration: |
    リクエストの種類も、2つ覚えれば足ります。
    GETは、ください。POSTは、これを処理して。
    ページを開く動作は、必ずGETになります。
    ブラウザが勝手に先読みすることがあるので、GETで課金処理をしてはいけません。
    レシピ生成をPOSTにしているのは、これが理由の1つです。

- kind: table
  heading: "返事に付く番号。見る場所はここだけ"
  head: ["番号", "意味", "疑うところ"]
  rows:
  - ["200", "成功", "~—"]
  - ["400番台", "お願いの仕方が悪い", "*自分のブラウザ側のコード"]
  - ["500番台", "サーバーが壊れた", "*自分のサーバー側のコード"]
  narration: |
    そして、返事には3桁の番号が付いてきます。
    200番は成功。400番台は、お願いの仕方が悪い。500番台は、サーバーが壊れた。
    400番台か500番台かで、自分のどちらのコードを疑うかが変わります。
    エラーを読むときは、まずここを見る癖をつけてください。

# ============================================================ デモの回収

- kind: section
  num: "答え合わせ"
  heading: "最初のデモで、何が起きていたのか"
  narration: |
    ここまでの話を持って、最初に見てもらったデモに戻ります。

- kind: flow
  heading: "「レシピを考えてもらう」を押した、あの数秒"
  steps:
  - { who: "ブラウザ", text: "食材を入力して、ボタンを押す" }
