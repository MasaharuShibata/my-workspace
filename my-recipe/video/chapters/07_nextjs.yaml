# my-recipe 開発教材 動画版 第7章
# 原本: my-recipe/tutorial/07_nextjs.md
#
# 第7章は Part 1(言語と道具の基礎)の最終章。
# 原本の節をなぞらず、「この章で答える3つの問い」に組み替えている。
#
#   ① どのファイルが、どのURLになる？   … App Router / page・layout・route / Link
#   ② そのコードは、どこで動いている？   … サーバー/クライアントコンポーネント
#   ③ サーバー側の処理は、どう書く？     … Route Handler / Server Actions
#
# そのうえで、最後に「秘密はどこに置くのか」(環境変数)を置いた。
# ここは第1章「秘密はサーバーに置く」の回収であり、この章の持ち帰りでもある。
#
# 冒頭は thinking のデモで始め、終盤の環境変数の節で同じ数秒を言い直して回収する。
# デモは thinking(①) → list(②) の順。撮影時の採番と並び順を合わせてある。
#
#   node scripts/capture-demo.mjs out/demo http://localhost:3000 --scenes thinking,list
#
# デモのナレーションは撮影の尺に合わせること(thinking 3.4秒 / list 20.3秒)。
# thinking はほぼ静止画なので2倍まで、list は1.2倍までに収めている。
#
# コードのスライドは、実際の my-recipe のコードから削って作っている(創作しない)。

title: "Next.js"
footer: "my-recipe 開発教材 #7"
voice: "ja-JP-NanamiNeural"
rate: "+6%"

slides:

# ============================================================ 導入

- kind: punch
