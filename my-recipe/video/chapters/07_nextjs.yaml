  narration: |
    Part 1、最後の道具です。
    前の章で、Reactを使って画面を組み立てられるようになりました。
    ただ、これだけではアプリになりません。

- kind: demo
  frames_dir: "demo/thinking"
  narration: |
    この数秒。
    動いているコードは、あなたのパソコンの中にはありません。

- kind: punch
  text: "Reactは、画面を作る道具でしかない。"
  em: ["画面を作る道具でしかない"]
  narration: |
    この待ち時間の向こう側、つまりサーバーで動く処理は、Reactでは書けません。
    Reactは、画面を作る道具でしかないからです。

- kind: cards
  heading: "Reactだけでは、足りないもの"
  cards:
  - label: "1"
    title: "ページを分ける仕組み"
    text: "トップページと、お気に入りページ。\n2つの画面を出し分けられない。"
  - label: "2"
    title: "サーバー側の処理"
    text: "APIキーを隠しておける場所が、\nどこにも無い。"
  - label: "3"
    title: "公開するための準備"
    text: "まとめ方も、最適化も、\n全部が自分の仕事になる。"
  narration: |
    足りないものが3つあります。
    ページを分ける仕組みが無い。トップページとお気に入りページを、出し分けられません。
    サーバー側の処理が書けない。APIキーを隠す場所が、どこにも無いということです。
    そして、公開するための準備が、全部自分の仕事になります。

- kind: punch
  text: "Reactに、足りないものを\n全部足したもの。"
  em: ["全部足したもの"]
  sub: "それがNext.jsです。こういう「一式そろった道具箱」をフレームワークと呼びます。"
  narration: |
    そこを全部まとめて面倒を見てくれるのが、Next.jsです。
    こういう一式そろった道具箱を、フレームワークと呼びます。

- kind: code
  heading: "1つのプロジェクトに、画面とサーバーが同居する"
  caption: "my-recipe のフォルダ"
  code: |
    my-recipe/
    ├─ app/page.tsx                      ← ブラウザで動く画面
    ├─ app/api/generate-recipe/route.ts  ← サーバーで動く処理(APIキーを使う)
    └─ app/actions.ts                    ← サーバーで動く処理(データベースを触る)
  reveal: false
  narration: |
    そして、ここが効きます。
    1つのプロジェクトの中に、ブラウザで動く画面と、サーバーで動く処理が同居します。
    別々のプロジェクトを、2つ管理しなくていい。
    基本設計書に、構成をシンプルにできる、と書いてあるのはこれのことです。

- kind: agenda
  heading: "この章で答える、3つの問い"
  items:
  - "どのファイルが、どのURLになる？"
  - "そのコードは、どこで動いている？"
  - "サーバー側の処理は、どう書く？"
  narration: |
    答える問いは3つです。
    どのファイルが、どのURLになるのか。
    そのコードは、どこで動いているのか。
    サーバー側の処理は、どう書くのか。
    この章を終えると、これから書くファイルの置き場所が、全部説明できるようになります。

