  - { text: "送る前に、何を止める？", at: 0 }
  - { text: "動いた結果は、誰が受け取る？", at: 0 }
  reveal: false
  narration: |
    まず1つめ。入力欄に打った文字は、どこへ行くのか。

- kind: punch
  text: "ふつうのHTMLでは、\n入力欄が、打たれた文字を自分で持っている。"
  sub: "中身を知りたければ、そのつど入力欄に聞きに行くことになります。"
  narration: |
    ふつうのHTMLでは、入力欄が、打たれた文字を自分で持っています。
    プログラムから中身を知りたければ、そのつど入力欄に聞きに行く。
    画面のあちこちに値が散らばっている状態です。

- kind: verdict
  heading: "Reactでは、値の持ち主を入れ替える"
  sides:
  - badge: "これまで"
    head: "入力欄が値を持つ"
    desc: "プログラムは、聞きに行く側。\n今いくつ入っているのかは、その場で調べる。"
    at: 1
  - badge: "React"
    tone: "ok"
    head: "stateが値を持つ"
    desc: "入力欄は、stateを映しているだけ。\n値の置き場所は、常に1か所。"
    at: 2
  narration: |
    Reactでは、この持ち主を入れ替えます。
    値を持つのは入力欄ではなく、state、状態のほうです。
    入力欄は、stateを映しているだけの鏡になる。
    置き場所が1か所に決まるので、話が単純になります。
    この形を、制御されたコンポーネントと呼びます。

- kind: code
  heading: "この画面が覚えておくこと"
  caption: "components/IngredientForm.tsx"
  code: |
    const [input, setInput] = useState("");
    const [genre, setGenre] = useState<Genre>("こだわりなし");
    const [error, setError] = useState<string | null>(null);
  reveal: false
  narration: |
    このフォームが覚えておくことは、3つです。
    入力欄の中身。選ばれているジャンル。そして、エラーメッセージ。
    ユーズ・ステートを3つ並べて、それぞれに置き場所を作ります。

- kind: table
  heading: "3つのstate。どれも理由がある"
  head: ["state", "中身", "なぜこの形か"]
  rows:
  - ["input", "入力欄の文字", "~打つたびに変わる"]
  - ["genre", "選択中のジャンル", "*型を指定しないと、ただの文字列になる"]
  - ["error", "エラーの文言", "*無いときは空文字ではなく null"]
  narration: |
    ジャンルだけ、山かっこで型を指定しています。
    初期値から推論させると、ただの文字列という扱いになり、
    存在しないジャンルを入れても通ってしまうからです。5章でやった話です。
    エラーは、無いときをヌルにします。無い、という状態がはっきりします。

- kind: code
  heading: "入力欄とstateを繋ぐのは、この2行"
  caption: "value と onChange は必ずセット"
  code: |
    <input
      value={input}
      onChange={(e) => setInput(e.target.value)}
    />
  reveal: false
  narration: |
    入力欄とstateを繋ぐのは、2行だけです。
    バリューに、stateの中身を渡す。表示される文字は、ここから来ます。
    オン・チェンジで、1文字打たれるたびにstateを書き換える。
    書き換わると画面が描き直され、新しい文字が出る。
    この往復があるので、入力欄の中身とstateは常に一致します。

- kind: callout
  tone: "danger"
  title: "片方だけ書くと、こうなる"
  text: |
    value だけ書いて onChange を忘れると、
    打っても文字が出ない入力欄ができあがります。
  narration: |
    よくある失敗を1つ。バリューだけ書いて、オン・チェンジを忘れる。
    こうすると、打っても文字が出ない入力欄ができます。
    表示はstateから来るのに、書き換える人がいないからです。
    壊れて見えますが、書いたとおりに動いているだけです。

- kind: callout
  title: "useState を使うファイルには、この1行"
  text: |
    "use client" を、ファイルの一番上に書く。
    import より下に書くとエラーになります。
  narration: |
    もう1つ。ユーズ・ステートを使うファイルには、
    ユーズ・クライアント、という1行が要ります。
    7章でやったクライアントコンポーネントの印です。
    これはファイルの一番上。インポートより下に書くとエラーになります。

# ============================================================ 問い②

- kind: agenda
  heading: "ここがこの章の山場"
  items:
  - { text: "入力欄に打った文字は、どこへ行く？", state: "done", at: 0 }
  - { text: "送る前に、何を止める？", state: "now", at: 0 }
  - { text: "動いた結果は、誰が受け取る？", at: 0 }
  reveal: false
  narration: |
    2つめ。ここがこの章の山場です。送る前に、何を止めるのか。

- kind: punch
  text: "「鶏むね肉, 白菜, しょうが」は、\nプログラムから見ると、ただの1本の文字列。"
  em: ["ただの1本の文字列"]
  sub: "人間には3つに見えていても、機械には区切りが見えていません。"
  narration: |
    利用者は、食材をカンマで区切って打ちます。
    鶏むね肉、白菜、しょうが。人間の目には3つに見えます。
    ですがプログラムから見ると、これはただの1本の文字列です。
    区切りがあるように見えているのは、人間の側だけなんです。

- kind: code
  heading: "だから、配列に直す"
  caption: "入力文字列 → 食材の配列"
  code: |
    function parseIngredients(input: string): string[] {
      return input
        .split(/[,、]/)
        .map((s) => s.trim())
        .filter((s) => s.length > 0);
    }
  reveal: false
  narration: |
    そこで、1本の文字列を、食材が1つずつ入った配列に直します。
    やることは3つ。区切る、前後の空白を落とす、空っぽを捨てる。
    4章でやった、スプリット、マップ、フィルターの合わせ技です。

- kind: table
  heading: "雑な入力が、こう変わる"
  head: ["処理", "結果"]
  rows:
  - ["~もとの入力", "~鶏むね肉, 白菜 ,, "]
  - ["split", "鶏むね肉 / ␣白菜␣ / 空 / ␣"]
  - ["trim", "鶏むね肉 / 白菜 / 空 / 空"]
  - ["filter", "*鶏むね肉 / 白菜"]
  narration: |
    かなり雑な入力で追ってみます。
    区切ると4つに分かれ、空白だけのものや空っぽが混じります。
    前後の空白を落とすと、空白だけだったものは空っぽになる。
    最後に空っぽを捨てる。残るのは2つ。きれいになりました。

- kind: callout
  title: "区切り文字を2つ受け付けている理由"
  text: |
    半角カンマだけでなく、全角の読点も区切りとして扱う。
    日本語入力では、そちらを打ってしまうのが普通だからです。
  narration: |
    区切りは、半角のカンマと全角の読点、両方を受け付けています。
    日本語を打っている最中は、読点のほうが自然に出てしまうからです。
    半角で区切れ、と強いるより、両方受け取るほうが親切です。

- kind: callout
  tone: "danger"
  title: "この関数は、コンポーネントの外に置く"
  text: |
    中に書くと、画面が描き直されるたびに関数が作り直されます。
    stateに依存しない処理は、外に出す。
  narration: |
    1つ置き場所の注意です。この関数は、コンポーネントの外側に置いてください。
    中に書くと、画面が描き直されるたびに、同じ関数が作り直されます。
    stateに依存しない処理は外に出す。そう覚えてください。

- kind: code
  heading: "送信ボタンを押したときの処理"
  caption: "handleSubmit"
  code: |
    function handleSubmit(e: FormEvent) {
      e.preventDefault();
      const ingredients = parseIngredients(input);

      if (ingredients.length === 0) {
        setError("食材を1つ以上入力してください。");
        return;
      }
      if (ingredients.length > MAX_INGREDIENTS) {
        setError(`食材は${MAX_INGREDIENTS}個までにしてください。`);
        return;
      }

      setError(null);
      onSubmit(ingredients, genre);
    }
  reveal: false
  narration: |
    これが、送信ボタンを押したときに動く処理です。
    入力を配列に直し、空でないかを見て、多すぎないかを見て、通ったら先へ進む。
    さっきの赤い文字は、この中から出ています。1行ずつ見ます。

- kind: punch
  text: "e.preventDefault() を忘れると、\nページが再読み込みされる。"
  ng: ["ページが再読み込みされる"]
  sub: "ボタンを押したら画面が真っ白に戻る、入力が消える。原因はほぼこれです。"
  narration: |
    1行目、イー・プリベント・デフォルト。
    フォームは、もともと送信するとページを読み込み直す作りです。
    止めないと、押した瞬間に画面が真っ白に戻り、入力も消えます。
    押すと画面が戻る、という相談は、だいたいこの書き忘れです。

- kind: flow
  heading: "止める順番。例外を先に片付ける"
  steps:
  - { who: "1", text: "そもそも入っているか。0個なら、エラーを出して抜ける" }
  - { who: "2", text: "多すぎないか。11個以上なら、エラーを出して抜ける" }
  - { who: "3", text: "ここまで来たら正常。エラーを消す" }
  - { who: "4", text: "親に、食材とジャンルを渡す" }
  narration: |
    次に、止める順番です。
    まず、そもそも入っているか。0個なら、エラーを出してその場で抜けます。
    次に、多すぎないか。10個を超えていたら、これも出して抜ける。
    通ったらエラーを消して、先へ進みます。
    条件を入れ子にせず、駄目なものから先に片付ける。早期リターンという書き方です。

- kind: punch
  text: "「エラーを出す」だけ書いて、\n「エラーを消す」を書き忘れる。"
  ng: ["「エラーを消す」を書き忘れる"]
  sub: "一度出た赤い文字が、正しく入力し直しても消えなくなります。"
  narration: |
    抜けやすいのが3番目です。
    セット・エラーにヌルを渡す、この1行の書き忘れが本当に多い。
    忘れると、一度出た赤い文字が、入力し直しても消えなくなります。
    出す処理を書いたら、必ず消す処理も書く。

