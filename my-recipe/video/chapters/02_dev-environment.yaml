# my-recipe 開発教材 動画版 第2章
# 原本: my-recipe/tutorial/02_dev-environment.md
#
# 第1章と違い、この章は「全章の入口」ではなく普通の章。
# そのため、原本の節順(2.1〜2.8)をなぞらず、3つの問いに組み替えている。
#
#   ① 何を入れればいいのか            … 2.1 / 2.2 / 2.3 / 2.4前半
#   ② npmとGitは、結局なにをしてくれるのか … 2.4後半 / 2.5  ← 山場(.gitignore)
#   ③ 詰まったとき、どこを見るのか       … 2.3の警告 / 2.6
#
# 冒頭のデモ(input / thinking / result)は第1章と同じ素材だが、見せる角度を変える。
# 第1章は「何が起きているか」、この章は「どこで動いているか」。
# 撮影したコマのURL欄に localhost:3000 が写っているので、それを種明かしに使う。
#
# 終盤でそのデモを回収する。第1章の「リクエストとレスポンスの往復」が、
# 今日入れた道具によって1台のパソコンの中で起きていた、という形で閉じる。
#
# 山場は .env.local を Git に上げない話。第1章の「秘密はサーバーに置く」の続きとして、
# 「秘密が漏れる道は2本ある」という対比に組み直してある。
#
# デモのコマ: node scripts/capture-demo.mjs out/demo http://localhost:3000 \
#               --scenes input,thinking,result
# 撮影尺: input 8.2秒 / thinking 3.3秒 / result 14.9秒

title: "開発環境を準備する"
footer: "my-recipe 開発教材 #2"
