# ============================================================ 問い① 何を入れればいい？

- kind: agenda
  heading: "まず1つめ"
  items:
  - { text: "何を入れればいい？", state: "now", at: 0 }
  - { text: "npmとGitは、結局なにをしてくれる？", at: 0 }
  - { text: "詰まったとき、どこを見る？", at: 0 }
  reveal: false
  narration: |
    まず1つめ。何を入れればいいのか。

- kind: table
  heading: "道具は6つ。台所にたとえると、こうなります"
  head: ["道具", "役割", "台所でいうと"]
  rows:
  - ["VS Code", "コードを書く", "*ノートとペン"]
  - ["ターミナル", "パソコンに文字で命令する", "*作業台"]
  - ["Node.js", "JavaScriptをPC上で動かす", "*コンロ"]
  - ["npm", "部品を取り寄せる", "*通販サイト"]
  - ["Git / GitHub", "変更履歴を残す・公開する", "*セーブデータ"]
  - ["Chrome", "動作確認する", "*試食"]
  reveal: false
  narration: |
    道具は6つ。役割は、台所に置き換えると一通り分かります。
    ノートとペンがVS Code、作業台がターミナル、コンロがNode.js。
    通販サイトがnpm、セーブデータがGit、そして試食がブラウザです。

- kind: verdict
  heading: "ただし、落として入れるのは3つだけ"
  sides:
  - badge: "入れる"
    tone: "ok"
    head: "VS Code / Node.js / Git"
    desc: "それぞれの公式サイトから。\nNode.jsは「LTS版」を選ぶこと。"
    at: 1
  - badge: "入れなくていい"
    head: "npm / ターミナル / Chrome"
    desc: "npmはNode.jsに付いてくる。\nターミナルはVS Codeの中にある。\nブラウザは、もう入っているはず。"
    at: 2
  narration: |
    ただし、公式サイトから落として入れるのは3つだけです。
    VS Code、Node.js、Git。
    npmはNode.jsに付いてきますし、ターミナルはVS Codeの中にあります。
    Node.jsを入れるときだけ、エル・ティー・エス版を選んでください。

- kind: callout
  title: "VS Codeを入れたら、設定を2つだけ触る"
  text: |
    日本語化 — 拡張機能で Japanese Language Pack を入れる
    保存したら自動で整形 — 設定で format on save にチェックを入れる
  narration: |
    VS Codeは、入れたあと設定を2つだけ触っておいてください。
    日本語化と、保存したときの自動整形です。
    自動整形は、字下げや改行の位置を勝手に揃えてくれる機能で、
    これが無いと、見た目が崩れているせいでコードが読めない、ということが起きます。

- kind: table
  heading: "ターミナルで覚えるのは、これだけ"
  lead: "黒い画面に文字を打つやつです。この教材で使うコマンドは、10個もありません。"
  head: ["コマンド", "意味"]
  rows:
  - ["pwd", "*今どのフォルダにいるか"]
  - ["ls", "中身の一覧"]
  - ["cd フォルダ名", "そのフォルダに移動"]
  - ["cd ..", "1つ上のフォルダに戻る"]
  - ["mkdir 名前", "フォルダを作る"]
  reveal: false
  narration: |
    ターミナルは、黒い画面に文字を打つやつです。怖がる必要はありません。
    この教材で使うコマンドは、全部で10個もありません。
    今いる場所を見るpwd、中身を見るls、移動するcd、フォルダを作るmkdir。
    Windowsでは、pwdの代わりにcd、lsの代わりにdirです。

# ============================================================ 問い② npmとGitは何をしてくれる？

- kind: agenda
  heading: "ここがこの章の山場"
  items:
  - { text: "何を入れればいい？", state: "done", at: 0 }
  - { text: "npmとGitは、結局なにをしてくれる？", state: "now", at: 0 }
  - { text: "詰まったとき、どこを見る？", at: 0 }
  reveal: false
  narration: |
    2つめ。ここがこの章の山場です。
    npmとGitは、結局なにをしてくれるのか。
    名前はよく聞くのに、役割が曖昧なまま進んでしまいがちな2つです。

- kind: verdict
  heading: "その前に。Node.js が変えたこと"
  sides:
  - badge: "昔"
    head: "ブラウザの中だけ"
    desc: "JavaScriptは、ブラウザの中でしか\n動かない言語だった。"
    at: 1
  - badge: "今"
    tone: "ok"
    head: "ブラウザの外でも動く"
    desc: "サーバー側もJavaScriptで書ける。\nNext.jsを選ぶ理由の1つがこれ。"
    at: 2
  narration: |
    その前に、Node.jsから。
    JavaScriptは元々、ブラウザの中でしか動かない言語でした。
    それを外でも動かせるようにしたものが、Node.jsです。
    おかげで、画面もサーバーも1つの言語で書ける。
    第1章で名前が出てきたNext.jsを選ぶ理由の1つが、これです。

- kind: code
  heading: "入ったかどうかは、これで分かる"
  caption: "ターミナル"
  code: |
    >>node -v
    v22.11.0
    >>npm -v
    10.9.0
  reveal: false
  narration: |
    入れ終わったら、ターミナルでノード、ハイフン、ブイ、と打ってください。
    バージョン番号が出れば成功です。npmも同じように数字が出ます。
    ここで、コマンド・ノット・ファウンドと出たときは、
    ターミナルを一度閉じて、開き直してください。それでもダメなら入れ直しです。

- kind: punch
  text: "自分で書くのは、全体のごく一部。"
  em: ["ごく一部"]
  sub: "残りは、他の人が作って公開してくれた部品を組み合わせています。"
  narration: |
    そして npm。Node.jsと一緒に入ってくる、部品の取り寄せツールです。
    世の中には、他の人が作って公開してくれた部品が何十万個もあります。
    このmy-recipeも、自分で書くのは全体のごく一部で、
    残りはその部品の組み合わせです。

- kind: table
  heading: "my-recipe が取り寄せる部品"
  head: ["部品", "何をしてくれるか"]
  rows:
  - ["next", "*Webアプリの骨組み全部"]
  - ["react", "画面の組み立て"]
  - ["@supabase/supabase-js", "データベースへの読み書き"]
  - ["@anthropic-ai/sdk", "Claude APIの呼び出し"]
  - ["zod", "データの形のチェック"]
  - ["typescript", "型のチェック"]
  reveal: false
  narration: |
    取り寄せるのは、この6つです。
    ネクストが骨組みを丸ごと、リアクトが画面の組み立て。
    残りは、データベース、Claude API、そしてチェックのための部品です。
    第1章に出てきた登場人物が、そのまま部品になっているのが分かると思います。

- kind: verdict
  heading: "部品は「一覧」と「実体」に分かれている"
  sides:
  - badge: "一覧"
    tone: "ok"
    head: "package.json"
    desc: "何を取り寄せるかが書いてある。\nたった1つのファイル。Gitで保存する。"
    at: 1
  - badge: "実体"
    head: "node_modules"
    desc: "取り寄せた部品そのもの。\n数万ファイル。Gitで保存しない。"
    at: 2
  narration: |
    ここで大事なのが、部品が一覧と実体に分かれていることです。
    一覧は、パッケージ・ドット・ジェイソンというファイル。
    何を取り寄せるかが、ここに書いてあります。
    実体は、ノード・モジュールズというフォルダ。
    数万ファイルになりますが、開いて見る必要はまったくありません。
    そして実体のほうは、Gitで保存しません。一覧さえあれば、いつでも作り直せるからです。

- kind: code
  heading: "取り寄せ方は2通り"
  caption: "ターミナル"
  code: |
    >>npm install next   # 部品を1つ取り寄せる
    >>npm install        # 一覧に書かれた部品を全部取り寄せる
  reveal: false
  narration: |
    コマンドは2通りです。
    npm install のうしろに名前を付ければ、その部品を1つ取り寄せる。
    名前を付けずに打てば、一覧に書かれたものを全部取り寄せます。

- kind: split
  icon: "database"
  heading: "次に Git"
  big: "変更履歴を記録する仕組み"
  small: "ゲームのセーブに近い。\nただし、いつでも過去のどの地点にも戻れる。"
  narration: |
    次にGitです。変更履歴を記録する仕組み。
    ゲームのセーブに近いのですが、少し違います。
    いつでも過去のどの地点にも戻れて、何を変えたかが全部残る。

- kind: punch
  text: "本当の価値は、\n壊すのが怖くなくなること。"
  em: ["壊すのが怖くなくなること"]
  sub: "「変な風にいじってしまった」が、いつでも取り消せます。"
  narration: |
    ただ、初心者にとっての本当の価値は、履歴が残ることそのものではありません。
    壊すのが怖くなくなることです。
    変な風にいじってしまった、がいつでも取り消せる。
    だから、思い切って試せるようになります。

- kind: verdict
  heading: "GitとGitHubは、別のもの"
  sides:
  - badge: "Git"
    head: "手元で履歴を残す仕組み"
    desc: "自分のパソコンの中で完結する。\nネットに繋がっていなくても使える。"
    at: 1
  - badge: "GitHub"
    tone: "ok"
    head: "その履歴を置いておく場所"
    desc: "バックアップであり、共有の場所。\nそして、Vercelが公開するときの参照元。"
    at: 2
  narration: |
    よく混同されますが、GitとGitHubは別のものです。
    Gitは、手元で履歴を残す仕組み。自分のパソコンの中で完結します。
    GitHubは、その履歴をインターネット上に置いておく場所です。
    バックアップであり、共有の場所であり、
    そして第1章で名前だけ出てきたVercelが、ここからコードを取ってきて公開します。

- kind: flow
  heading: "使い方は、いつもこの順番"
  steps:
  - { who: "編集", text: "コードを書く" }
  - { who: "git add .", text: "変更を「記録の対象」に入れる" }
  - { who: "git commit -m", text: "記録する。ここがセーブ" }
  - { who: "git push", text: "GitHubに送る" }
  narration: |
    使い方は、いつもこの順番です。
    まずコードを書く。
    git add、スペース、点。これで変更を記録の対象に入れます。
    git commit、ハイフン、エム。メッセージを付けて記録する。ここがセーブです。
    最後に git push で、GitHubに送る。
    最初の一回だけ、git config で名前とメールアドレスを登録しておきます。

- kind: verdict
  heading: "コミットメッセージは、後から読む自分に向けて書く"
  sides:
  - badge: "✕"
    tone: "ng"
    head: "修正 / update"
    desc: "後から履歴を見ても、\n何をしたのか思い出せない。"
    at: 1
  - badge: "○"
    tone: "ok"
    head: "お気に入り削除ボタンを追加"
    desc: "何をしたかが書いてある。\n戻る地点を探すときに効く。"
    at: 2
  narration: |
    1つだけ注文があります。
    コミットメッセージは、後から読む自分に向けて書いてください。
    修正、とか、アップデート、では何も分かりません。
    お気に入り削除ボタンを追加、のように、何をしたかを書く。

# ---------------------------------------------------------- 山場: .gitignore

- kind: split
  icon: "key"
  heading: "そして、この章の山場"
  big: ".gitignore は「記録しないで」のリスト"
  small: "ここに書いたファイルは、履歴にもGitHubにも乗らない。\nこの2行だけは、絶対に入れる。"
  narration: |
    そしてここが、この章の山場です。
    ドット・ギットイグノアというファイルがあります。
    Gitに、これは記録しないで、と伝えるリストです。
    ここに書いたファイルは、履歴にもGitHubにも乗りません。
    そして、この2行だけは絶対に入れます。

- kind: code
  heading: "絶対に入れる2行"
  caption: ".gitignore"
  code: |
    >>node_modules/
    >>.env.local
  reveal: false
  narration: |
    1行目、ノード・モジュールズ。
    これはさっき話したとおり、一覧があれば作り直せるので入れません。
    問題は2行目です。ドット・イー・エヌ・ブイ、ドット・ローカル。

- kind: punch
  text: ".env.local には、APIキーが入ります。"
  ng: ["APIキー"]
  sub: "第1章で「お金を払う権利の証明書」と説明した、あのキーです。"
  narration: |
    ドット・イー・エヌ・ブイ・ドット・ローカルには、APIキーが入ります。
    第1章で、お金を払う権利の証明書だと説明した、あのキーです。

- kind: punch
  text: "GitHubに上げた瞬間、\nキーは世界に公開されます。"
  ng: ["世界に公開されます"]
  sub: "巡回プログラムがGitHubを常時見張っていて、公開されたキーは数分で拾われます。"
  narration: |
    これをGitHubに上げると、キーが世界に公開されます。
    悪意のあるプログラムがGitHubを常時巡回していて、
    公開されたキーは数分で拾われ、使われます。
    第1章で話した、1日で69万円という事故。あれと同じことが起きます。

- kind: verdict
  heading: "秘密が漏れる道は、2本ある"
  sides:
  - badge: "第1章"
    tone: "ng"
    head: "ブラウザに置いた"
    desc: "F12を押せば、利用者に読まれる。"
    at: 1
  - badge: "この章"
    tone: "ng"
    head: "GitHubに上げた"
    desc: "巡回プログラムに、数分で拾われる。"
    at: 2
  narration: |
    整理します。秘密が漏れる道は、2本あります。
    1本目が、第1章でやった、ブラウザに置いてしまう道。エフ・ジュウニを押せば読まれます。
    2本目が、この章の、GitHubに上げてしまう道。巡回プログラムに、数分で拾われます。
    どちらも、書いたコードは1文字も間違っていません。置き場所だけの問題です。

- kind: callout
  tone: "danger"
  title: "覚えて帰ってほしい、たった1つのこと"
  text: |
    .gitignore に .env.local があるか、自分の目で確認する。
    用意してくれるのはNext.js。確認するのは自分。
  narration: |
    Next.jsでプロジェクトを作ると、ドット・ギットイグノアは自動で用意されます。
    多くの場合、ドット・イー・エヌ・ブイ・ドット・ローカルも最初から書いてあります。
    ですが、確認するのは自分です。最初のコミットの前に、一度だけ自分の目で確かめてください。

# ============================================================ 問い③ どこを見る？

- kind: agenda
  heading: "最後の問い"
  items:
  - { text: "何を入れればいい？", state: "done", at: 0 }
  - { text: "npmとGitは、結局なにをしてくれる？", state: "done", at: 0 }
  - { text: "詰まったとき、どこを見る？", state: "now", at: 0 }
  reveal: false
  narration: |
    最後の問いです。詰まったとき、どこを見るのか。
    見る場所は2つしかありません。

- kind: punch
  text: "コマンドが動かないときの9割は、\nフォルダの位置が違うだけ。"
  em: ["フォルダの位置が違うだけ"]
  sub: "1つめの見る場所は、ターミナル。まず pwd で、今いる場所を確認する。"
  narration: |
    1つめは、ターミナルです。
    初心者が最も詰まるのは、今どこにいるか分からなくなること。
    コマンドがうまく動かないとき、9割の確率で、いる場所が違うだけです。
    エラーの文面を読む前に、まずpwdと打つ。この癖をつけてください。

- kind: table
  heading: "2つめは、ブラウザの開発者ツール"
  lead: "Chromeで F12。Macは Command + Option + I。Web開発者の聴診器です。"
  head: ["タブ", "何が見えるか", "いつ使うか"]
  rows:
  - ["Console", "*エラーと console.log の出力", "*画面が動かないとき、まずここ"]
  - ["Network", "飛んだリクエストと返事", "APIが動いているか見るとき"]
  - ["Elements", "今表示されているHTML・CSS", "見た目が崩れているとき"]
  narration: |
    2つめが、ブラウザの開発者ツールです。使うタブは3つだけ。
    コンソールは、エラーと出力が出るところ。画面が動かないときは、まずここです。
    ネットワークは、飛んだリクエストと返事。第1章でやった往復が、そのまま目に見えます。
