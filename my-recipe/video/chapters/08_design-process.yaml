# my-recipe 開発教材 動画版 第8章
# 原本: my-recipe/tutorial/08_design-process.md
#
# この章はコードを1行も書かない。だからこそ「なぜ今これを聞くのか」を
# 早い段階で腑に落としておかないと、聞き流される章になる。
#
# 構成は、原本の節の順番(8.1〜8.5)をなぞらず、3つの問いに組み替えた。
#
#   問い1  何から決めればいい?          … 要件定義 → 基本設計 → 詳細設計
#   問い2  「何を作るか」はどこまで書く?   … 要件定義。山場は「やらないこと」
#   問い3  「どう作るか」はどこまで決める? … 基本設計(画面・表)と詳細設計(入口と出口)
#
# 冒頭で input / result のデモを流し、「この画面は書く前に決まっていた」と宣言する。
# 終盤で list のデモを流し、一覧画面の見た目一つ一つが設計書のどの行から来たかを
# 説明し直して回収する。
#
# 原本には細かい表や列挙が多い。口で聞いて分かりにくいものは、表はスライドに残し
# ナレーションでは言い切る形に畳んである(尺を14分前後に収めるため)。
#
# デモのコマは scripts/capture-demo.mjs --scenes input,result,list で撮る。
# 実測の尺: input 6.3秒 / result 11.0秒 / list 15.6秒。

title: "設計する"
footer: "my-recipe 開発教材 #8"
voice: "ja-JP-NanamiNeural"
rate: "+6%"

slides:

# ============================================================ 導入

- kind: punch
  text: "この章では、\nコードを1行も書きません。"
  sub: "それでも、この教材で一番大事な章です。"
  narration: |
    この章では、コードを1行も書きません。
    それでも、この教材で一番大事な章です。

- kind: punch
  text: "作れない理由は、\n文法を知らないからではない。"
  em: ["文法を知らないから"]
  sub: "何を作るのか決まらないまま、書き始めてしまうからです。"
  narration: |
    初心者がアプリを作れない理由は、文法を知らないからではありません。
    何を作るのかが決まらないまま、書き始めてしまうからです。

- kind: flow
  heading: "決めずに書き始めると、こうなります"
  steps:
  - { who: "1", text: "レシピアプリを作るぞ。とりあえず画面から" }
  - { who: "2", text: "あ、ログイン要る? 後から入れるの大変だ…" }
  - { who: "3", text: "お気に入りを保存しよう。材料って、配列? 文字列?" }
  - { who: "4", text: "ジャンルで絞りたい。保存してない。作り直しだ" }
  - { who: "5", text: "作り直すと、入れたデータが全部消える" }
  narration: |
    とりあえず画面から作り始める。
    ログインが要るかも、と気づく。後から入れるのは大変です。
    お気に入りの保存で、手が止まる。材料は、配列か、文字列か。
    ジャンルで絞りたくなり、保存していないと気づく。表の作り直しです。
    作り直すと、データも消えます。

- kind: verdict
  heading: "設計とは、手を動かす前に紙の上で失敗しておく作業"
  sides:
  - badge: "コードで失敗すると"
    tone: "ng"
    head: "半日かかる"
    desc: "書いたものを壊して、\nデータを消して、作り直す。"
    at: 1
  - badge: "紙の上で失敗すれば"
    tone: "ok"
    head: "5分で直る"
    desc: "線を引き直すだけ。\n何度でもやり直せる。"
    at: 2
  narration: |
    これは、手が遅いのではありません。決める順番が逆なだけです。
    設計とは、手を動かす前に、紙の上で失敗しておく作業です。
    コードで失敗すると半日、紙の上なら5分で直ります。

- kind: agenda
  heading: "この章で答える、3つの問い"
  items:
  - "何から決めればいい？"
  - "「何を作るか」は、どこまで書く？"
  - "「どう作るか」は、どこまで決める？"
  narration: |
    答える問いは3つです。
    1つめ、何から決めればいいのか。
    2つめ、何を作るかを、どこまで書くのか。
    3つめ、どう作るかを、どこまで決めるのか。

# ============================================================ 決めた結果を先に見る

- kind: punch
  text: "先に、決めた結果を見せます。"
  sub: "これから出てくる画面は、コードを1行も書く前に、文章と表の形で決まっていました。"
  narration: |
    話を始める前に、決めた結果のほうを見てもらいます。
    これから出てくる画面は、コードを書く前に、文章と表の形で決まっていました。

- kind: demo
  frames_dir: "demo/input"
  narration: |
    入力欄がひとつ、ジャンルの選択、ボタンがひとつ。
    設計どおりです。

- kind: demo
  frames_dir: "demo/result"
  narration: |
    料理名、調理時間、材料、作り方。出す項目は、先に決めてあります。
    ここに無いものは作らない、と決めたということです。

# ============================================================ 問い1

- kind: agenda
  heading: "まず1つめ"
  items:
  - { text: "何から決めればいい？", state: "now", at: 0 }
  - { text: "「何を作るか」は、どこまで書く？", at: 0 }
  - { text: "「どう作るか」は、どこまで決める？", at: 0 }
  reveal: false
  narration: |
    では1つめ。何から決めればいいのか。

- kind: table
  heading: "決めることは、3段階に分かれます"
  head: ["段階", "答える問い", "粒度"]
  rows:
  - ["要件定義", "*何を・誰のために作るのか", "日本語だけ。技術の話は出さない"]
  - ["基本設計", "*どういう構成で実現するか", "画面一覧・技術選定・表の全体像"]
  - ["詳細設計", "*中身をどう作るか", "ファイル構成・関数・列の定義"]
  narration: |
    決めることは、3つの段階に分かれます。
    要件定義は、何を、誰のために作るのか。技術の話はせず、日本語だけ。
    基本設計は、どういう構成で実現するか。画面、技術、表の全体像。
    詳細設計は、ファイル構成や、列の定義まで降ります。

- kind: punch
  text: "「Next.jsを使うぞ」から\n始めてはいけない。"
  ng: ["始めてはいけない"]
  sub: "それは基本設計の話。何を作るかが決まっていないと、選ぶ理由そのものが無い。"
  narration: |
    大事なのは、上から順に決めることです。
    ネクスト・ジェイエスを使うぞ、から始めてはいけません。
    何を作るかが決まっていないと、選ぶ理由そのものが無いからです。

# ============================================================ 問い2 要件定義

- kind: agenda
  heading: "2つめ。書く量は、一番少ない"
  items:
  - { text: "何から決めればいい？", state: "done", at: 0 }
  - { text: "「何を作るか」は、どこまで書く？", state: "now", at: 0 }
  - { text: "「どう作るか」は、どこまで決める？", at: 0 }
  reveal: false
  narration: |
    2つめ。何を作るかを、どこまで書くのか。要件定義の話です。

- kind: callout
  section: "要件定義"
  title: "① 目的を、1〜2文で書く"
  text: |
    手元にある食材をいくつか入力するだけで、AIがそれらを活かしたレシピを
    考案してくれるアプリを提供する。気に入ったレシピは保存し、あとから見返せるようにする。
  narration: |
    1つめは、目的です。1文か2文で書きます。
    手元の食材を入力すると、AIがレシピを考えてくれるアプリを提供する。
    気に入ったものは保存して、あとから見返せる。これだけです。
    誰が、どんなときに、何ができるようになるか。書けないなら、まだ作ってはいけません。
    なぜ作るのかも、1行添えておくと、迷ったときに戻る場所になります。

- kind: punch
  section: "要件定義"
  text: "想定利用者は、自分ひとり。"
  em: ["自分ひとり"]
  sub: "要件定義で、一番効く一行です。"
  narration: |
    2つめ、想定利用者。
    設計書には、開発者本人のみ、個人利用、と書いてあります。
    この一行が、一番効きます。

- kind: table
  section: "要件定義"
  heading: "この一行から、芋づる式に決まる"
  head: ["「個人利用のみ」と決めると", "こうなる"]
  rows:
  - ["ログイン機能", "*要らない。画面が2つ減る"]
  - ["利用者を見分ける列", "*要らない。表が単純になる"]
  - ["同時アクセス数", "~考えなくていい。無料枠で足りる"]
  - ["デザイン", "~万人向けにしなくていい"]
  narration: |
    ここが決まると、後が芋づる式に決まります。
    ログイン機能が要らない。画面が2つ消えます。
    利用者を見分ける列も要らず、表が単純になります。
    同時に何人使うかも、考えなくていい。
    デザインも、万人向けにしなくていい。

- kind: punch
  section: "要件定義"
  text: "「将来みんなに使ってもらうかも」と\n考え始めると、永遠に完成しない。"
  ng: ["永遠に完成しない"]
  sub: "ログイン、権限、通報機能…と際限なく膨らみます。最初のアプリは、自分1人に絞るのが正解。"
  narration: |
    逆に、将来みんなに使ってもらうかも、と考え始めると、
    ログイン、権限、通報機能と、際限なく膨らみ、永遠に完成しません。
    最初のアプリは、自分ひとりに絞るのが正解です。

- kind: table
  section: "要件定義"
  heading: "③ 機能を書き出して、MUSTとWANTに分ける"
  head: ["#", "機能", "区分"]
  rows:
  - ["F1", "食材の入力", "*MUST"]
  - ["F2", "AIによるレシピ考案", "*MUST"]
  - ["F3", "レシピ結果の表示", "*MUST"]
  - ["F4", "お気に入り登録", "~WANT"]
  - ["F5", "お気に入り一覧表示", "~WANT"]
  - ["F6", "お気に入り削除", "~WANT"]
  - ["F7", "ジャンル選択", "~WANT"]
  narration: |
    3つめ。思いつく機能を全部書き出して、ランク付けします。
    食材の入力、AIによる考案、結果の表示。この3つがマスト。
    お気に入りの登録、一覧、削除、ジャンル選択は、ウォントです。

- kind: punch
  section: "要件定義"
  text: "MUSTは3つ。\n「食材を入れたらレシピが出る」だけで、いったん完成。"
  em: ["3つ"]
  sub: "お気に入りすら WANT。この区別が、作る順番をそのまま決めます。"
  narration: |
    マストは3つだけ。食材を入れたら、レシピが出る。
    ここまで作れば、いったん完成です。お気に入りですら、ウォント。
    この区別が、作る順番を決めます。マストから作り、時間が無ければ後は落とす。

- kind: callout
  section: "要件定義"
  tone: "bad"
  title: "④ やらないことを、はっきり書く"
  text: |
    ログイン・ユーザーごとのデータ分離　／　登録していない生成結果の履歴
    レシピの手動編集　／　カロリー・栄養素の計算
    1回で複数のレシピ候補を出す機能　／　レシピ画像の生成
  narration: |
    4つめ。ここが、要件定義で実は一番大事なところです。
    やらないことを、はっきり書く。
    ログインはやらない。登録していない生成結果も残さない。
    編集も、カロリー計算も、画像生成もしない。

- kind: punch
  section: "要件定義"
  text: "作っている最中に、必ず\n「あれもできそう」と思うから。"
  sub: "書いてあれば即断できる。書いていないと、毎回悩んで、手を出して、完成が遠ざかる。"
  narration: |
    なぜ書くのか。作っている最中に、必ず、あれもできそう、と思うからです。
    書いてあれば、今回はやらないと決めた、と即断できます。
    書いていないと、毎回悩んで、手を出して、完成が遠ざかります。

- kind: table
  section: "要件定義"
  heading: "⑤ 「動く」以外の条件も決めておく"
  head: ["観点", "my-recipeでの決定"]
  rows:
  - ["コスト", "*Vercel・Supabaseは無料枠。お金がかかるのはAIだけ"]
  - ["可用性", "24時間動く保証は不要。止まったら手で再開する"]
  - ["セキュリティ", "*ログイン無し。URLを知る人は誰でも読み書きできる"]
  - ["保守性", "設計書を整備する。環境構築の手順も全部残す"]
  narration: |
    5つめ。機能ではないけれど、決めておくことです。
    コストは無料の枠に収める。お金がかかるのはAIだけ。
    24時間動く保証は要りません。止まったら手で再開する。
    ログインは無し。URLを知る人は誰でも読み書きできる。

- kind: punch
  section: "要件定義"
  text: "「安全です」ではなく、\n「ここが危険だが、この理由で受け入れる」。"
  em: ["この理由で受け入れる"]
  sub: "リスクを知らずに作るのと、知ったうえで許容するのは、まったく違う。"
  narration: |
    セキュリティの書き方が、特に大事です。安全です、とは書きません。
    ここが危険だが、この理由で受け入れる、と書きます。
    リスクを知らずに作るのと、知ったうえで許容するのは、まったく違います。

- kind: bigstat
  section: "要件定義"
  value: "0.8"
  unit: "円"
  formula: "入力 約600トークン ＋ 出力 約1000トークン"
  caption: "レシピ1回あたり。1日10回使っても、月30円以下。"
  narration: |
    6つめ。外部のAIを使うなら、作る前に1回いくらかを計算します。
    トークンは、AIが文章を処理する単位です。
    入力が600、出力が1000トークンで、1回およそ0.8円。
    1日10回使っても、月に30円かかりません。

- kind: punch
  section: "要件定義"
  text: "見積もりが月1万円になるなら、\n作り方そのものを変える。"
  ng: ["作り方そのものを変える"]
  sub: "作ってから気づくと、もう遅い。この試算が「食材は10個まで」という制限にもつながった。"
  narration: |
    もし月に1万円と出たなら、作り方そのものを変えるべきです。
    作ってから気づくと、もう遅い。
    この試算が、食材は10個まで、という制限にもつながりました。

# ============================================================ 問い3 基本設計・詳細設計

- kind: agenda
  heading: "最後の問い"
  items:
  - { text: "何から決めればいい？", state: "done", at: 0 }
  - { text: "「何を作るか」は、どこまで書く？", state: "done", at: 0 }
  - { text: "「どう作るか」は、どこまで決める？", state: "now", at: 0 }
  reveal: false
  narration: |
    最後の問いです。どう作るかを、どこまで決めるのか。
    基本設計と、詳細設計の話です。

- kind: diagram
  section: "基本設計"
  heading: "① まず、誰が誰を呼ぶかを描く"
  nodes:
  - t: row
    items:
    - { t: node, title: "ブラウザ", sub: "画面" }
    - { t: arrow-h, label: "HTTPS" }
    - { t: node, title: "Vercel", sub: "Next.jsのサーバー", tone: "accent" }
    - { t: arrow-h, label: "食材" }
    - { t: node, title: "Claude API", sub: "レシピを考える" }
  - { t: arrow, label: "保存・取り出し", glyph: "↓" }
  - { t: node, title: "Supabase", sub: "データベース" }
  narration: |
    基本設計の1つめは、構成図です。
    登場人物と、やりとりを図にします。手書きで十分です。
    ブラウザから、Vercelに置いたサーバーへ。
    そこから、レシピを考えるAIと、保存するデータベースへ。

- kind: punch
  section: "基本設計"
  text: "ブラウザからAIへの矢印は、引かない。"
  em: ["引かない"]
  sub: "図で決めた「誰が誰を呼ぶか」が、そのまま実装の制約になる。"
  narration: |
    図を描く価値は、誰が誰を呼ぶかが固定されることです。
    今の図に、ブラウザからAIへ直接向かう矢印は、ありませんでした。
    この一本を引かなかったことが、そのまま実装の制約になります。

- kind: table
  section: "基本設計"
  heading: "② 技術は、理由とセットで選ぶ"
  head: ["分類", "採用", "理由"]
  rows:
  - ["フロント/バック", "*Next.js + TypeScript", "画面とサーバー処理を1つのプロジェクトで書ける"]
  - ["ホスティング", "*Vercel", "GitHubにpushするだけで自動デプロイ。個人利用は無料"]
  - ["データベース", "*Supabase", "無料でPostgreSQLが使える"]
  - ["AI", "*Claude API (Haiku)", "単純なテキスト生成。一番安いモデルで足りる"]
  narration: |
    2つめ、技術を選びます。選んだ理由を必ず添えること。
    ネクスト・ジェイエスは、画面とサーバーを1つで書けるから。
    Vercelは、プッシュするだけで公開でき、個人利用は無料だから。
    Supabaseは、無料でデータベースが使えるから。
    AIは、一番安いモデル。

- kind: punch
  section: "基本設計"
  text: "「流行っているから」は、理由にならない。"
  ng: ["理由にならない"]
  sub: "何を優先した結果その選択になったのか。それが、後で乗り換えるときの判断材料になる。"
  narration: |
    流行っているから、は理由になりません。
    何を優先した結果、その選択になったのか。
    それが、後で乗り換えるときの判断材料になります。

- kind: table
  section: "基本設計"
  heading: "③ 画面を洗い出す。my-recipeは2枚だけ"
  head: ["#", "画面", "パス", "担当する機能"]
  rows:
  - ["S1", "ホーム(レシピ検索)", "/", "入力・考案・結果の表示・お気に入り登録"]
  - ["S2", "お気に入り一覧", "/favorites", "一覧・開閉・絞り込み・削除"]
  narration: |
    3つめ、画面の洗い出しです。機能を、どの画面で使うかに割り振ります。
    ホームは、レシピを作る場所。
    お気に入り一覧は、保存したものを見る場所。これ以上、分ける理由がありません。

- kind: punch
  section: "基本設計"
  text: "画面を1つ増やすと、遷移・戻る・URL・\n状態の受け渡しが、全部増える。"
  ng: ["全部増える"]
  sub: "「レシピ詳細画面」は作らない。一覧の中で開け閉めすれば足りる。"
  narration: |
    初心者は、画面を増やしすぎます。
    詳細画面を作りたくなりますが、一覧の中で開け閉めすれば足ります。
    画面を1つ増やすと、行き来も、戻るボタンも、URLの決めごとも、全部増えるからです。

- kind: section
  num: "山場"
  heading: "データベースを決める"
  narration: |
    そして、ここが設計の山場です。データベースを決めます。

- kind: verdict
  heading: "手順1 保存する必要があるものだけを挙げる"
  sides:
  - badge: "保存する"
    tone: "ok"
    head: "お気に入りのレシピ"
    desc: "登録ボタンを押したものだけ。"
    at: 1
  - badge: "保存しない"
    tone: "ng"
    head: "生成しただけのレシピ\n材料のチェック状態"
    desc: "チェックは調理中だけの、\n一時的なもの。"
    at: 2
  narration: |
    手順の1つめ。保存する必要があるものだけを挙げます。
    お気に入りに登録したレシピは、保存する。
    生成しただけのものや、材料のチェックは、保存しない。
    何でも保存すると、表も、消す処理も増えます。
    結果、このアプリの表は1つだけになりました。

- kind: punch
  text: "1行が、何を表すのか。"
  em: ["1行"]
  sub: "「1行 = お気に入り登録されたレシピ1件」。この一文が言えない表は、設計を間違えている。"
  narration: |
    手順の2つめ。その1行が、何を表すのかを決めます。
    1行イコール、お気に入り登録されたレシピ1件。
    この一文が言えない表は、設計を間違えています。

- kind: table
  heading: "手順3 列は、画面から逆算する"
  head: ["一覧画面に出したいもの", "列"]
  rows:
  - ["料理名", "*title"]
  - ["ジャンル(絞り込みにも使う)", "*genre"]
  - ["調理時間 / 何人分", "cooking_time / servings"]
  - ["どの食材で作ったか", "source_ingredients"]
  - ["材料 / 作り方", "ingredients / steps"]
  - ["新しい順に並べたい", "created_at"]
  narration: |
    手順の3つめ。列は、画面から逆算します。
    料理名、ジャンル、調理時間、何人分。
    どの食材から作ったか。材料と、作り方。
    新しい順に並べたいので、登録日時。
    画面に出ないものは、列にしません。

- kind: cards
  heading: "手順4 材料をどう持つか。ここに設計判断が出る"
  cards:
  - label: "案A"
    title: "別の表に分ける"
    text: "1材料で1行。\n正統派だが、表が3つに増え、\nつなぎ合わせる処理が要る"
  - label: "案B"
    title: "jsonb で配列のまま"
    text: "柔軟だが、\n初心者には扱いが難しい"
  - label: "案C"
    title: "改行区切りの文字列"
    text: "単純。\n表示するとき、改行で分けるだけ"
    tone: "good"
  narration: |
    手順の4つめ。材料は、鶏むね肉200グラム、白菜4分の1個、と複数あります。
    案のAは、別の表を作って1材料で1行。表が3つに増えます。
    案のBは、配列のまま入れられる型。初心者には難しい。
    案のCは、改行で区切った、ただの文字列です。

- kind: punch
  text: "選んだのはC。\n「材料だけを検索する要件が無い」から。"
  em: ["要件が無い"]
  sub: "常にレシピ1件まるごとでしか使わない。だったら、一番単純な形でいい。"
  narration: |
    選んだのは、Cです。
    材料を個別に検索したり、集計したりする要件が、無いからです。
    常に、レシピ1件まるごとでしか使いません。だったら、一番単純な形でいい。

- kind: punch
  text: "「正しい設計」ではなく、\n「この要件に合う設計」を選ぶ。"
  em: ["この要件に合う設計"]
  sub: "将来「にんじんを使うレシピを検索」が要件になったら、そのときAに変えればいい。"
  narration: |
    ここが、設計の本質だと思います。
    正しい設計ではなく、この要件に合う設計を選ぶ。
    将来、にんじんを使うレシピを検索したい、となったら、そのときAに変えればいい。
    判断した記録が残っているので、迷わず変えられます。

- kind: table
  section: "基本設計"
  heading: "最後に、要件で決めた方針を手段に落とす"
  head: ["要件", "設計"]
  rows:
  - ["APIキーを漏らさない", "*NEXT_PUBLIC_ を付けない環境変数 ＋ サーバーからのみ呼ぶ"]
  - ["コストを抑える", "ボタンを押したときだけAIを呼ぶ。食材は最大10個"]
  - ["将来ログインを足したい", "*RLSを無効にせず「常に許可」ポリシーを書く"]
  narration: |
    最後に、要件で決めた方針を、手段に落とします。
    APIキーを漏らさない。ネクスト・アンダーバー・パブリック・アンダーバーを付けない環境変数にして、サーバーからだけ呼ぶ。
    コストを抑える。押したときだけAIを呼び、食材は10個まで。
    将来ログインを足すなら、今のうちに、常に許可、と書いておく。
    今の手間は同じで、将来の手間が減ります。

# ---------------------------------------------------------- 詳細設計

- kind: punch
  section: "詳細設計"
  text: "ここまで書けていれば、\n実装は「作業」になる。"
  em: ["「作業」"]
  sub: "基本設計が「何を作るか」なら、詳細設計は「どう書くか」。"
  narration: |
    残りは詳細設計。基本設計が何を作るかなら、こちらは、どう書くか。
    ここまで書けていれば、実装はもう、作業になります。

- kind: code
  section: "詳細設計"
  heading: "入口と出口の形を、先に確定させる"
  caption: "POST /api/generate-recipe"
  code: |
    リクエスト(ブラウザ → 自分のサーバー)
    { "ingredients": ["鶏むね肉", "白菜"], "genre": "和食" }

    レスポンス(成功)
    { "recipe": { "title": "...", "cookingTime": "...", "servings": "...",
                  "ingredients": ["..."], "steps": ["..."] } }

    レスポンス(失敗)
    { "error": "食材を1つ以上入力してください。" }
  reveal: false
  narration: |
    中でも効くのが、これです。
    自分のサーバーの、入口と出口の形を、JSONで確定させます。
    ブラウザからは、食材とジャンルを送る。
    成功すればレシピが、失敗すればエラーメッセージが返ります。

- kind: punch
  section: "詳細設計"
  text: "形が決まれば、画面側とサーバー側を、\n別々に作れる。"
  em: ["別々に作れる"]
  sub: "13章で「先に偽のレシピを返すサーバー」を作れるのは、ここが決まっているから。"
  narration: |
    この形が決まると、画面側とサーバー側を、別々に作れます。
    13章では、先に偽のレシピを決め打ちで返すサーバーを作ります。
    それができるのは、返す形がここで決まっているからです。

- kind: verdict
  section: "詳細設計"
  heading: "入力チェックは、両方に置く"
  sides:
  - badge: "ブラウザ側"
    head: "親切心のため"
    desc: "利用者にすぐ知らせる。\nただし利用者に消せるので、\n安全の役には立たない。"
    at: 1
  - badge: "サーバー側"
    tone: "ok"
    head: "安全のため"
    desc: "おかしなデータを防ぐ。\nここが本当の防波堤。"
    at: 2
  narration: |
    入力チェックをどこに置くか。答えは、両方です。
    ブラウザ側は、利用者にすぐ知らせるため。親切心です。
    サーバー側は、おかしなデータを防ぐため。安全のためです。
    ブラウザのチェックは利用者に消せるので、安全の役には立ちません。

- kind: punch
  section: "詳細設計"
  text: "利用者に見せる文に、\n技術的な詳細を書かない。"
  ng: ["技術的な詳細"]
  sub: "「TypeError: cannot read property」ではなく「もう一度お試しください」。"
  narration: |
    エラーの見せ方も、ここで決めます。
    ルールは1つ。利用者に見せる文に、技術的な詳細を書かないこと。
    タイプエラー、と出されても、利用者は困ります。
    次にどうすればいいかを書く。
    そして、直さないと決めたことは、仕様として書き残しておきます。

# ============================================================ 回収

- kind: section
  num: "答え合わせ"
  heading: "一覧画面に、設計書が透けて見える"
  narration: |
    ここまでの話を持って、最初のデモの続きを見てください。

- kind: demo
  frames_dir: "demo/list"
  narration: |
    ここに出ているものは、全部さっきの表の1行です。
    料理名、ジャンル、調理時間。
    カードを開くのは、詳細画面を作らないと決めたから。
    ジャンルで絞れるのは、ジャンルを列にすると決めたからです。

- kind: punch
  text: "見えているもの一つ一つに、\n決めた理由がある。"
  em: ["決めた理由"]
  sub: "作りながら決めていたら、この画面はここまで単純になっていません。"
  narration: |
    画面に見えているもの一つ一つに、決めた理由があります。
    作りながら決めていたら、この画面は、ここまで単純にはなっていません。

