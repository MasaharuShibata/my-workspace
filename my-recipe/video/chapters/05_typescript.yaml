# ============================================================ 回収

- kind: section
  num: "答え合わせ"
  heading: "最初の画面に、戻ります"
  narration: |
    では、最初に見てもらった画面に戻ります。

- kind: flow
  heading: "あの画面が出るまでに、データが通った道"
  steps:
  - { who: "AI", text: "JSONを返す。この時点では、ただの文字の並び" }
  - { who: "サーバー", text: "unknown として受け取る。まだ触らない" }
  - { who: "サーバー", text: "配列か、文字列か、ひとつずつ確認する" }
  - { who: "ブラウザ", text: "確認を通ったものを Recipe 型として受け取る" }
  - { who: "画面", text: "title・ingredients・steps を順に描く" }
  narration: |
    あの画面が出るまでに、データはこの道を通っています。
    AIがJSONを返す。この時点では、ただの文字の並びです。
    サーバーがアンノウンとして受け取り、ひとつずつ確認する。
    確認を通って、はじめてレシピ型になります。
    冒頭の6行は、この一番最後で効いています。

- kind: code
  heading: "最後に、面白い話を1つ"
  caption: "同じ「材料」なのに、形が違う"
  code: |
    type Recipe = {
      ingredients: string[];   // 配列
    };

    type FavoriteRecipe = {
    >>  ingredients: string;     // 配列ではない
    };
  narration: |
    最後に、面白い話を1つだけ。
    my-recipeには、レシピ型のほかに、お気に入りレシピ型があります。
    同じ材料という項目が、レシピ型では文字列の配列、お気に入り型ではただの文字列です。

- kind: punch
  text: "同じ「材料」でも、\n置き場所によって形が違う。"
  em: ["置き場所によって形が違う"]
  sub: "データベースには、改行区切りの1本のテキストで保存しているからです。"
  narration: |
    これは間違いではなく、設計の判断です。
    データベースには、改行で区切った1本のテキストで保存しているからです。
    同じ材料でも、置き場所によって形が違う。
    その違いを型で書き分けられるのが、TypeScriptの一番ありがたいところです。

