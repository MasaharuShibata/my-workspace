# ============================================================ 問い①

- kind: agenda
  heading: "まず1つめ"
  items:
  - { text: "型を書くと、何が変わる？", state: "now", at: 0 }
  - { text: "データの形を、自分で決めるとは？", at: 0 }
  - { text: "外から来たデータは、どう扱う？", at: 0 }
  reveal: false
  narration: |
    まず1つめ。型を書くと、何が変わるのか。

- kind: punch
  text: "TypeScriptは、新しい言語ではありません。"
  em: ["新しい言語ではありません"]
  sub: "JavaScriptに「型の注意書き」を足せるようにしたものです。"
  narration: |
    はじめに、大きな誤解を1つ外しておきます。
    TypeScriptは、新しく覚え直す言語ではありません。
    前の章でやったJavaScriptに、型の注意書きを足せるようにしたものです。

- kind: diagram
  heading: "ブラウザが動かすのは、結局JavaScript"
  nodes:
  - t: row
    items:
    - { t: "node", title: "あなたが書く", sub: ".ts / .tsx" }
    - { t: "arrow-h", label: "Next.jsが自動で変換" }
    - { t: "node", title: "実際に動く", sub: ".js", tone: "accent" }
  narration: |
    書くのは、ドット・ティー・エス、という拡張子のファイルです。
    ブラウザはこれを直接は動かせないので、先にJavaScriptへ変換されます。
    ただ、この変換はNext.jsが自動でやります。

- kind: code
  heading: "「型」とは、そこに何が入るかの宣言"
  code: |
    const title: string = "生姜炒め";
    const count: number = 3;
    const isOpen: boolean = false;
    const items: string[] = ["鶏肉", "白菜"];
  narration: |
    型の注意書きは、こう書きます。コロンのうしろが型です。
    ストリングなら文字列だけ。ナンバーなら数値だけ。ブーリアンなら、真か偽か。
    角かっこを付けると、その並び、つまり配列です。

- kind: code
  heading: "では、この注意書きが無いと何が起きるか"
  caption: "型が無い世界(JavaScript)"
  code: |
    const recipe = { title: "生姜炒め", cookingTime: "20分" };

    >>console.log(recipe.cookingTimes);
    // 打ち間違い。でもエラーにならず、undefined が返るだけ
  narration: |
    クッキングタイム、と書くつもりが、最後にエスを付けてしまった。
    JavaScriptは、これをエラーにしません。
    無い項目を読むと、アンディファインド、値が無い、と返すだけです。

- kind: punch
  text: "画面に「調理時間: undefined」と出て、\nそこで初めて気づく。"
  ng: ["そこで初めて気づく"]
  sub: "運が悪ければ、先に気づくのは利用者のほうです。本番で。"
  narration: |
    画面には、調理時間、アンディファインド、と表示されます。そこで初めて気づく。
    運が悪ければ、先に気づくのは利用者のほうです。本番で、です。

- kind: code
  heading: "同じ間違いを、TypeScriptで書くと"
  caption: "型がある世界(TypeScript)"
  code: |
    type Recipe = { title: string; cookingTime: string };
    const recipe: Recipe = { title: "生姜炒め", cookingTime: "20分" };

    >>console.log(recipe.cookingTimes);
    // プロパティ 'cookingTimes' は型 'Recipe' に存在しません。
    // 'cookingTime' ですか?
  narration: |
    同じ間違いを、TypeScriptで書くとこうなります。
    打った瞬間に、エディタが赤い波線を引きます。
    そんな項目は無い、クッキングタイムの間違いでは、と、直す候補まで出してくれます。

- kind: verdict
  heading: "変わるのは、気づくタイミング"
  sides:
  - badge: "型が無い"
    tone: "ng"
    head: "動かして、画面を見て気づく"
    desc: "早くて数分後。\n遅ければ、本番で利用者が気づく。"
    at: 1
  - badge: "型がある"
    tone: "ok"
    head: "打った瞬間に気づく"
    desc: "エディタが赤い波線を引く。\n直す候補まで出してくれる。"
    at: 2
  narration: |
    違うのは、間違いに気づくタイミングだけです。ですが、この差が大きい。
    型が無ければ、動かして、画面を見て、おかしい、と気づく。
    型があれば、打った瞬間です。

- kind: punch
  text: "初心者にとっての本当の価値は、\nバグが減ることではありません。"
  em: ["バグが減ることではありません"]
  sub: "「何を書けばいいか」を、エディタが教えてくれることです。"
  narration: |
    ただ、初心者にとっての本当の価値は、バグが減ることではないと思っています。
    もっと大きい効果が、2つあります。

- kind: cards
  cards:
  - label: "1"
    title: "入力補完が効く"
    text: "recipe. と打つだけで、\n使える項目の一覧が出る。"
  - label: "2"
    title: "設計書がコードになる"
    text: "型定義を見れば、そのデータが\n何を持っているか一目で分かる。"
  narration: |
    1つめ。入力補完が効きます。レシピ、ドット、と打つだけで、使える項目の一覧が出る。
    覚えなくてよくなるので、初心者ほど恩恵が大きい。
    2つめ。型定義そのものが、設計書として読めます。

- kind: punch
  text: "「型は面倒だから、慣れてからでいい」\n— これは、逆です。"
  em: ["逆です"]
  sub: "型が無いほうが、初心者には難しい。何を書けばいいか教えてくれる人が、いなくなるからです。"
  narration: |
    型を書くのは面倒だから、慣れてからでいい、という話をよく聞きます。
    実際は、逆です。
    型が無いほうが、何を書けばいいか教えてくれる人がいなくなるぶん、難しい。

- kind: code
  heading: "とはいえ、そんなに書きません"
  caption: "型推論"
  code: |
    const title = "生姜炒め";
    // 型を書いていないが、TypeScript は string だと分かっている

    >>title = 10;   // ちゃんとエラーになる
  narration: |
    では、全部に型を書くのか。書きません。代入した値から、型を推論するからです。
    ここでは型を1文字も書いていませんが、タイトルは文字列だと理解されています。
    だから、数値は入りません。

- kind: cards
  heading: "型注釈を書く場所は、だいたい決まっている"
  cards:
  - label: "書く"
    title: "この3つ"
    items:
    - "関数の引数と戻り値"
    - "空の状態から始まる変数"
    - "データの形を定義するとき"
  - label: "書かない"
    title: "値と同時に決まるもの"
    text: "入れた瞬間に型が決まるものは、\nわざわざ書かなくていい。"
  narration: |
    書く場所は、だいたい3つです。
    関数の引数と戻り値。何も入っていない状態から始まる変数。データの形を定義するとき。
    逆に、値を入れると同時に決まるものは書きません。

# ============================================================ 問い②

- kind: agenda
  heading: "ここがこの章の山場"
  items:
  - { text: "型を書くと、何が変わる？", state: "done", at: 0 }
  - { text: "データの形を、自分で決めるとは？", state: "now", at: 0 }
  - { text: "外から来たデータは、どう扱う？", at: 0 }
  reveal: false
  narration: |
    2つめ。ここがこの章の山場です。
    データの形を、自分で決めるとはどういうことか。

- kind: code
  heading: "冒頭の6行に、戻ります"
  caption: "type — 自分でデータの形を決める"
  code: |
    type Recipe = {
      title: string;
      cookingTime: string;
      servings: string;
      ingredients: string[];
      steps: string[];
    };
  narration: |
    最初に見てもらった6行です。
    中身は、項目の名前と、その型を並べるだけ。
    タイトルは文字列。材料は、文字列の配列。

- kind: punch
  text: "「レシピとは、こういうものである」\nと宣言している。"
  em: ["宣言している"]
  sub: "詳細設計書の「出力形式」の表と、行が1対1で対応します。"
  narration: |
    日本語に訳すと、レシピとは、料理名・調理時間・人数と、材料・手順を持つデータである。
    これは、設計書の一節そのものです。
    第8章で書く詳細設計書の表と、1対1で対応します。

- kind: punch
  text: "型を書くというのは、\n設計をコードで書く、ということ。"
  em: ["設計をコードで書く"]
  narration: |
    型を書くというのは、単なる注意書きではありません。
    設計を、コードの形で書き残す行為です。
    文書に書いた設計は、実装とずれても黙っています。
    型に書いた設計は、ずれた瞬間にエラーになります。

- kind: code
  heading: "だから、欠けたら止まる"
  caption: "使うとき"
  code: |
    const recipe: Recipe = {
      title: "生姜炒め",
      cookingTime: "20分",
      servings: "2人分",
      ingredients: ["鶏むね肉 200g"],
    };
    >>// エラー: 'steps' がありません
  narration: |
    この例では、手順を書き忘れています。項目が1つでも欠けると、その場でエラーになります。
    設計どおりかを、機械が毎回確認してくれる、ということです。

- kind: code
  heading: "あってもなくてもいい項目"
  code: |
    type Params = {
      ingredients: string[];
    >>  avoidTitle?: string;
    };
    // ? を付けると「省略できる」という意味になる
  narration: |
    名前のうしろにはてなマークを付けると、省略できる、という意味になります。
    別のレシピを提案してもらうときだけ、避けたい料理名を渡す。
    その、あったり無かったりを、はてなマーク1文字で表しています。

- kind: code
  heading: "縦棒ひとつで、「これか、これ」"
  caption: "ユニオン型"
  code: |
    let recipe: Recipe | null = null;
    // レシピが入っているか、まだ何も無いか

    let status: "idle" | "loading" | "error" = "idle";
    // この3つの文字列しか入らない
  narration: |
    次は縦棒です。縦棒で、どちらか、を表します。
    レシピ、縦棒、ヌル。レシピが入っているか、まだ何も無いか、のどちらか。
    画面を開いた直後は何も無いので、こういう型になります。

- kind: code
  heading: "決まった値しか許さない"
  caption: "文字列リテラル型"
  code: |
    type Genre = "和食" | "洋食" | "中華";

    const g: Genre = "和食";
    >>const h: Genre = "フレンチ";   // エラー: Genre型に代入できません
  narration: |
    決まった文字列だけを許す書き方を、文字列リテラル型といいます。
    ジャンルをただの文字列にすると、和食と日本食のような表記ゆれが、後から必ず起きます。
    リテラル型なら、書いた瞬間に止まります。

- kind: code
  heading: "my-recipe の実物は、こうなっている"
  caption: "lib/types.ts — 本物のコード"
  code: |
    export const GENRES = [
      "和食", "洋食", "中華", "イタリアン",
      "韓国料理", "お弁当", "こだわりなし",
    ] as const;

    >>export type Genre = (typeof GENRES)[number];
  narration: |
    my-recipeの実物は、こうなっています。
    上が、画面の選択肢になる配列。
    下の1行が、その配列から型を作っている部分です。
    アズ・コンストで、この配列は絶対に変えない、と宣言し、
    そこから要素の型を取り出して、ジャンル型にしています。

- kind: punch
  text: "ジャンルを1つ増やすとき、\n直す場所は1か所でいい。"
  em: ["1か所"]
  sub: "配列に1行足せば、型も、画面の選択肢も、同時に変わります。"
  narration: |
    なぜ、わざわざこう書くのか。
    ジャンルを1つ増やしたいとき、配列に1行足すだけで、
    型も、画面の選択肢も、同時に変わるからです。
    定数と型を別々に書くと、必ずどちらかの更新を忘れます。

- kind: code
  heading: "関数にも、型を書く"
  code: |
    >>function parseIngredients(input: string): string[] {
      return input.split(/[,、]/).map((s) => s.trim());
    }
    // 受け取るのは文字列ひとつ。返すのは、文字列の配列
  narration: |
    関数にも型を書きます。かっこの中が引数の型。うしろが、戻り値の型です。
    カンマ区切りの文字列を受け取って、食材の配列にして返す関数です。
    戻り値の型は推論されますが、書いたほうがいい。意思表示になります。

- kind: demo
  frames_dir: "demo/thinking"
  narration: |
    ここで、この数秒の待ち時間の話をします。

- kind: code
  heading: "「あとで返ってくる」も、型で表す"
  code: |
    async function generateRecipe(
      ingredients: string[]
    >>): Promise<Recipe> { ... }
    // 待てば Recipe が手に入る「引換券」

    function toggleChecked(i: number): void { ... }
    // void = 何も返さない
  narration: |
    あとで返ってくる、を型にしたものがプロミスです。
    エイシンクを付けた関数は、必ずプロミスを返します。
    プロミス、山かっこ、レシピ。待てばレシピが手に入る引換券です。
    引換券はすぐ返り、中身が入るのが数秒後。あの待ち時間の正体です。

- kind: code
  heading: "山かっこが出てきたら、ジェネリクス"
  code: |
    const [recipe, setRecipe] = useState<Recipe | null>(null);
    // ↑ この箱には Recipe か null が入る、と指定している

    const [checked, setChecked] = useState<boolean[]>([]);
  narration: |
    山かっこが出てきたら、ジェネリクスです。型そのものを、引数として渡す書き方です。
    ユーズステートは、どんな型でも入れられる箱を作る関数なので、
    何を入れる箱かを山かっこで指定します。
    ここでは、レシピか、ヌル。次の章、Reactで主役になります。

# ============================================================ 問い③

- kind: agenda
  heading: "最後の問い"
  items:
  - { text: "型を書くと、何が変わる？", state: "done", at: 0 }
  - { text: "データの形を、自分で決めるとは？", state: "done", at: 0 }
  - { text: "外から来たデータは、どう扱う？", state: "now", at: 0 }
  reveal: false
  narration: |
    最後の問いです。外から来たデータを、どう扱うのか。

- kind: punch
  text: "外から届くデータには、\n何が入っているか保証がない。"
  ng: ["保証がない"]
  sub: "送ってくるのが、あなたの作った画面とは限らないからです。"
  narration: |
    ここは、安全性に直接関わる話です。
    サーバーに届くデータには、何が入っているか保証がありません。
    送ってくるのが、あなたの作った画面とは限らないからです。

- kind: code
  heading: "こんなものが届くかもしれない"
  code: |
    { "ingredients": "配列じゃなくて文字列", "genre": 12345 }
  narration: |
    たとえば、こんなものです。
    材料には配列が来るはずなのに、文字列。ジャンルは文字列のはずなのに、数値。
    画面を通さず直接送りつければ、こういうものはいくらでも作れます。

- kind: verdict
  heading: "何でも入る型が、2つある"
  sides:
  - badge: "any"
    tone: "ng"
    head: "何でも入る。触り放題"
    desc: "型チェックを全部放棄する。\n壊れても気づけない。"
    at: 1
  - badge: "unknown"
    tone: "ok"
    head: "何でも入るが、触れない"
    desc: "使う前に「確認」を強制される。"
    at: 2
  narration: |
    ここで2つの型が出てきます。エニーと、アンノウンです。どちらも何でも入ります。
    違うのはそのあとで、エニーは型チェックを全部放棄し、
    アンノウンは、使う前の確認を強制します。
    エニーは使いません。アンノウンを使います。

- kind: code
  heading: "使う前に、確認する"
  caption: "型ガード"
  code: |
    const value: unknown = getSomething();

    >>value.toUpperCase();     // エラー: 何か分からないものは触れない

    if (typeof value === "string") {
      value.toUpperCase();    // OK: 文字列だと確認できた
    }
  narration: |
    アンノウンのまま触ろうとすると、何か分からないものは触れない、と止められます。
    イフ文で、これは文字列だ、と確認してやると、そのかっこの中では触れるようになります。
    この書き方を、型ガードと呼びます。

- kind: code
  heading: "my-recipe のサーバー側は、まさにこれ"
  caption: "app/api/generate-recipe/route.ts — 本物のコード"
  code: |
    >>let body: unknown;              // 何が来るか分からない
    body = await request.json();

    const ingredients = Array.isArray(raw)
      ? raw.filter((v): v is string =>
          typeof v === "string" && v.trim().length > 0)
      : [];                          // 配列でなければ、空扱い
  narration: |
    my-recipeのサーバー側は、まさにこう書かれています。
    届いたものを、まずアンノウンとして受け取る。
    配列かどうかを確認し、中身が文字列で、空でないものだけを残す。
    配列でなければ、空っぽとして扱う。
    何を送りつけられても、先へ進むのは文字列の配列だけです。

- kind: callout
  title: "見慣れない書き方が、1つ"
  text: |
    (v): v is string
    この関数が true を返したら、v は文字列だと思ってよい、という意味。
    型述語といいます。最初は丸暗記で構いません。
  narration: |
    1つだけ、見慣れない書き方があります。ブイ・イズ・ストリング。
    この関数がトゥルーを返したら、ブイは文字列だと思ってよい、という印です。
    型述語といいます。最初は丸暗記で構いません。

- kind: callout
  tone: "danger"
  title: "鉄則"
  text: |
    ブラウザ側で行ったチェックは、サーバー側でもう一度やる。
  narration: |
    ここで鉄則を1つ。ブラウザ側で行ったチェックは、サーバー側でもう一度やります。
    ブラウザのコードは、利用者が自由に書き換えられるからです。
    フォームで10個までにしたから大丈夫、は成り立ちません。

- kind: code
  heading: "最後の手段、as"
  code: |
    const recipe = data.recipe as Recipe;
    // 「TypeScriptくん、これは Recipe だと信じてくれ」
  narration: |
    最後に、アズ、という書き方です。
    これはレシピだと信じてくれ、という宣言で、こう書くとTypeScriptは黙ります。

- kind: punch
  text: "as は、型チェックを黙らせるだけ。\n中身は、何も確認していない。"
  ng: ["何も確認していない"]
  sub: "本当にRecipeでなければ、実行したときに壊れます。"
  narration: |
    ただし、これは型チェックを黙らせるだけで、中身は何も確認していません。
    違っていれば、実行したときに壊れます。
    書きたくなったら、まず型ガードで確認できないかを考えてください。

