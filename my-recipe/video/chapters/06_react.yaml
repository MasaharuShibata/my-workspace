# ---------------------------------------------------------- 問い②

- kind: agenda
  heading: "2つめの問い"
  items:
  - { text: "Reactは、何を楽にしてくれる？", state: "done", at: 0 }
  - { text: "画面を、どう部品に分ける？", state: "now", at: 0 }
  - { text: "変わる値は、どこに置く？", at: 0 }
  reveal: false
  narration: |
    2つめへ行きます。画面を、どう部品に分けるのか。

- kind: punch
  text: "コンポーネントは、\nHTMLを返す関数。"
  em: ["HTMLを返す関数"]
  sub: "それ以上でも、以下でもありません。"
  narration: |
    Reactの部品を、コンポーネントと呼びます。
    正体は、エイチティーエムエルを返す関数です。
    それ以上でも、以下でもありません。

- kind: code
  heading: "my-recipeのヘッダー"
  caption: "components/Header.tsx"
  code: |
    function Header() {
      return (
        <header className="site-header">
          <a href="/">my-recipe</a>
        </header>
      );
    }
  reveal: false
  narration: |
    これが実物です。関数の中で、見た目をそのまま返しているだけ。
    守るルールは3つあります。

- kind: flow
  heading: "コンポーネントのルールは、3つだけ"
  steps:
  - { who: "1", text: "関数名は大文字で始める。小文字だとHTMLタグ扱いされる" }
  - { who: "2", text: "HTMLのようなもの(JSX)を return する" }
  - { who: "3", text: "使うときは、タグのように書く … <Header />" }
  narration: |
    1つ、関数名は大文字で始める。
    小文字だと、ただのタグと見なされてしまいます。
    2つ、ジェイエスエックスと呼ばれる、エイチティーエムエルのようなものを返す。
    3つ、使うときはタグのように書く。これだけです。

- kind: code
  heading: "部品を組み合わせると、画面になる"
  caption: "app/page.tsx"
  code: |
    <>
      <Header />
      <main className="page">
        <div className="page-intro"> ... </div>
        <IngredientForm ... />
        {recipe && <RecipeResult ... />}
      </main>
    </>
  reveal: false
  narration: |
    そして、組み合わせるとこうなります。
    ヘッダーがあって、食材のフォームがあって、レシピがあれば結果が出る。
    画面の構造が、そのまま読めます。
    これを1つのファイルに全部書くと、300行の壁になる。
    直したい場所を探すだけで、時間が溶けます。

- kind: punch
  text: "JSXは、HTMLではない。"
  em: ["HTMLではない"]
  sub: "JavaScriptの式です。ここを勘違いすると、必ず詰まります。"
  narration: |
    いま出てきたジェイエスエックス。
    エイチティーエムエルに見えますが、これはエイチティーエムエルではありません。
    ジャバスクリプトの式です。
    だから、似ているのに違うところが5つあります。

- kind: table
  heading: "HTMLとの違いは、5つだけ"
  head: ["#", "HTML", "JSX"]
  rows:
  - ["1", "class=\"card\"", "*className=\"card\""]
  - ["2", "for=\"id\"", "*htmlFor=\"id\""]
  - ["3", "onclick=\"...\"", "*onClick={ ... }"]
  - ["4", "<br>", "*<br />"]
  - ["5", "要素を並べて置ける", "*1つに包む必要がある"]
  narration: |
    クラスは、クラスネーム。
    フォーは、エイチティーエムエル・フォー。
    どちらもジャバスクリプトの予約語なので、名前を変えてあります。
    イベント名は、オンクリックのように途中を大文字にする。
    閉じないタグにも、スラッシュが要る。
    そして5つめ。返す要素は、必ず1つにまとめること。
    関数は、1つしか返せないからです。

- kind: code
  heading: "5番の対処法 — フラグメント"
  caption: "名前のない、空のタグで包む"
  code: |
    return (
      <>
        <Header />
        <main>...</main>
      </>
    );
  reveal: false
  narration: |
    まとめ方は簡単で、名前のない空のタグで包みます。
    フラグメントと呼びます。
    余計な入れ物を増やさずに、束ねるだけの記法です。
    さっきのホーム画面も、これで始まっていました。

- kind: code
  heading: "{ } の中だけ、JavaScriptに戻る"
  code: |
    <h2>{recipe.title}</h2>
    <p>調理時間: {recipe.cookingTime}</p>
    <button disabled={generating}>保存</button>
  reveal: false
  narration: |
    波かっこで囲むと、その中だけジャバスクリプトに戻ります。
    変数を表示したり、属性に値を渡したり。
    かっこの外はエイチティーエムエルの世界、中はジャバスクリプトの世界。
    この2つを行き来しているのが、ジェイエスエックスです。
    ただし、中に書けるのは値になるものだけ。イフ文はそのまま書けません。

- kind: code
  heading: "だから、条件はこう書く"
  code: |
    {error && <p className="form-error">{error}</p>}

    {generating ? "考案中..." : "レシピを考えてもらう"}

    if (favorites.length === 0) {
      return <p>まだお気に入りがありません。</p>;
    }
  reveal: false
  narration: |
    そこで、3つの書き方を使います。
    上は、あれば出す。エラーがあるときだけ、赤い文字が出ます。
    真ん中は、AかBか。考案中かどうかで、ボタンの文字を出し分けています。
    下は、早期リターン。0件ならコンポーネントごと別のものを返してしまう。
    条件が込み入ってきたら、これがいちばん読めます。

- kind: code
  heading: "リストは map と key"
  caption: "配列 → JSXの配列"
  code: |
    <ul>
      {recipe.ingredients.map((item, i) => (
        <li key={i}>{item}</li>
      ))}
    </ul>
  reveal: false
  narration: |
    並べるときは、04章でやったマップを使います。
    配列をジェイエスエックスの配列に変えると、Reactが並べてくれます。
    1つだけ約束があって、キーを必ず付けること。
    どの要素がどれかを、Reactが見分けるための札です。
    一意な番号があるならそれを使う。
    並べ替えも削除もしないなら、何番目かをそのまま使って構いません。

# ---------------------------------------------------------- 問い③

- kind: agenda
  heading: "最後の問い"
  items:
  - { text: "Reactは、何を楽にしてくれる？", state: "done", at: 0 }
  - { text: "画面を、どう部品に分ける？", state: "done", at: 0 }
  - { text: "変わる値は、どこに置く？", state: "now", at: 0 }
  reveal: false
  narration: |
    最後の問いです。変わる値は、どこに置くのか。

- kind: verdict
  heading: "コンポーネントが扱う値は、2種類しかない"
  sides:
  - badge: "props"
    head: "親からもらう値"
    desc: "受け取って表示するだけ。\n子が書き換えてはいけない。"
    at: 1
  - badge: "state"
    tone: "ok"
    head: "自分が持つ、変わる値"
    desc: "この値が変わると、\n画面が作り直される。"
    at: 2
  narration: |
    コンポーネントが扱う値は、2種類しかありません。
    親からもらう値を、プロップスと呼びます。
    受け取って表示するだけで、子が書き換えてはいけません。
    もう1つが、自分が持っている、変わる値。これがステートです。

- kind: code
  heading: "props — 親から子へ渡す"
  code: |
    // 親が渡す
    <FavoriteCard favorite={favorite} />

    // 子が受け取る
    function FavoriteCard({ favorite }) {
      return <h3>{favorite.title}</h3>;
    }
  reveal: false
  narration: |
    プロップスは、タグの属性のように渡します。
    受け取る側は、波かっこで名前を書いて取り出す。
    04章でやった分割代入です。

- kind: diagram
  heading: "データは、上から下にしか流れない"
  nodes:
  - { t: "node", title: "app/page.tsx (親)", sub: "recipe というデータを持っている", tone: "accent" }
  - { t: "arrow", label: "props で渡す" }
  - { t: "node", title: "RecipeResult (子)", sub: "受け取って表示するだけ。書き換えてはいけない" }
  narration: |
    そしてデータは、上から下にしか流れません。
    単方向データフローと呼びます。
    子が勝手に親の値を書き換えられないので、
    誰がこの値を変えたのか、を追いかけられます。

- kind: code
  heading: "では、子から親に伝えるには？"
  caption: "関数を渡して、呼んでもらう"
  code: |
    // 親: 「食材が確定したら、この関数を呼んでね」
    <IngredientForm onSubmit={(ing, g) => generate(ing, g)} />

    // 子: 送信されたら、もらった関数を呼ぶ
    function handleSubmit(e) {
      e.preventDefault();
      onSubmit(ingredients, genre);
    }
  reveal: false
  narration: |
    では、子から親に何か伝えたいときは。
    関数を渡します。
    親は、食材が決まったらこれを呼んでね、と関数を渡しておく。
    子は、送信されたら、もらった関数を呼ぶだけです。

- kind: punch
  text: "データはpropsで下へ、\n出来事は関数で上へ。"
  em: ["下へ", "上へ"]
  sub: "初心者がいちばん混乱するところですが、覚えてしまえば決まり文句です。"
  narration: |
    言葉にすると、これだけです。
    データはプロップスで下へ、出来事は関数で上へ。
    ここは初心者がいちばん混乱するところですが、決まり文句として覚えてしまって構いません。

- kind: code
  heading: "state — useStateの3点セット"
  caption: "components/IngredientForm.tsx"
  code: |
    const [input, setInput] = useState("");
    //     現在の値  変更する関数      初期値
  reveal: false
  narration: |
    ステートは、ユーズステートで作ります。
    返ってくるのは2つ。いまの値と、それを変える関数です。
    かっこの中が初期値。入力欄の文字を持っているのが、これです。

- kind: verdict
  heading: "なぜ、普通の変数ではダメなのか"
  sides:
  - badge: "✕"
    tone: "ng"
    head: "let input = \"鶏むね肉\""
    desc: "値は変わる。でもReactは知らない。\n画面は古いまま。"
    at: 1
  - badge: "○"
    tone: "ok"
    head: "setInput(\"鶏むね肉\")"
    desc: "Reactが「作り直しが要る」と\n気づく。"
    at: 2
  narration: |
    ここで、普通の変数ではだめなのか、という疑問が出ます。だめです。
    普通の変数を書き換えても、値は変わりますが、Reactはそれを知りません。画面は古いままです。
    Reactは、セットで始まる関数が呼ばれたときだけ、画面を作り直す必要があると気づきます。

- kind: punch
  text: "コンポーネント関数は、stateが変わるたびに\n何度も実行される。"
  em: ["何度も実行される"]
  sub: "Reactのいちばん変なところ。慣れるまでは、気持ち悪いはずです。"
  narration: |
    ここがReactの、いちばん変なところです。
    関数は一度動いて終わるもの、と思っていると必ず混乱します。
    ステートが変わる、関数が再実行される、新しい画面ができる。
    このループだと覚えてください。

- kind: table
  heading: "my-recipeで使われているstate"
  head: ["ファイル", "state", "何を表すか"]
  rows:
  - ["app/page.tsx", "recipe", "*いま表示しているレシピ"]
  - ["", "generating", "AIが考え中かどうか"]
  - ["IngredientForm", "input / genre", "入力欄の文字と、選んだジャンル"]
  - ["RecipeResult", "checked", "*材料のチェック状態"]
  - ["FavoriteCard", "open", "カードが開いているか"]
  narration: |
    実物を並べます。
    いま表示しているレシピ。AIが考え中かどうか。
    入力欄の文字と、選んだジャンル。材料のチェック状態。カードが開いているか。
    こうして見ると分かりますが、画面の見た目を変えるものが、ステートになります。

- kind: code
  heading: "stateの鉄則 — 必ず新しい値を作る"
  code: |
    // ✕ 元の配列を書き換えている → 画面が更新されない
    checked[0] = true;
    setChecked(checked);

    // ○ 新しい配列を作る
    setChecked(checked.map((v, i) => (i === 0 ? !v : v)));
  reveal: false
  narration: |
    もう1つ、鉄則があります。ステートは、必ず新しい値を作って渡すこと。
    上は、元の配列の中身を書き換えてから渡しています。これでは画面が変わりません。
    Reactは、同じものか別のものか、だけを見ているからです。
    中身をいじっても、同じ配列なら、変わっていないと判断されます。

- kind: code
  heading: "チェックを1つだけ反転させる"
  caption: "components/RecipeResult.tsx"
  code: |
    function toggleChecked(i: number) {
      setChecked((prev) => prev.map((v, idx) => (idx === i ? !v : v)));
    }
  reveal: false
  narration: |
    実物がこれです。
    読み方は、いまのチェック状態を全部見て、押された番号だけ反転させた、新しい配列を作る。
    関数を渡す形にしているのは、いまの値をもとに次を決めるときの、安全な書き方だからです。

- kind: table
  heading: "イベントで必ず踏む、2つの罠"
  head: ["書き方", "何が起きるか"]
  rows:
  - ["onClick={handleSave()}", "*押される前に実行され、戻り値が渡る"]
  - ["onClick={handleSave}", "~これが正しい。押されたら呼ばれる"]
  - ["e.preventDefault() を忘れる", "*送信でページが再読み込みされ、画面が戻る"]
  narration: |
    ここで、必ず踏む罠を2つ。
    1つめ。オンクリックに、かっこを付けて書いてはいけません。
    それは、いますぐ実行して戻り値を渡す、という意味になります。渡すのは関数そのものです。
    2つめ。フォームの送信では、プリベント・デフォルトを呼ぶこと。
    忘れると、画面が一瞬で元に戻ります。

- kind: code
  heading: "入力欄とstateを、常に一致させる"
  caption: "制御されたコンポーネント"
  code: |
    <input value={input} onChange={(e) => setInput(e.target.value)} />
  reveal: false
  narration: |
    冒頭のデモで、打った文字がそのまま出ていた入力欄。正体はこれです。
    表示する値はステートから来て、打つたびにステートを更新する。
    この2つをセットにすると、入力欄の中身とステートが常に一致します。
    入力値を取り出す、という作業がそもそも要らなくなります。

# ---------------------------------------------------------- 置き場所

- kind: punch
  text: "実務でいちばん頭を使うのは、\nそのstateを「どこに置くか」。"
  em: ["どこに置くか"]
