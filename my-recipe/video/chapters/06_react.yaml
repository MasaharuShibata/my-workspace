# ---------------------------------------------------------- 問い①

- kind: agenda
  heading: "まず1つめ"
  items:
  - { text: "Reactは、何を楽にしてくれる？", state: "now", at: 0 }
  - { text: "画面を、どう部品に分ける？", at: 0 }
  - { text: "変わる値は、どこに置く？", at: 0 }
  reveal: false
  narration: |
    まず1つめ。Reactは、何を楽にしてくれるのか。

