    いちばん上の帯はヘッダーです。中身を横に並べて、両端に寄せてあります。
    真ん中の入力まわりはフォーム。ラベルと入力欄と選択欄とボタンが入っています。
    レシピが出てくるところはセクション。見出しの下に、材料の並びと手順の並び。
    お気に入り一覧のカードはアーティクル。白い背景も角丸も、クラスで指定しています。
    特別なものは、1つも出てきていません。

- kind: callout
  title: "やってみよう"
  text: |
    テキストエディタで test.html というファイルを作り、
    タグを2つ3つ書いて、ブラウザで開いてみてください。
    スタイルの数字を変えて、見た目が動くのを見るところまでやると身に付きます。
  narration: |
    ここで1つだけ、手を動かしてほしいことがあります。
    テキストエディタでテスト・エイチティーエムエル、というファイルを作って、
    タグを2つ3つ書き、ブラウザで開いてみてください。見本は原本の章末にあります。
    余白の数字を変えて、見た目が動くのを1回見ておくと、この章は身に付きます。

