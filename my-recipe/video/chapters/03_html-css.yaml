- kind: flow
  heading: "デモに出ていた画面の、正体"
  steps:
  - { who: "header", text: "ロゴとナビ。横並びにして、両端に寄せている" }
  - { who: "form", text: "label と input と select と button。横一列" }
  - { who: "section", text: "レシピ結果。h3 の下に、ul の材料と ol の手順" }
