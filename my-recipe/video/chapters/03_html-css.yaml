# my-recipe 開発教材 動画版 第3章
# 原本: my-recipe/tutorial/03_html-css.md
#
# Part 1(言語と道具の基礎)の1本目。原本の節順(3.1〜3.7)はなぞらず、
# 「この章で答える3つの問い」に組み替えている。
#
#   ① この画面は、何でできている？      … HTML = 構造
#   ② 見た目は、どこで決まっている？    … CSS  = 見た目
#   ③ 横並びとスマホ対応は、どうやる？  … Flexbox / CSS変数 / メディアクエリ
#
# 冒頭は実機デモ(input)で「いま見ている画面」を先に置き、
# 終盤でその画面をタグに分解し直して回収する。
# 原本の表のうち、口頭で聞いて追いにくいもの(タグ一覧13行・セレクタ一覧)は
# グループ分けのカードと4行までの表に圧縮した。
#
# デモのコマは scripts/capture-demo.mjs --scenes input,result で撮る。

title: "HTMLとCSS"
footer: "my-recipe 開発教材 #3"
voice: "ja-JP-NanamiNeural"
rate: "+6%"

slides:

