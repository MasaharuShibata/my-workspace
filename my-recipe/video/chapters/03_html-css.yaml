    1つめ。この画面は、そもそも何でできているのか。
    2つめ。見た目は、どこで決まっているのか。
    3つめ。横並びと、スマホ対応は、どうやるのか。
    この章はコードが出てきますが、覚える必要はありません。
    読んで意味が分かればいい、という距離感で聞いてください。

# ---------------------------------------------------------- 問い①

- kind: agenda
  heading: "まず1つめ"
  items:
  - { text: "この画面は、何でできている？", state: "now", at: 0 }
  - { text: "見た目は、どこで決まっている？", at: 0 }
  - { text: "横並びとスマホ対応は、どうやる？", at: 0 }
  reveal: false
  narration: |
    まず1つめ。この画面は、何でできているのか。

- kind: punch
  text: "HTMLは、\nプログラミング言語ではありません。"
  em: ["プログラミング言語ではありません"]
  sub: "文書に、意味の札を貼る仕組みです。"
  narration: |
    答えはHTMLです。ただ、ここで1つ誤解を解いておきます。
    HTMLは、プログラミング言語ではありません。
    計算も判断もしません。文書に、意味の札を貼るだけの仕組みです。

- kind: code
  heading: "札を貼る、というのはこういうこと"
  caption: "HTML"
  code: |
    <h1>my-recipe</h1>
    <p>手元にある食材を入力すると、AIがレシピを考案します。</p>
  reveal: false
  narration: |
    エイチワンで囲むと、これは大見出しです、という意味になります。
    ピーで囲むと、これは段落です。
    この囲むものをタグと呼びます。開始タグと終了タグがペアです。
    そして、タグで囲まれたひとまとまりを、要素と呼びます。
    タグと要素。まずこの2つだけ覚えてください。

- kind: code
  heading: "要素の中に、要素を入れられる"
  caption: "入れ子(ネスト)"
  code: |
    <article>
      <h3>鶏むね肉と白菜の生姜炒め</h3>
      <p>調理時間: 20分</p>
    </article>
  reveal: false
  narration: |
    要素の中には、さらに要素を入れられます。
    これを入れ子と呼びます。HTMLの構造は、ほぼこれだけでできています。
    ここでは、記事という箱の中に、見出しと段落が入っています。

- kind: verdict
  heading: "入れ子は、内側から閉じる"
  sides:
  - badge: "✕"
    tone: "ng"
    head: "閉じる順番が交差している"
    desc: "ピーの中で開いたストロングを、\nピーより後に閉じてしまっている。"
    at: 1
  - badge: "○"
    tone: "ok"
    head: "内側から順に閉じる"
    desc: "後から開いたものを、先に閉じる。\nこれだけ守れば崩れない。"
    at: 2
  narration: |
    1つだけ、やってはいけないことがあります。
    入れ子の順番を交差させることです。
    後から開いたタグを、先に開いたタグより後に閉じると、表示が崩れます。
    後から開いたものを先に閉じる。これだけ守れば大丈夫です。

- kind: code
  heading: "タグに、追加情報を持たせる"
  caption: "属性"
  code: |
    <a href="/favorites">お気に入り</a>
    <input type="text" placeholder="例: 鶏むね肉, 白菜">
    <img src="photo.jpg" alt="料理の写真">
  reveal: false
  narration: |
    もう1つ、属性というものがあります。
    開始タグの中に、名前、イコール、値、の形で書きます。
    リンクなら、どこへ飛ぶか。入力欄なら、どんな種類の入力か。
    画像なら、どのファイルを出すか。
    タグだけでは足りない情報を、ここで足していると思ってください。

- kind: cards
  heading: "覚えるタグは、3つのグループに分かれる"
  cards:
  - label: "文字を書く"
    title: "h1 〜 h4 / p"
    text: "見出しと段落。\nページタイトル、材料、作り方。"
    at: 1
  - label: "並べる"
    title: "ul / ol / li"
    text: "点が付く並びと、\n番号が付く並び。"
    at: 2
  - label: "入力する"
    title: "form / input / select\nbutton / label"
    text: "食材の入力欄、ジャンルの選択、\n考えてもらうボタン。"
    at: 3
  narration: |
    my-recipeに出てくるタグは、大きく3つのグループに分かれます。
    文字を書くもの。エイチワンからエイチフォーまでの見出しと、ピーの段落です。
    並べるもの。点が付くユーエルと、番号が付くオーエル。中身は両方エルアイです。
    入力するもの。フォームの中に、インプット、セレクト、ボタン、ラベルが入ります。
    このグループ分けを頭に置いて、もう一度アプリの画面を見てみます。

- kind: demo
  frames_dir: "demo/result"
  narration: |
    返ってきたレシピの画面です。
    料理名は見出し。材料は、点が付いた並び。
    作り方は、番号が自動で付く並び。
    チェックボックスも、インプットというタグが1つあるだけです。

- kind: code
  heading: "さっきの材料と作り方は、こう書いてある"
  caption: "リスト"
  code: |
    <h3>材料</h3>
    <ul>
      <li>鶏むね肉 200g</li>
      <li>白菜 1/4個</li>
    </ul>

    <h3>作り方</h3>
    <ol>
      <li>鶏むね肉を一口大に切る</li>
      <li>フライパンで炒める</li>
    </ol>
  reveal: false
  narration: |
    点や番号は、自分で書いていません。タグを変えるだけで自動で付きます。
    使い分けは意味で決めます。
    材料は、上から順に用意する必要がないので、順不同のユーエル。
    作り方は、順番が入れ替わると料理が失敗するので、オーエル。
    番号に意味があるかどうか。判断はそこだけです。

- kind: verdict
  heading: "似た箱が2種類あるのは、意味があるから"
  sides:
  - badge: "ただの箱"
    head: "div"
    desc: "意味は持たない。\n見た目を整えるためだけの箱。"
    at: 1
  - badge: "意味のある箱"
    tone: "ok"
    head: "section / article / header"
    desc: "ここは記事、ここはヘッダー、\nと機械にも伝わる箱。"
    at: 2
  narration: |
    最後に、箱の話をします。
    ディブは、意味を持たないただの箱。見た目を整えるために使います。
    セクションやアーティクルは、見た目は同じですが、ここは記事です、
    ここはヘッダーです、という意味が機械に伝わります。
    これをセマンティックHTMLと言って、検索エンジンや読み上げソフトが内容を理解できます。
    迷ったらディブで構いません。慣れてから直せばいい話です。

# ---------------------------------------------------------- 問い②

- kind: agenda
  heading: "2つめ"
  items:
  - { text: "この画面は、何でできている？", state: "done", at: 0 }
  - { text: "見た目は、どこで決まっている？", state: "now", at: 0 }
  - { text: "横並びとスマホ対応は、どうやる？", at: 0 }
  reveal: false
  narration: |
    2つめ。見た目は、どこで決まっているのか。

- kind: punch
  text: "HTMLが「何であるか」なら、\nCSSは「どう見えるか」。"
  em: ["どう見えるか"]
  sub: "役割を混ぜないのが、この章でいちばん大事なところです。"
  narration: |
    ここからがCSSです。
    HTMLが、これは何であるかを書くものだとしたら、
    CSSは、それがどう見えるかを書くものです。
    この役割分担を混ぜないこと。この章でいちばん大事なところです。

- kind: code
  heading: "CSSは、3つの部分でできている"
  caption: "CSS"
  code: |
    h1 {
      font-size: 32px;
      color: #2c231a;
    }
  reveal: false
  narration: |
    書き方は、3つの部分でできています。
    まず、どの要素に適用するか。これをセレクタと呼びます。ここではエイチワンです。
    次に、何を変えるか。プロパティです。文字の大きさと、色を指定しています。
    最後に、どう変えるか。値です。
    セレクタ、プロパティ、値。CSSはこの組み合わせしか出てきません。

- kind: table
  heading: "セレクタは、これだけ知っていれば足りる"
  head: ["書き方", "どれに当たるか"]
  rows:
  - ["h1", "すべての見出し1"]
  - ["*.card", "*クラスにcardと付いた要素"]
  - [".card h3", "cardの中にある見出し3"]
  - [".card:hover", "cardにマウスが乗っているとき"]
  narration: |
    セレクタの種類は、4つ知っていれば足ります。
    タグの名前をそのまま書くと、そのタグ全部に当たります。
    先頭に点を付けると、クラスという目印を付けた要素だけに当たります。
    空けて2つ並べると、この中にあるもの、という意味になります。
    コロンでホバーと書くと、マウスが乗っているときだけ。

- kind: punch
  text: "実務で使うのは、\nほぼ「点＋クラス名」だけ。"
  em: ["ほぼ「点＋クラス名」だけ"]
  sub: "my-recipe の globals.css も、ほとんどがクラス指定です。"
  narration: |
    ただ、実務で使うのは、ほぼ点とクラス名の組み合わせだけです。
    my-recipeのスタイルシートを開いても、ほとんどがこれです。
    残りは、そういう書き方もある、くらいで構いません。

- kind: code
  heading: "HTMLで名札を付けて、CSSで拾う"
  caption: "お気に入りカード"
  code: |
    <article class="favorite-card">...</article>

    .favorite-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 16px;
    }
  reveal: false
  narration: |
    実際の組み合わせはこうなります。
    HTML側で、この要素にはフェイバリット・カードという名札を付けておく。
    CSS側で、その名札が付いたものを拾って、見た目を指定する。
    背景を白にして、角を丸くして、内側に余白を取る。
    お気に入り一覧に並んでいた白いカードは、この数行でできています。

- kind: verdict
  heading: "ここだけは、最初に区別してほしい"
  sides:
  - badge: "内側"
    head: "padding"
    desc: "枠線と中身のあいだの余白。\n背景色が付く範囲に含まれる。"
    at: 1
  - badge: "外側"
    head: "margin"
    desc: "箱と箱のあいだの距離。\n背景色は付かない。"
    at: 2
  narration: |
    そして、初心者が必ず1度は混乱するものを先に潰しておきます。
    パディングとマージンです。
    パディングは、箱の内側の余白。枠線と中身のあいだで、背景色が付く範囲です。
    マージンは、箱の外側の余白。箱と箱のあいだの距離で、背景色は付きません。
    内側か、外側か。違いはそれだけです。

- kind: table
  heading: "症状から引けるようにしておく"
  head: ["画面がこうなっていたら", "直すのはこっち"]
  rows:
  - ["文字と枠線が近すぎる", "*padding を増やす"]
  - ["カード同士がくっついている", "*margin を増やす"]
  narration: |
    実際に使うときは、症状から引くと早いです。
    文字と枠線が近すぎて窮屈なら、内側のパディングを増やす。
    カード同士がくっついて見えるなら、外側のマージンを増やす。
    この2つで、余白の悩みはだいたい解決します。

- kind: code
  heading: "色の書き方は、3つだけ"
  caption: "色"
  code: |
    color: #cf6a2c;
    color: rgb(207, 106, 44);
    color: rgba(207, 106, 44, 0.5);
  reveal: false
  narration: |
    色の書き方も見ておきます。
    いちばんよく使うのが、シャープから始まる16進数。赤、緑、青の強さを2桁ずつ並べたものです。
    アールジービーと書けば、0から255の数字でも指定できますし、
    最後にもう1つ数字を足すと、透明度になります。
    16進数を自分で計算する必要はありません。カラーピッカーで選んで貼るだけです。

# ---------------------------------------------------------- 問い③

- kind: agenda
  heading: "最後の問い"
  items:
  - { text: "この画面は、何でできている？", state: "done", at: 0 }
  - { text: "見た目は、どこで決まっている？", state: "done", at: 0 }
  - { text: "横並びとスマホ対応は、どうやる？", state: "now", at: 0 }
  reveal: false
  narration: |
    最後の問いです。横並びと、スマホ対応は、どうやるのか。

- kind: punch
  text: "「横に並べたい」の答えは、\nほぼ Flexbox です。"
  em: ["ほぼ Flexbox です"]
  narration: |
    Webの見た目でいちばん多い悩みが、横に並べたい、です。
    その答えは、ほぼフレックスボックスひとつで済みます。

- kind: code
  heading: "親に2行書くと、中身が横に並ぶ"
  caption: "食材入力の行"
  code: |
    .ingredient-form-row {
      display: flex;
      gap: 12px;
    }
  reveal: false
  narration: |
    やることは、並べたいものを囲んでいる親に、2行書くだけです。
    ディスプレイ・フレックスで、中身を横一列に並べる。
    ギャップで、そのあいだの間隔を決める。
    これだけで、入力欄と選択欄とボタンが、きれいに横並びになります。

- kind: table
  heading: "あとは、この4つで調整する"
  head: ["指定", "効果"]
  rows:
  - ["*justify-content: space-between", "両端に寄せて、あいだを空ける"]
  - ["*align-items: center", "縦方向の中央で揃える"]
  - ["*flex-direction: column", "横ではなく、縦に並べる"]
  - ["*flex: 1", "余った幅を、その要素に吸わせる"]
  narration: |
    細かい調整は、この4つでほぼ足ります。
    ジャスティファイ・コンテント、スペース・ビトウィーンで、両端に寄せる。
    アライン・アイテムズ、センターで、縦方向の中央に揃える。
    フレックス・ディレクション、カラムにすると、横ではなく縦に並びます。
    フレックス、1を付けた要素は、余った幅を吸って広がります。

- kind: code
  heading: "アプリのヘッダーは、実質これだけ"
  caption: "サイトヘッダー"
  code: |
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  reveal: false
  narration: |
    実例を見ます。デモの画面の、いちばん上の帯です。
    左にロゴ、右にお気に入りへのリンクが出ていました。
    あれは、横に並べて、両端に寄せて、縦の中央で揃える。この3行だけです。
    昔はフロートという難解な方法を使っていましたが、今は忘れて大丈夫です。
    横並びはフレックスボックス、格子状はグリッド。2つ覚えれば、まず困りません。

- kind: punch
  text: "同じ色を20か所に書くと、\n変えるときに20か所直すことになります。"
  ng: ["20か所直すことになります"]
  narration: |
    次に、色の管理の話をします。
    同じオレンジを、ボタンにも、リンクにも、見出しにも書いたとします。
    後で少し落ち着いた色にしたくなったとき、20か所を探して直すことになります。

- kind: code
  heading: "色に名前を付けて、1か所で管理する"
  caption: "CSS変数"
  code: |
    :root {
      --color-accent: #cf6a2c;
      --radius-md: 14px;
    }

    button {
      background: var(--color-accent);
      border-radius: var(--radius-md);
    }
  reveal: false
  narration: |
    そこで、色に名前を付けます。CSS変数、と呼ばれるものです。
    コロン・ルートは、ページ全体を指す特別なセレクタです。
    ここで、ハイフン2つに続けて名前を書くと、値に名前が付きます。
    使う側は、バー、かっこ、その名前、と書いて呼び出します。
    数字が直接書いてあった場所が、意味のある名前に変わりました。

- kind: punch
  text: "アプリの配色は、\nこの十数行で決まっている。"
  em: ["この十数行"]
  sub: "globals.css の冒頭を書き換えれば、画面全体の色が変わります。"
  narration: |
    これが効いてきます。
    my-recipeのスタイルシートは、冒頭にこの定義をまとめてあります。
    つまり、アプリの配色を変えたければ、この十数行を書き換えるだけでいい。
    デモで見てもらったあの色味は、そこで決まっています。
    バラバラに書かず一箇所に集める。これは立派な設計判断です。

- kind: code
  heading: "画面の幅で、CSSを切り替える"
  caption: "メディアクエリ"
  code: |
    .ingredient-form-row {
      display: flex;
    }

    @media (max-width: 600px) {
      .ingredient-form-row {
        flex-direction: column;
      }
    }
  reveal: false
  narration: |
    最後にスマホ対応です。
    やることは、画面の幅によってCSSを切り替える、それだけです。
    アットマーク・メディアと書いて、条件をかっこで指定します。
    ここでは、画面の幅が600ピクセル以下のとき、と書いています。
    そのときだけ、横並びをやめて縦並びに変える。
    この書き方を、メディアクエリと呼びます。

- kind: punch
  text: "HTMLは1つのまま、\nCSSだけを切り替える。"
  em: ["CSSだけを切り替える"]
  sub: "スマホ用のページを別に作るわけではありません。"
  narration: |
    ここで大事なのは、スマホ用のページを別に作っているわけではない、という点です。
    HTMLは1つのまま。当たるCSSだけが切り替わっています。
    my-recipeはスマホで使う想定なので、この切り替えが要ります。

# ============================================================ 回収

- kind: section
