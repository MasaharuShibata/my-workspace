- kind: punch
  text: "「後で直す」と分かっていれば、\n今はそれでいい。"
  sub: "直すのは次の第11章。一度に全部やろうとすると、どこで間違えたか分からなくなります。"
  narration: |
    直すのは次の第11章です。外から受け取る形に変えます。
    後で直すと分かっていれば、今はそれでいいんです。
    一度に全部やろうとすると、動かなくなったとき、どこで間違えたのか分からなくなります。

- kind: callout
  tone: "danger"
  title: "ただし、仮実装には必ず印を残す"
  text: |
    // Step 4 で本物のAIに差し替える
    このコメントを書かないと、偽のデータが本番に残ります。実際によくある事故です。
  narration: |
    ただし、条件が1つあります。仮実装には、必ず印を残すこと。
    さっきのコメント、ステップ4で本物に差し替える、というあの1行です。
    これを書かないと、公開したあとも偽のレシピが出続けます。
    笑い話ではなく、実際によくある事故です。
    後回しにしていいのは、後回しにしたと分かるようにしてある場合だけです。

- kind: punch
  text: "CSSも、読める程度だけ。"
  sub: "本格的な装飾は Step 9、第17章。今は、構造が見えればいい。"
  narration: |
    見た目の作り込みも、同じ考え方で後回しにします。
    今日当てるCSSは、読める程度だけです。
    本格的な装飾はStep 9、第17章でやります。

- kind: table
  heading: "今日使うのは、この4つだけ"
  head: ["指定", "効果"]
  rows:
  - ["max-width と margin: 0 auto", "中央寄せ。幅を制限して読みやすくする"]
  - ["display: flex と gap", "横に並べる"]
  - ["flex: 1", "余った幅を入力欄に吸わせる"]
  - ["justify-content: space-between", "ロゴを左、ナビを右に離す"]
  narration: |
    使うのは4つだけです。
    マックス・ウィドゥスとマージン・オート。中央寄せの定番です。
    フレックスとギャップで、横に並べる。
    フレックス・ワンで、余った幅を入力欄に吸わせる。
    スペース・ビトウィーンで、ロゴを左、ナビを右に離す。
    全部、3章でやったものです。新しいことは何もしていません。

