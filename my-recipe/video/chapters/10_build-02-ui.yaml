# my-recipe 開発教材 動画版 第10章
# 原本: my-recipe/tutorial/10_build-02-ui.md
#
# この章の勘どころは「動かない画面から作る」という、直感に反する進め方そのもの。
# 原本の節順(なぜ → Header → フォーム → 結果 → CSS → 確認)をそのままなぞると
# 「部品を3つ作りました」で終わってしまうので、3つの問いに組み替える。
#
#   ① なぜ、動かない画面から作るのか   … 10.1
#   ② その画面は、何でできているのか   … 10.2 - 10.4
#   ③ どこまで後回しにしていいのか     … 10.4後半 - 10.6
#
# 冒頭は完成品のデモ(input / result)で「今日の到達点」を見せ、
# 直後に「ただし一切動かない」と裏切る。終盤でそのデモに戻り、
# 今日作った画面と完成形の違い(見た目は同じ・中身が違う)で回収する。
#
# デモのコマは scripts/capture-demo.mjs --scenes input,result で撮る。

title: "動かない画面を作る"
footer: "my-recipe 開発教材 #10"
voice: "ja-JP-NanamiNeural"
