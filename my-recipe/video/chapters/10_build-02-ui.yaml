# ============================================================ 問い②

- kind: agenda
  heading: "2つめ"
  items:
  - { text: "なぜ、動かない画面から作る？", state: "done", at: 0 }
  - { text: "その画面は、何でできている？", state: "now", at: 0 }
  - { text: "どこまで後回しにしていい？", at: 0 }
  reveal: false
  narration: |
    2つめ。では、その画面は何でできているのか。

- kind: diagram
  heading: "画面を、3つの部品に切る"
  nodes:
  - { t: node, title: "Header", sub: "ロゴと、ホーム・お気に入りのリンク" }
  - { t: arrow, label: "" }
  - { t: node, title: "IngredientForm", sub: "食材の入力欄・ジャンル選択・ボタン", tone: "accent" }
  - { t: arrow, label: "" }
  - { t: node, title: "RecipeResult", sub: "料理名・材料・手順の表示" }
  narration: |
    答えは、3つの部品です。
    上から、ヘッダー。ロゴと、リンクが並ぶところ。
    真ん中が、入力フォーム。食材の入力欄と、ジャンル選択と、ボタン。
    下が、レシピ表示。料理名と材料と手順が出るところです。
    これを上から1つずつ作ります。1枚のファイルに全部書こうとしないこと。

- kind: code
  heading: "① ヘッダー"
  caption: "components/Header.tsx"
  code: |
    export default function Header() {
      return (
        <header className="site-header">
          <Link href="/" className="brand">my-recipe</Link>
          <nav className="site-nav">
            <Link href="/">ホーム</Link>
            <Link href="/favorites">お気に入り</Link>
          </nav>
        </header>
      );
    }
  narration: |
    一番簡単なヘッダーから作ります。
    やっていることは、ロゴと、リンクを2つ並べているだけです。
    新しい文法は1つも出てきません。
    ここまでの章で習ったものだけで書けています。

- kind: table
  heading: "見るべきところは、3つ"
  head: ["書いたもの", "なぜそう書くか", "習った章"]
  rows:
  - ["*<Link>", "ページ移動は <a> ではなくこちら", "07章"]
  - ["*className", "JSXでは class ではなくこちら", "06章"]
  - ["*\"use client\" が無い", "stateもクリックも無い。サーバーのままでいい", "07章"]
  narration: |
    確認したいのは3つです。
    ページ移動は、エータグではなくリンクタグを使う。7章でやりました。
    クラスの指定は、クラスではなくクラスネーム。6章です。
    そして、ユーズ・クライアントが書いてありません。
    ステートもクリックも使っていないので、サーバーコンポーネントのままでいい。
    何を書いたかより、なぜそう書けるのかを言えることが大事です。

- kind: callout
  tone: "bad"
  title: "お気に入りのリンクは、押すと404になります"
  text: |
    そのページをまだ作っていないからです。今は、これで正常。
    作るのは Step 7、第15章です。
  narration: |
    1つ注意です。
    お気に入りのリンクを押すと、404、ページが見つかりません、と出ます。
    そのページをまだ作っていないからで、今はこれで正常です。
    作るのはStep 7、第15章になります。
    エラーが出たとき、それが想定内かどうかを区別できることも、立派な技術です。

- kind: code
  heading: "② 入力フォーム"
  caption: "components/IngredientForm.tsx"
  code: |
    const MAX_INGREDIENTS = 10;

    export default function IngredientForm() {
      return (
        <form className="ingredient-form">
          <label htmlFor="ingredients">食材(最大{MAX_INGREDIENTS}個)</label>
          <input id="ingredients" placeholder="例: 鶏むね肉, 白菜" />
          <select id="genre" aria-label="ジャンル">
            {GENRES.map((g) => <option key={g} value={g}>{g}</option>)}
          </select>
          <button type="submit">レシピを考えてもらう</button>
        </form>
      );
    }
  narration: |
    次が入力フォームです。まだ動きません。HTMLとしての形だけ作ります。
    入力欄、ジャンルの選択、送信ボタン。並べているだけに見えますが、
    ここには考え方が2つ埋まっています。順に見ます。

- kind: bigstat
  value: "3"
  unit: "か所"
  formula: "ラベルの文言 ・ 入力チェック ・ エラーメッセージ"
  caption: "「最大10個」という数字が出てくる場所。1か所で管理しないと、必ず食い違う。"
  narration: |
    1つめ。最大10個、という数字が出てくる場所を数えてみてください。
    ラベルの文言、このあと作る入力チェック、そしてエラーメッセージ。3か所あります。
    だから10とは直接書かず、マックス・アンダーバー・イングリーディエンツ、
    という名前の定数にしてあります。
    3か所にベタ書きすると、上限を変えたとき、必ずどこかが食い違います。

- kind: verdict
  heading: "2つめ。ジャンルの選択肢は7つ"
  sides:
  - badge: "✕"
    tone: "ng"
    head: "7回書く"
    desc: "和食、洋食、中華……と手で並べる。\nジャンルを増やすとき、型と画面の両方を直す。"
    at: 1
  - badge: "○"
    tone: "ok"
    head: "GENRES から作る"
    desc: "09章で書いた一覧から map で生成。\n型定義に1行足すだけで、画面にも出る。"
    at: 2
  narration: |
    2つめ。ジャンルの選択肢は7つあります。
    和食、洋食、中華、と手で7回書いてもいいのですが、そうすると
    ジャンルを増やすとき、型定義と画面の両方を直すことになります。
    9章で書いたジャンルズという一覧から、マップで作れば、
    型定義に1行足すだけで画面にも出てきます。
    同じものを2か所に書かない。これは、この先ずっと効いてくる考え方です。

- kind: callout
  title: "ボタンを押すと、ページが再読み込みされます"
  text: |
    フォームの標準の動きなので、これも正常です。
    止めるのは Step 3、次の第11章です。
  narration: |
    この時点でボタンを押すと、ページが再読み込みされます。
    これもフォームの標準の動きなので、故障ではありません。
    3章でやったフォームの話ですね。
    止めるのは次の第11章です。

- kind: punch
  text: "ここからが、この章の本番です。"
  sub: "レシピの表示。まだAIがいないので、偽のレシピを埋め込みます。"
  narration: |
    そして3つめ。ここからが、この章の本番です。
    レシピを表示するところを作ります。
    ただし、まだAIはいません。偽のレシピを埋め込んで表示します。

- kind: code
  heading: "③ レシピ表示"
  caption: "components/RecipeResult.tsx"
  code: |
    export default function RecipeResult({ recipe }: { recipe: Recipe }) {
      return (
        <section className="recipe-result">
          <h2>{recipe.title}</h2>
          <p>調理時間: {recipe.cookingTime} ・ {recipe.servings}</p>

          <h3>材料</h3>
          <ul>
            {recipe.ingredients.map((item, i) => <li key={i}>{item}</li>)}
          </ul>

          <h3>作り方</h3>
          <ol>
            {recipe.steps.map((s, i) => <li key={i}>{s}</li>)}
          </ol>
        </section>
      );
    }
  narration: |
    レシピを外から受け取って、中身を並べているだけです。
    受け取り口がプロップス。6章でやりました。
    そして受け取るものの型は、9章で書いたレシピ型をそのまま使っています。
    材料と手順は配列なので、マップで1件ずつリストに変換します。

- kind: verdict
  heading: "材料と手順で、タグを使い分ける"
  sides:
  - badge: "材料"
    head: "ul"
    desc: "順番に意味が無い。\nしょうゆが先でも後でも困らない。"
    at: 1
  - badge: "手順"
    tone: "ok"
    head: "ol"
    desc: "順番に意味がある。\n炒める前に切らないといけない。"
    at: 2
  narration: |
    ここで、材料はユーエル、手順はオーエルと書き分けています。
    順番に意味があるかどうかで決めます。
    材料は、しょうゆが先でも後でも困りません。
    でも手順は、炒める前に切らないといけない。順番に意味があります。
    3章でやった、意味のあるタグを使う、という話がここで効いてきます。

- kind: code
  heading: "偽のレシピを、画面に流し込む"
  caption: "app/page.tsx"
  code: |
    // Step 4 で本物のAIに差し替える。それまでの仮データ
    const DUMMY_RECIPE: Recipe = {
      title: "鶏むね肉と白菜の生姜炒め",
      cookingTime: "20分",
      servings: "2人分",
      ingredients: ["鶏むね肉 200g", "白菜 1/4個", "しょうが 1片"],
      steps: ["鶏むね肉をそぎ切りにする", "ごま油で炒める"],
    };
  narration: |
    流し込む中身がこれです。手で書いた、嘘のレシピです。
    これをさっきの部品に渡すと、画面には完成形とほぼ同じものが並びます。
    AIも通信もデータベースも、1つも使っていないのに、です。

- kind: punch
  text: "偽のデータを置くと、\n必要なデータの形が先に決まる。"
  em: ["必要なデータの形が先に決まる"]
  sub: "これが、この章でいちばん大きい収穫です。"
  narration: |
    ここが、この章でいちばん大きい収穫です。
    偽のデータを置くと、必要なデータの形が先に決まります。
    料理名は文字列、材料は文字列の配列、手順も配列。
    第13章でAIに繋ぐとき、AIにはこの形で返してもらえばいい、と決まっている。
    画面から逆算して、注文の仕様が確定するわけです。

- kind: punch
  text: "型を先に書いておくと、\nエディタが項目を教えてくれる。"
  sub: "recipe. と打った瞬間に、title や ingredients が候補に出る。打ち間違いも減ります。"
  narration: |
    もう1つ、9章で型を書いておいた効果がここで出ます。
    レシピ、ドット、と打った瞬間に、タイトル、材料、手順、と候補が出てきます。
    型を書くのは面倒に見えますが、書いた分はこうやって返ってきます。

# ============================================================ 問い③

- kind: agenda
  heading: "最後の問い"
  items:
  - { text: "なぜ、動かない画面から作る？", state: "done", at: 0 }
  - { text: "その画面は、何でできている？", state: "done", at: 0 }
  - { text: "どこまで後回しにしていい？", state: "now", at: 0 }
