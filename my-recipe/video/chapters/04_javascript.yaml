# ============================================================ 問い①

- kind: agenda
  heading: "まず1つめ"
  items:
  - { text: "打ち込んだ一行が、どうやって材料のリストになる？", state: "now", at: 0 }
  - { text: "返ってきたレシピは、コードの中でどんな形をしている？", at: 0 }
  - { text: "返事を待っている数秒、コードは何をしている？", at: 0 }
  reveal: false
  narration: |
    まず1つめ。打ち込んだ一行が、どうやって材料のリストになるのか。

- kind: punch
  text: "入力欄に入っているのは、\n1本の長い文字列です。"
  em: ["1本の長い文字列"]
  sub: "「鶏むね肉、カンマ、白菜、カンマ、しょうが」。コードから見れば、ただの文字の並び。"
  narration: |
    人間の目には食材が3つ並んで見えますが、コードから見ると1本の長い文字列です。
    鶏むね肉、カンマ、白菜、カンマ、しょうが。ただの文字の並びでしかありません。

- kind: verdict
  heading: "値に名前を付ける。頭に付けるのは2つだけ"
  sides:
  - badge: "const"
    tone: "ok"
    head: "後から変えない"
    desc: "原則こっち。\n変わらないと分かる変数は、読むのが楽。"
    at: 1
  - badge: "let"
    head: "後から変える"
    desc: "どうしても必要なときだけ。"
    at: 2
  narration: |
    値に名前を付けるときは、頭にコンストかレットと書きます。
    コンストは後から変えない。レットは後から変える。
    迷う必要はありません。全部コンストで書いて、エラーになったものだけレットに直す。
    これでほぼ間違いません。

- kind: code
  heading: "文字列に、変数を埋め込む"
  caption: "囲むのは、バッククォート"
  code: |
    const count = 3;
    const message = `食材は${count}個までにしてください。`;
    // → 食材は3個までにしてください。
  narration: |
    文字列に変数を入れたいときは、こう書きます。
    ドルマークと波かっこで囲んだところに、変数の中身が差し込まれる。
    ただし、これができるのはバッククォートで囲んだときだけです。
    いつものダブルクォートだと、書いたままの文字が出ます。定番のつまずきどころです。

- kind: flow
  heading: "1本の文字列を、材料のリストに変える"
  steps:
  - { who: "split", text: "区切り文字で切って、配列にする" }
  - { who: "trim", text: "前後の空白を落とす" }
  - { who: "filter", text: "空っぽになったものを捨てる" }
  narration: |
    やることは3段階です。
    スプリットで、区切り文字のところで切って配列にする。
    トリムで、前後の余分な空白を落とす。
    フィルターで、空になってしまったものを捨てる。

- kind: code
  heading: "アプリの中に、実際にこう書いてあります"
  caption: "components/IngredientForm.tsx"
  code: |
    input.split(/[,、]/).map((s) => s.trim()).filter((s) => s.length > 0)
  reveal: false
  narration: |
    これが実物です。左から右へ、順番に読んでください。
    切って、整えて、空を捨てる。さっきの3段階がそのまま並んでいます。
    スラッシュで囲まれたカンマと読点は、正規表現というものです。
    今は、区切り文字を2つ指定しているとだけ分かれば十分です。

- kind: punch
  text: "map。React を書くうえで、\n一番よく使うメソッドです。"
  em: ["一番よく使う"]
  narration: |
    いま通り過ぎたマップ。これは特別扱いさせてください。
    Reactを書くうえで、一番よく使うメソッドです。

- kind: code
  heading: "配列を、同じ長さの別の配列に変える"
  caption: "やっていることは、これだけ"
  code: |
    const ingredients = ["鶏むね肉", "白菜"];
    ingredients.map((item) => `・${item}`);
    // → ["・鶏むね肉", "・白菜"]
  narration: |
    要素をひとつずつ取り出して、決めた処理をして、同じ長さの新しい配列を作る。
    それだけです。2つ入っていたら、出てくるのも2つ。

- kind: code
  heading: "この形が、第6章でそのまま出てきます"
  caption: "材料の配列を、画面の行の配列に変える"
  code: |
    {recipe.ingredients.map((item, i) => (
      <li key={i}>{item}</li>
    ))}
  reveal: false
  narration: |
    材料の配列を、画面に並べる行の配列に変えています。
    材料が5つなら行が5つ、8つなら8つ。数を決め打ちしなくて済みます。

- kind: verdict
  heading: "map と filter。似ていますが、役割が違う"
  sides:
  - badge: "map"
    head: "全部を、別のものに変える"
    desc: "長さは変わらない。\n材料の配列を、画面の行に変える。"
    at: 1
  - badge: "filter"
    head: "条件に合うものだけ残す"
    desc: "長さは減る。\n空っぽの食材を、捨てる。"
    at: 2
  narration: |
    さっきの一行に出てきた、マップとフィルター。役割が違います。
    マップは全部を別のものに変えるので、長さは変わりません。
    フィルターは条件に合うものだけ残すので、長さは減ります。

- kind: callout
  tone: "bad"
  title: "配列に何かを足すとき、push は使わない"
  text: |
    nums.push(4) は、元の配列を書き換える → React が気づかない
    [...nums, 4] は、新しい配列を作る → こちらが正解
  narration: |
    配列に何かを足すとき、プッシュは使わないでください。元の配列を書き換えてしまいます。
    角かっこの中に点を3つ書くほう、スプレッド構文は、新しい配列を作ります。
    Reactは、中身が変わったかではなく、別のものに差し替わったかで画面を描き直します。
    だから元を書き換えると、気づいてもらえません。

- kind: code
  heading: "冒頭のエラーの正体は、この数行でした"
  caption: "送る前に、ブラウザが止めている"
  code: |
    if (ingredients.length === 0) {
      setError("食材を1つ以上入力してください。");
      return;
    }
  reveal: false
  narration: |
    最初に見てもらった、空のまま押すとエラーが出るあれ。正体はこの数行です。
    材料の長さがゼロと等しければ、文言を出して、リターンでそこを打ち切る。
    だから、送信まで進みません。

- kind: table
  heading: "比較は、イコールを3つ"
  head: ["書き方", "意味"]
  rows:
  - ["=", "~代入。変数に入れる"]
  - ["==", "~ゆるい比較。使わない"]
  - ["===", "*厳密な比較。これを使う"]
  narration: |
    いま出てきた、イコールを3つ。JavaScriptの比較はこれを使ってください。
    1つは代入。値を入れる意味です。
    2つは、ゆるい比較。文字の1と数字の1を等しいと判定するので、事故の元です。
    3つが厳密な比較。迷ったらこれ、で構いません。

# ============================================================ 問い②

- kind: agenda
  heading: "2つめ"
  items:
  - { text: "打ち込んだ一行が、どうやって材料のリストになる？", state: "done", at: 0 }
  - { text: "返ってきたレシピは、コードの中でどんな形をしている？", state: "now", at: 0 }
  - { text: "返事を待っている数秒、コードは何をしている？", at: 0 }
  reveal: false
  narration: |
    2つめ。返ってきたレシピは、コードの中でどんな形をしているのか。

- kind: demo
  frames_dir: "demo/result"
  narration: |
    これが返ってきたレシピです。
    料理名、調理時間、人数、材料、手順。
    種類の違うものが、ひとかたまりになっています。
    これをコードでどう表すのか。

- kind: verdict
  heading: "入れ物は2種類。中身で決まる"
  sides:
  - badge: "配列"
    head: "同じ種類のものが並ぶ"
    desc: "材料が5つ。手順が3つ。\n順番に意味がある。"
    at: 1
  - badge: "オブジェクト"
    tone: "ok"
    head: "違う意味の項目が集まる"
    desc: "名前と、時間と、人数。\n名前を指して取り出す。"
    at: 2
  narration: |
    配列は、同じ種類のものが並んでいるとき。材料が5つ、手順が3つ、という具合です。
    オブジェクトは、違う意味の項目が集まっているとき。
    料理名と調理時間と人数は種類が違うので、並べても意味がありません。

- kind: code
  heading: "レシピ1件。これがオブジェクト"
  caption: "オブジェクトの中に、配列が入っている"
  code: |
    const recipe = {
      title: "鶏むね肉と白菜の生姜炒め",
      cookingTime: "20分",
      ingredients: ["鶏むね肉 200g", "白菜 1/4個"],
    };
  reveal: false
  narration: |
    波かっこで囲んで、名前とコロンと値を並べる。
    材料のところだけ、中身が配列になっていますね。
    第1章で見たJSONにそっくりだと思います。ほとんど同じものです。

- kind: code
  heading: "取り出し方は、2つあります"
  caption: "下が分割代入。上と同じことを、短く書いている"
  code: |
    recipe.title;
    const { title, cookingTime } = recipe;
  reveal: false
  narration: |
    取り出すときは、ドットでつなぎます。レシピ・ドット・タイトル。
    下は分割代入といって、複数の値をまとめて取り出す書き方です。
    Reactで多用するので、見た目だけ覚えておいてください。

- kind: code
  heading: "外から来たデータは、慎重に触る"
  caption: "app/api/generate-recipe/route.ts"
  code: |
    const genre = body?.genre;
    const value = input ?? "こだわりなし";
  reveal: false
  narration: |
    上の、はてなとドット。オプショナルチェーンといいます。
    ボディが空でも、エラーで止まらずに済みます。
    下のはてな2つは、左が空のときだけ右を使う、という意味。
    外から来たデータを触るときは、はてなドットを付ける。そう覚えてください。
    サーバー側には、誰が何を送ってくるか分からないからです。

- kind: verdict
  heading: "処理に名前を付ける。書き方は2つ"
  sides:
  - badge: "function"
    head: "関数宣言"
    desc: "コンポーネントは\nだいたいこちら。"
    at: 1
  - badge: "=>"
    head: "アロー関数"
    desc: "その場限りの処理。\nさっき map に渡していたのが、これ。"
    at: 2
  narration: |
    ここで関数です。処理にひとまとまりの名前を付けるもの。
    上が、ファンクションと書く昔からの書き方。
    下が、矢印を描くアロー関数。どちらも同じことをします。
    さっきマップに渡していた、かっこ、アイテム、矢印。あれもアロー関数でした。

- kind: code
  heading: "JavaScript では、関数を値として渡せます"
  caption: "「これをやっておいて」と手渡す"
  code: |
    ingredients.map((item) => `・${item}`);
    <button onClick={() => handleSave()}>保存</button>
  reveal: false
  narration: |
    上はマップに、各要素にこれをやってと渡している。
    下はボタンに、押されたときにこれをやってと渡している。
    これをコールバック関数と呼びます。
    Reactは、この性質の上に成り立っています。最初は気持ち悪いですが、慣れます。

- kind: code
  heading: "ボタンの文字は、1行で切り替えている"
  caption: "三項演算子。はてなの左が条件"
  code: |
    const label = generating ? "考案中..." : "レシピを考えてもらう";
  reveal: false
  narration: |
    イフを1行の式にしたものが、三項演算子です。
    はてなの左が条件。間が、条件を満たすとき。コロンの右が、そうでないとき。
    このアプリのボタンの文字は、すべてこれで切り替えています。

- kind: code
  heading: "「あれば表示、無ければ何も出さない」"
  caption: "アンドを2つ。JSX の定番"
  code: |
    {error && <p className="form-error">{error}</p>}
  reveal: false
  narration: |
    アンドを2つ並べると、エラーに何か入っていればタグを出し、空なら何も出しません。
    JavaScriptは、真偽値でなくても条件に使えます。
    偽として扱われるのは6つだけ。フォルス、ゼロ、空の文字列、ヌル、アンディファインド、ナン。

- kind: callout
  tone: "danger"
  title: "ただし、数値にアンド2つは事故ります"
  text: |
    {count && <p>…</p>} と書くと、count が 0 のとき画面に 0 と出る
    {count > 0 && <p>…</p>} のように、数値は明示的に書く
  narration: |
    その6つにゼロが入っているせいで、有名な事故が起きます。
    上のように書くと、カウントがゼロのとき、画面にゼロという文字が出てしまいます。
    数値を条件にするときは、下のように明示的に書いてください。

# ============================================================ 問い③

- kind: agenda
  heading: "最後の問い。ここが山場です"
  items:
  - { text: "打ち込んだ一行が、どうやって材料のリストになる？", state: "done", at: 0 }
  - { text: "返ってきたレシピは、コードの中でどんな形をしている？", state: "done", at: 0 }
  - { text: "返事を待っている数秒、コードは何をしている？", state: "now", at: 0 }
  reveal: false
  narration: |
    最後の問いです。そして、ここがこの章の山場です。

- kind: demo
  frames_dir: "demo/thinking"
  narration: |
    ボタンを押してから、レシピが出るまでの数秒。
    コードは何をしているのか。

- kind: punch
  text: "待っている間、\n他のことをする。"
  em: ["他のことをする"]
  sub: "これが「非同期処理」。名前は難しいですが、考え方は単純です。"
  narration: |
    AIに聞くと、返事まで1秒から3秒かかります。その間ずっと画面が固まったら最悪です。
    だからJavaScriptは、待っている間に他のことをする仕組みを持っています。
    これを非同期処理と呼びます。名前は難しいですが、考え方はこれだけです。

- kind: split
  icon: "ai"
  heading: "Promise とは"
  big: "「あとで必ず返します」という引換券"
  small: "今は結果が無い。\nでも、結果か失敗かを、必ず返してくれる。"
  narration: |
    その中心にあるのが、プロミス。日本語だと、約束です。
    今は結果が無いけれど、あとで必ず、結果か失敗かを返す。
    そういう引換券だと思ってください。

- kind: anim
  name: "request-response"
  frames: 26
  heading: "await が待っているのは、この往復"
  narration: |
    待っているものの正体は、第1章で見たこの往復です。
    お願いを送って、返事が返る。この時間を待っています。

- kind: code
  heading: "引換券を、読みやすく扱う書き方"
  caption: "async と await"
  code: |
    async function generate() {
      const res = await fetch("/api/generate-recipe");
      const data = await res.json();
    }
  reveal: false
  narration: |
    書き方がこれです。エイシンクと、アウェイト。
    アウェイトと書くと、返事が来るまでそこで待ってくれます。

- kind: verdict
  heading: "ルールは、2つだけ"
  sides:
  - badge: "1"
    head: "await を使う関数には\nasync を付ける"
    desc: "忘れると「await は async 関数の中でしか使えません」というエラー。"
    at: 1
  - badge: "2"
    head: "時間のかかる処理の前に\nawait を付ける"
    desc: "忘れると、中身ではなく\n引換券そのものが変数に入る。"
    at: 2
  narration: |
    ルールは2つだけ。
    アウェイトを使う関数には、頭にエイシンクを付ける。
    忘れるとエラーが教えてくれるので、すぐ直せます。
    もう1つ、時間のかかる処理の前にアウェイトを付ける。
    こちらは忘れてもエラーになりません。だから厄介です。

- kind: punch
  text: "画面に「オブジェクト プロミス」と出たら、\nほぼ await の付け忘れです。"
  ng: ["ほぼ await の付け忘れ"]
  sub: "中身ではなく、引換券そのものを画面に描こうとしています。"
  narration: |
    なぜか画面に、オブジェクト・プロミス、という謎の文字が出る。
    原因はほぼこれです。引換券そのものを、画面に描こうとしている。
    この文字を見たら、アウェイトを探してください。

- kind: table
  heading: "そして、通信は必ず失敗します"
  head: ["ブロック", "いつ動く"]
  rows:
  - ["try", "通常の処理"]
  - ["catch", "try の中でエラーが起きたとき"]
  - ["finally", "*どちらの場合も、最後に必ず"]
  narration: |
    もう1つ。ネットワークは必ず失敗します。
    アプリが死なないように、3つのブロックで囲みます。
    トライが通常の処理。キャッチが、エラーが起きたとき。
    ファイナリーは、成功しても失敗しても、最後に必ず動くところです。

- kind: code
  heading: "アプリの中では、こう書いてあります"
  caption: "app/page.tsx"
  code: |
    try {
      const res = await fetch("/api/generate-recipe");
      const data = await res.json();
      setRecipe(data.recipe);
    } catch {
      setError("レシピの考案に失敗しました。");
    } finally {
      setGenerating(false);
    }
  reveal: false
  narration: |
    注目してほしいのは、一番下のファイナリーです。
    ここで、考案中という表示を必ず解除しています。
    これが無いと、通信に失敗したとき、ボタンが考案中のまま永久に固まります。

- kind: code
  heading: "サーバーにお願いするときの、決まり文句"
  caption: "fetch"
  code: |
    await fetch("/api/generate-recipe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ingredients, genre }),
    });
  reveal: false
  narration: |
    最後にフェッチ。サーバーにお願いをする道具です。
    1つめが送り先。メソッドに、ゲットかポスト。
    ヘッダーに、JSONを送りますという宣言。そしてボディが、送る中身です。

- kind: verdict
  heading: "送るときは文字列に、受け取ったら戻す"
  sides:
  - badge: "送るとき"
    head: "JSON.stringify"
    desc: "オブジェクト → 文字列"
    at: 1
  - badge: "受け取ったら"
    head: "res.json()"
    desc: "文字列 → オブジェクト"
    at: 2
  narration: |
    そのボディに、ジェイソン・ドット・ストリンギファイと書いてあります。
    通信の線を流れるのは文字だけなので、いったん文字に直して送ります。
    受け取った側は、レスポンス・ドット・ジェイソンでオブジェクトに戻す。
    送るときは文字列に、受け取ったら戻す。セットで覚えてください。

