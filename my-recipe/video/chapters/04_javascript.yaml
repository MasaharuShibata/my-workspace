# my-recipe 開発教材 動画版 第4章
# 原本: my-recipe/tutorial/04_javascript.md
#
# 原本は文法の辞書(変数 → 文字列 → 配列 → …)として並んでいるが、
# 順番になぞると「文法の羅列を聞かされている」だけの動画になる。
# そこで、アプリの中で実際に起きることを3つの問いに立て、その順に組み替えた。
#
#   ① 打ち込んだ一行が、どうやって材料のリストになるのか
#        … 変数 / 文字列 / 配列 / map / filter / 関数 / 比較
#   ② 返ってきたレシピは、コードの中でどんな形をしているのか
#        … オブジェクト / 分割代入 / はてなドット / 三項演算子 / アンド2つ
#   ③ 返事を待っている数秒、コードは何をしているのか
#        … Promise / async / await / try-catch-finally / fetch
#
# モジュール(export / import)はどの問いにも属さないので、最後に短く置く。
#
# デモは PROGRESS.md の割り当てどおり validation / thinking / result の3本。
#   validation … 冒頭。「画面が動いている」ことの実物として
#   result     … 問い②の入口。この画面の中身がオブジェクトだ、と繋ぐ
#   thinking   … 問い③の入口。ほぼ静止した数秒が、そのまま非同期処理の話になる
#
# ⚠️ この章は文法の話が続くぶん、放っておくとナレーションが長くなる。
#    実測の尺は撮影側と噛み合わせること(validation 10.2秒 / thinking 3.4秒 /
#    result 14.9秒)。特に demo スライドのナレーションは上の尺を超えないこと。

title: "JavaScript"
footer: "my-recipe 開発教材 #4"
voice: "ja-JP-NanamiNeural"
rate: "+6%"

slides:

