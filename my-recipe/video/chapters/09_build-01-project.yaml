- kind: code
  heading: "① app/page.tsx は、これだけにする"
  caption: "app/page.tsx"
  code: |
    export default function HomePage() {
      return (
        <main>
          <h1>my-recipe</h1>
          <p>手元にある食材を入力すると、AIがそれらを活かしたレシピを考案します。</p>
        </main>
      );
    }
  reveal: false
  narration: |
    まず、トップページ。元の中身は全部消して、これに置き換えます。
    見出しが1つと、説明文が1行。今日の終わりに画面に出るのは、この2行です。

- kind: code
  heading: "② app/globals.css も、土台だけ"
  caption: "app/globals.css"
  code: |
    >>* {
    >>  box-sizing: border-box;
    >>}

    html, body { margin: 0; padding: 0; }

    body { line-height: 1.65; }

    a { color: inherit; text-decoration: none; }

    button { font-family: inherit; cursor: pointer; }
  reveal: false
  narration: |
    次にCSS。こちらも全部消して、土台だけにします。
    デザインはStep 9でやるので、今は色も配置も書きません。
    余白を消して、リンクの下線を取って、ボタンの見た目を揃える。それだけです。
    強調してあるいちばん上の3行だけ、特別です。

- kind: bigstat
  value: "120"
  unit: "px"
  formula: "width: 100px  ＋  padding: 10px × 2"
  caption: "box-sizing を書かないときの、実際の幅。"
  narration: |
    box-sizing、ボックス・サイジング。これを書かないと、こうなります。
    幅100ピクセルと指定した箱に、内側の余白を10ピクセルずつ足すと、
    実際の幅は120ピクセルになります。指定した数字より、太る。
    border-box と書いておくと、余白ごと100ピクセルに収めてくれます。

- kind: punch
  text: "box-sizing: border-box は、\n最初に必ず書く1行。"
  em: ["最初に必ず書く1行"]
  sub: "これを知らないと、幅が合わない理由が一生わかりません。"
  narration: |
    ボーダー・ボックス。これは、最初に必ず書く1行だと思ってください。
    知らないまま作ると、並べた箱の幅がなぜか合わない、という状態にはまります。

- kind: split
  icon: "browser"
  heading: "③ app/layout.tsx を整える"
  big: "全ページに共通の「枠」"
  small: "HTMLの外側は、このファイルにしかない。\n各ページの中身は、children のところに入る。"
  narration: |
    3つめ、レイアウトです。
    これは、全ページに共通の枠を書くファイルです。
    HTMLの外側の部分は、アプリ中でこのファイルにしかありません。
    そして各ページの中身は、children、チルドレンと書いた場所に入ります。

- kind: code
  heading: "枠に入れておくもの"
  caption: "app/layout.tsx(抜粋)"
  code: |
    const notoSans = Noto_Sans_JP({ weight: ["400","500","700","900"], ... });

    export const metadata: Metadata = {
      title: "my-recipe",
      description: "手元にある食材からAIがレシピを考案するレシピ提案アプリ",
    };

    <html lang="ja" className={notoSans.variable}>
      <body>{children}</body>
    </html>
  reveal: false
  narration: |
    枠に入れておくものは、3つです。
    1つめ、フォント。Noto Sans JP を、Next.jsが自動で同梱してくれます。表示が速くなります。
    2つめ、メタデータ。タブに出るタイトルと、検索結果に出る説明文です。
    3つめ、lang イコール ja。日本語のページだと宣言しておくと、
    読み上げソフトや翻訳が正しく働きます。

