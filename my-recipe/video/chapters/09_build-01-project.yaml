# ============================================================ 問い② 出てきたもの

- kind: agenda
  heading: "2つめ"
  items:
  - { text: "なぜ、この順番で作るのか？", state: "done", at: 0 }
  - { text: "コマンド1つで出てきたものは、何なのか？", state: "now", at: 0 }
  - { text: "なぜ、コードより先に「型」を書くのか？", at: 0 }
  reveal: false
  narration: |
    2つめ。コマンド1つで出てきたものは、何なのか。

- kind: code
  heading: "プロジェクトは、1行で作ります"
  caption: "ターミナル"
  code: |
    npx create-next-app@latest my-recipe
  reveal: false
  narration: |
    作業したいフォルダに移動して、これを打ちます。
    クリエイト・ネクスト・アップ。Next.jsの公式が用意している、ひな形を作るコマンドです。
    最後の my-recipe が、作られるフォルダの名前になります。

- kind: callout
  title: "npx とは"
  text: |
    そのパッケージを、インストールせずに1回だけ実行するコマンド。
    ひな形作りは一度きりなので、手元に残す必要がありません。
  narration: |
    先頭の npx、エヌ・ピー・エックスは、そのパッケージをインストールせずに、
    1回だけ実行するコマンドです。
    ひな形を作るのは一度きりなので、手元に残しておく必要がありません。

- kind: table
  heading: "7つ質問されます。答えはこれです"
  head: ["質問", "答え", "理由"]
  rows:
  - ["TypeScript", "*Yes", "05章の通り。初心者ほど、型の恩恵が大きい"]
  - ["ESLint", "Yes", "書き方のミスを、自動で指摘してくれる"]
  - ["Tailwind CSS", "*No", "*CSSを学ぶのが目的だから"]
  - ["src ディレクトリ", "No", "階層が1つ増えるだけ"]
  - ["App Router", "*Yes", "07章で学んだ新しい方式。必須"]
  - ["Turbopack", "No", "速いが、まだ挙動が変わる。安定を取る"]
  - ["import alias", "No", "既定の @ をそのまま使う"]
  narration: |
    打つと、7つ質問されます。答えはこのとおりです。
    大事なのは3つだけ。TypeScript は Yes。05章でやったとおり、初心者ほど型の恩恵が大きい。
    App Router も Yes。07章で学んだ新しい方式で、ここは必須です。
    そして Tailwind CSS は、No。これだけ、理由を説明します。

- kind: punch
  text: "Tailwind CSS は、あえて No。"
  em: ["あえて No"]
  sub: "CSSを知らないままTailwindを使うと、何も理解できないまま終わります。"
  narration: |
    Tailwind は、実務ではよく使われる便利な道具です。それでもここでは、あえて No にします。
    CSSを知らないままTailwindを使うと、動いたけれど何も分かっていない、で終わるからです。
    まず素のCSSで作って、必要になったら乗り換える。

- kind: code
  heading: "出来上がるのは、これだけ"
  caption: "my-recipe/"
  code: |
    app/
      globals.css        ← 全体のCSS
      layout.tsx         ← 全ページ共通の枠
      page.tsx           ← トップページ("/")
    public/              ← 画像などの置き場
    node_modules/        ← 部品の実体(触らない・Gitに入れない)
    .gitignore
    next.config.mjs      ← Next.jsの設定(今回は空のまま)
    package.json         ← 使う部品の一覧
    tsconfig.json        ← TypeScriptの設定
  reveal: false
  narration: |
    出来上がるのは、これだけです。
    app フォルダの中に、全体のCSSと、全ページ共通の枠と、トップページ。
    node_modules は、ダウンロードされてきた部品の実体です。触りませんし、Gitにも入れません。
    残りは設定ファイル。この章で見るのは、そのうち2つだけです。

- kind: code
  heading: "1つめ。package.json"
  caption: "package.json"
  code: |
    "scripts": {
      "dev": "next dev",       ← npm run dev で開発サーバー起動
      "build": "next build",   ← 公開用に固める
      "start": "next start",   ← 固めたものを動かす
      "lint": "next lint"      ← 書き方のチェック
    }
  reveal: false
  narration: |
    1つめ、package.json。このアプリが使う部品の一覧です。
    見てほしいのは scripts のところ。
    ここに書いた名前が、そのまま npm run 名前 で動かせるコマンドになります。
    さっそく npm run dev と打って、ローカルホスト3000番を開いてください。
    Next.jsの初期画面が出れば、成功です。

- kind: code
  heading: "2つめ。tsconfig.json の、この2行"
  caption: "tsconfig.json"
  code: |
    "strict": true,
    "paths": { "@/*": ["./*"] }
  reveal: false
  narration: |
    2つめ、tsconfig.json。見るのは2行だけです。
    strict は、型チェックを厳しくする設定。必ず true のままにしてください。
    paths のほうは、04章で出てきたアットマークの設定です。
    フォルダのどこから呼んでも、同じファイルを指してくれます。

- kind: callout
  tone: "danger"
  title: "ここだけは、目で確認する"
  text: |
    .gitignore の中に node_modules と .env がある。
    ここを事故ると、取り返しがつきません。
  narration: |
    そして .gitignore を開いて、目で確認してください。
    node_modules と、ドット・イー・エヌ・ブイ。この2つが書いてあることです。
    前者は容量の話ですが、後者は事故の話です。
    APIキーの入ったファイルを一度でも公開の場所に上げると、取り返しがつきません。

