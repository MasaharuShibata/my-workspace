# ============================================================ 問い③ 型

- kind: agenda
  heading: "最後の問い"
  items:
  - { text: "なぜ、この順番で作るのか？", state: "done", at: 0 }
  - { text: "コマンド1つで出てきたものは、何なのか？", state: "done", at: 0 }
  - { text: "なぜ、コードより先に「型」を書くのか？", state: "now", at: 0 }
  reveal: false
  narration: |
    最後の問いです。なぜ、コードより先に、型を書くのか。

- kind: punch
  text: "設計書は、読み返すものではなく、\n先にコードへ写すもの。"
  em: ["先にコードへ写すもの"]
  narration: |
    08章で、どんなデータを扱うかを決めました。
    設計書は、後で読み返すものだと思われがちですが、そうではありません。
    決めたデータの形は、いちばん最初にコードへ写します。

- kind: code
  heading: "lib/types.ts — まずジャンル"
  caption: "lib/types.ts"
  code: |
    export const GENRES = [
      "和食", "洋食", "中華", "イタリアン",
      "韓国料理", "お弁当", "こだわりなし",
    ] as const;

    export type Genre = (typeof GENRES)[number];
  reveal: false
  narration: |
    書くのは lib スラッシュ types.ts、1つのファイルです。
    まずジャンル。7つを並べて、最後に as const と付けます。
    05章でやったとおり、これで、この7つで固定、と宣言したことになります。
    その下のGenreは、いま並べた7つから自動で作られる型です。増やすときは、上の配列に足すだけです。

- kind: code
  heading: "そして、レシピが2種類"
  caption: "lib/types.ts"
  code: |
    export type Recipe = {
      title: string;
      cookingTime: string;
      ingredients: string[];   // 配列
      steps: string[];         // 配列
    };

    export type FavoriteRecipe = {
      id: string;
      title: string;
      cooking_time: string;
      ingredients: string;     // 文字列
      steps: string;           // 文字列
    };
  reveal: false
  narration: |
    次がレシピです。ここで、よく見てください。
    レシピを表す型が、2つあります。
    上のRecipeは、AIが返してきて、画面に出すときの形。
    下のFavoriteRecipeは、データベースに保存されている形です。
    同じレシピなのに、型が2つある。これが、この設計の要です。

- kind: verdict
  heading: "同じレシピ。でも、形が違う"
  sides:
  - badge: "Recipe"
    head: "材料は、配列"
    desc: "AIも画面も、1つずつ扱いたい。\n名前は cookingTime(キャメルケース)。"
    at: 1
  - badge: "FavoriteRecipe"
    head: "材料は、1本の文字列"
    desc: "DBには改行区切りで、素直に入れる。\n名前は cooking_time(スネークケース)。"
    tone: "accent"
    at: 2
  narration: |
    違うのは、材料と手順の形です。
